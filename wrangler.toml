name = "crypto-factory-studios"
main = "worker/index.js"
compatibility_date = "2026-08-24"

[vars]
API_ORIGIN = "https://crypto-factory-studios.onrender.com"

[assets]
directory = "./frontend"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/", "/billing", "/billing.html", "/creator", "/creator.html", "/profile", "/profile.html", "/game", "/game.html", "/api/*", "/play/*", "/health", "/ready", "/games/cryptoquest", "/games/cryptoquest/*"]
