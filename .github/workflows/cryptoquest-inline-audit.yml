name: CryptoQuest Inline Audit

on:
  push:
    paths:
      - '.github/workflows/cryptoquest-inline-audit.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find inline handlers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('frontend/games/cryptoquest/index.html')
          lines=p.read_text().splitlines()
          rx=re.compile(r'\son(?:click|submit|change|input|load|error)\s*=',re.I)
          out=[]
          for i,line in enumerate(lines,1):
              if rx.search(line):
                  out.append(f'{i}: {line[:1200]}')
          Path('frontend/games/cryptoquest/inline-handlers.txt').write_text('\n'.join(out))
          print('\n'.join(out))
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/games/cryptoquest/inline-handlers.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: record CryptoQuest inline handlers'
          git push
