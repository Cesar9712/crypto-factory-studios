name: CryptoQuest Inline Audit

on:
  push:
    paths:
      - '.github/workflows/cryptoquest-inline-audit.yml'

permissions:
  contents: write

env:
  AUDIT_REVISION: "2"

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find inline handlers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('frontend/games/cryptoquest/index.html')
          text=p.read_text()
          rx=re.compile(r'\son(?:click|submit|change|input|load|error)\s*=',re.I)
          out=[]
          for m in rx.finditer(text):
              line=text.count('\n',0,m.start())+1
              a=max(0,m.start()-350); b=min(len(text),m.end()+700)
              out.append(f'=== line {line} {m.group(0).strip()} ===\n{text[a:b]}')
          Path('frontend/games/cryptoquest/inline-handlers.txt').write_text('\n\n'.join(out))
          print('\n\n'.join(out))
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/games/cryptoquest/inline-handlers.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: record CryptoQuest inline handler context'
          git push
