name: CryptoQuest Repair Inline Handler

on:
  push:
    paths:
      - '.github/workflows/cryptoquest-repair-inline.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove inline handler
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          needle=' onerror="this.hidden=true;this.nextElementSibling.hidden=false"'
          for name in ['game.html','index.html']:
              p=Path('frontend/games/cryptoquest')/name
              s=p.read_text()
              if needle not in s:
                  raise SystemExit(f'inline handler not found in {name}')
              p.write_text(s.replace(needle,'',1))
          PY
          ! grep -Eqi '\son(click|submit|change|input|load|error)\s*=' frontend/games/cryptoquest/index.html
          cmp frontend/games/cryptoquest/game.html frontend/games/cryptoquest/index.html
      - name: Commit repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/games/cryptoquest/game.html frontend/games/cryptoquest/index.html
          git commit -m 'fix: remove CryptoQuest inline event handler'
          git push
