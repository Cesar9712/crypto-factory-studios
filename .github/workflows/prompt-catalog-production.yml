name: Prompt Factory Catalog Production

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'backend/app/prompt_catalog_seed.py'
      - 'backend/app/main.py'
      - '.github/workflows/prompt-catalog-production.yml'

jobs:
  verify-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify official marketplace catalog
        shell: bash
        run: |
          set -euo pipefail
          base='https://crypto-factory-studios.onrender.com'
          curl --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors --max-time 30 \
            "$base/api/v1/prompt-factory/marketplace?sort=new&limit=100&offset=0" -o /tmp/catalog.json
          python - <<'PY'
          import json

          data=json.load(open('/tmp/catalog.json'))
          listings=data.get('listings') or []
          official=[row for row in listings if 'cfs-official' in (row.get('tags') or [])]

          expected_categories={
              'AI AGENTS','MARKETING','SOCIAL MEDIA','BUSINESS','CODING','WEB DEVELOPMENT',
              'GAME DEVELOPMENT','WEB3','CRYPTO','DESIGN','IMAGE GENERATION','VIDEO GENERATION',
              'CONTENT CREATION','SEO','YOUTUBE','AUTOMATION','PRODUCTIVITY','EDUCATION','RESEARCH',
              'DATA ANALYSIS','SALES','COPYWRITING','E-COMMERCE','OTHER',
          }
          expected_prices={'0.00','1.99','4.99','9.99','19.99'}

          assert len(official) == 72, f'expected 72 official prompts, got {len(official)}'
          assert {row.get('category') for row in official} == expected_categories
          assert {str(row.get('price_usd')) for row in official} == expected_prices
          assert len({row.get('listing_id') for row in official}) == 72
          assert len({row.get('prompt_id') for row in official}) == 72
          assert len({row.get('slug') for row in official}) == 72
          assert all(row.get('creator_name') for row in official)
          assert all(row.get('license_type') in {'PERSONAL','COMMERCIAL','EXTENDED'} for row in official)
          assert all(row.get('preview_text') for row in official)
          print('PROMPT_FACTORY_OFFICIAL_CATALOG_OK count=72 categories=24 prices=5')
          PY

          slug="$(python - <<'PY'
          import json
          data=json.load(open('/tmp/catalog.json'))
          official=[row for row in data.get('listings',[]) if 'cfs-official' in (row.get('tags') or [])]
          print(official[0]['slug'])
          PY
          )"
          curl --fail --silent --show-error --max-time 30 \
            "$base/api/v1/prompt-factory/listings/$slug" -o /tmp/listing.json
          python - <<'PY'
          import json
          detail=json.load(open('/tmp/listing.json'))
          listing=detail.get('listing') or {}
          assert listing.get('slug','').startswith('cfs-')
          assert listing.get('preview_text')
          assert 'prompt_text' not in listing, 'public listing leaked protected prompt_text'
          assert 'system_instructions' not in listing, 'public listing leaked protected system instructions'
          print('PROMPT_FACTORY_CATALOG_CONTENT_PROTECTION_OK')
          PY
