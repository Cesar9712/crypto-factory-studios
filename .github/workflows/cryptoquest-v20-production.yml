name: CryptoQuest Mobile Production

on:
  push:
    paths:
      - 'frontend/games/cryptoquest/**'
      - 'worker/index.js'
      - '.github/workflows/cryptoquest-v20-production.yml'
  workflow_run:
    workflows: ['Cloudflare Explicit Deploy']
    types: [completed]
  workflow_dispatch:

jobs:
  verify-mobile:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify current mobile rendering and touch targets
        run: |
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='https://crypto-factory-studios.cryptofactorystudios.workers.dev';
          const browser=await chromium.launch({headless:true});
          async function verifyViewport(width,height){
            const ctx=await browser.newContext({viewport:{width,height},isMobile:true,hasTouch:true});
            const page=await ctx.newPage();
            const errors=[]; page.on('pageerror',e=>errors.push(e.message));
            const r=await page.goto(base+'/games/cryptoquest/?qa=mobile-'+width+'-'+Date.now(),{waitUntil:'load',timeout:30000});
            await page.waitForTimeout(900);
            if(r?.status()!==200) throw new Error('HTTP '+r?.status());
            const entry=await page.evaluate(()=>({title:document.title,text:(document.body.innerText||'').slice(0,1200),scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth,input:!!document.querySelector('input:not([type="hidden"])')}));
            if(!entry.title.includes('CryptoQuest RPG')||!entry.text.includes('Elige tu destino')||!entry.input) throw new Error('Entry UI invalid '+JSON.stringify(entry));
            if(entry.scroll>entry.client+2) throw new Error('Entry horizontal overflow '+JSON.stringify(entry));
            const input=page.locator('input:not([type="hidden"])').first();
            await input.fill('R'+width);
            await page.locator('button').filter({hasText:/CONTINUAR/i}).last().click();
            await page.waitForTimeout(250);
            let body=(await page.locator('body').innerText()).slice(0,9000);
            if(body.includes('Selecciona una clase')){
              await page.getByText('GUERRERO',{exact:true}).first().click();
              const start=page.getByRole('button',{name:/COMENZAR AVENTURA/i}).last();
              if(!(await start.count())) throw new Error('Start adventure missing');
              await start.click();
              await page.waitForTimeout(650);
            }
            const metrics=await page.evaluate(()=>{
              const visible=[...document.querySelectorAll('button,a,[role="button"]')].filter(el=>{const s=getComputedStyle(el),r=el.getBoundingClientRect();return s.display!=='none'&&s.visibility!=='hidden'&&r.width>0&&r.height>0});
              const tiny=visible.filter(el=>{const r=el.getBoundingClientRect();return r.width<32||r.height<32;}).length;
              return {scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth,visible:visible.length,tiny};
            });
            console.log('MOBILE',width,metrics);
            if(metrics.scroll>metrics.client+2||metrics.visible<1) throw new Error('Mobile layout invalid '+width+' '+JSON.stringify(metrics));
            if(errors.length) throw new Error('Browser errors '+errors.join(' | '));
            await page.screenshot({path:`cryptoquest-${width}.png`,fullPage:true});
            await ctx.close();
          }
          for(const [w,h] of [[360,800],[390,844],[412,915]]) await verifyViewport(w,h);
          console.log('CRYPTOQUEST_MOBILE_PRODUCTION_OK');
          await browser.close();
          JS
          node verify.mjs
      - name: Upload mobile QA captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cryptoquest-mobile-qa
          path: |
            cryptoquest-360.png
            cryptoquest-390.png
            cryptoquest-412.png
          if-no-files-found: ignore
