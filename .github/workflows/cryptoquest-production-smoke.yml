name: CryptoQuest Production Smoke

on:
  push:
    branches: [main]
    paths:
      - 'frontend/games/cryptoquest/**'
      - 'worker/index.js'
      - '.github/workflows/cryptoquest-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Wait for Cloudflare Workers build
        run: sleep 45
      - name: Verify V5 production runtime and canonical assets
        shell: bash
        env:
          BASE: https://crypto-factory-studios.cryptofactorystudios.workers.dev
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            if curl --fail --silent --show-error --location --max-time 20 -H 'Cache-Control: no-cache' "$BASE/games/cryptoquest/?smoke=${GITHUB_SHA}-${attempt}" -o "$tmp"; then
              if grep -q 'Cargando CryptoQuest' "$tmp" && grep -q 'core/loader.js?v=5.0.0' "$tmp"; then
                ok=1
                break
              fi
            fi
            sleep 20
          done
          test "$ok" = 1
          curl --fail --silent --show-error --location "$BASE/games/cryptoquest/runtime.html?smoke=${GITHUB_SHA}" -o /tmp/runtime.html
          grep -q 'V5-CANONICAL' /tmp/runtime.html
          grep -q 'core/bootstrap.js?v=5.0.0' /tmp/runtime.html
          ! grep -q 'DecompressionStream' /tmp/runtime.html
          curl --fail --silent --show-error --location "$BASE/games/cryptoquest/core/loader.js?smoke=${GITHUB_SHA}" -o /tmp/loader.js
          ! grep -q 'DecompressionStream' /tmp/loader.js
          ! grep -q 'data/p00.txt' /tmp/loader.js
          curl --fail --silent --show-error --location "$BASE/games/cryptoquest/core/bootstrap.js?smoke=${GITHUB_SHA}" -o /tmp/bootstrap.js
          grep -q "version:'5.0.0-canonical'" /tmp/bootstrap.js
      - name: Report
        run: echo 'CryptoQuest V5 canonical runtime is reachable in production without the packed fallback.'
