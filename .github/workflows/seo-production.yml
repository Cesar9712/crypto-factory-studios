name: CFS SEO Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  seo-production:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate SEO source consistency
        env:
          SITE_URL: https://crypto-factory-studios.cryptofactorystudios.workers.dev
        run: python scripts/seo_validate.py
      - name: Validate deployed canonical, robots, sitemap and SEO pages
        run: python scripts/seo_live_validate.py
