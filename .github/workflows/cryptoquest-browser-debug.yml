name: CryptoQuest Browser Debug

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cryptoquest-browser-debug.yml'
      - 'frontend/games/cryptoquest/**'

permissions:
  contents: read

concurrency:
  group: cryptoquest-browser-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check canonical runtime
        run: |
          find frontend/games/cryptoquest/core frontend/games/cryptoquest/systems frontend/games/cryptoquest/player frontend/games/cryptoquest/world frontend/games/cryptoquest/ui frontend/games/cryptoquest/scripts frontend/games/cryptoquest/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/cq-http.log 2>&1 &
          sleep 2
      - name: Verify canonical V5 browser runtime on mobile viewports
        shell: bash
        run: |
          cat > cq-browser-probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const sizes=[{width:360,height:800},{width:390,height:844},{width:412,height:915}];
          let failed=false;
          async function clickText(page,re){
            const list=page.locator('button:visible');
            for(let i=0,n=await list.count();i<n;i++){
              const b=list.nth(i);const t=(await b.innerText()).replace(/\s+/g,' ').trim();
              re.lastIndex=0;if(re.test(t)){await b.click();return true;}
            }
            return false;
          }
          for(const size of sizes){
            const context=await browser.newContext({viewport:size,isMobile:true,hasTouch:true});
            const page=await context.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e.message||e)));
            const response=await page.goto(`http://127.0.0.1:4173/games/cryptoquest/?browser-v5=${size.width}`,{waitUntil:'load',timeout:30000});
            await page.waitForFunction(()=>window.CQArchitecture?.version==='5.0.0-canonical',{timeout:12000}).catch(()=>{});
            await page.waitForTimeout(900);
            let state=await page.evaluate(()=>({
              version:window.CQArchitecture?.version||'',
              architectureVersion:window.CQArchitecture?.store?.select?.(s=>s.meta?.architectureVersion)||null,
              services:Object.keys(window.CQArchitecture?.services||{}),
              machines:Object.keys(window.CQArchitecture?.machines||{}),
              loaderError:document.getElementById('err')?.textContent||'',
              overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),
              text:(document.body?.innerText||'').replace(/\s+/g,' ').slice(0,1200)
            }));
            const required=['navigation','energy','inventory','equipment','economy','skills','quests','talents','worldMap','player'];
            if(response?.status()!==200||errors.length||state.loaderError||state.version!=='5.0.0-canonical'||state.architectureVersion!==5||!required.every(k=>state.services.includes(k))||!state.machines.includes('combat')||state.overflow>4){
              console.error('BOOT_FAIL',size,state,errors);failed=true;await context.close();continue;
            }
            const input=page.locator('input:visible').first();
            if(await input.count()){
              await input.fill(`BrowserHero${size.width}`);
              if(!await clickText(page,/continuar|siguiente|aceptar/i)){failed=true;await context.close();continue;}
              await page.waitForTimeout(250);
              if(!await clickText(page,/guerrero/i)){failed=true;await context.close();continue;}
              await page.waitForTimeout(150);
              if(!await clickText(page,/comenzar aventura|crear héroe|entrar al juego/i)){failed=true;await context.close();continue;}
              await page.waitForTimeout(600);
            }
            const post=await page.evaluate(()=>({
              overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),
              saveKeys:Object.keys(localStorage).filter(k=>/cryptoquest/i.test(k)),
              text:(document.body?.innerText||'').replace(/\s+/g,' ').slice(0,1400)
            }));
            if(errors.length||post.overflow>4||post.saveKeys.length===0||!/INICIO|AVENTURA|HÉROE|BrowserHero/i.test(post.text)){
              console.error('POST_CREATE_FAIL',size,post,errors);failed=true;
            }
            await context.close();
          }
          await browser.close();if(failed)process.exit(1);
          JS
          timeout 150s node cq-browser-probe.mjs
