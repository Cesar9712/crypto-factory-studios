name: CryptoQuest Browser Debug

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cryptoquest-browser-debug.yml'
      - 'frontend/games/cryptoquest/**'

permissions:
  contents: read

env:
  PROBE_REVISION: "10"

jobs:
  browser-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate packed source can be decoded
        shell: bash
        run: |
          python3 - <<'PY'
          import base64,gzip,pathlib
          d=pathlib.Path('frontend/games/cryptoquest/data')
          raw=''.join((d/f'p{i:02}.txt').read_text().strip() for i in range(12))
          html=gzip.decompress(base64.b64decode(raw)).decode('utf-8')
          assert '<html' in html.lower() and '</html>' in html.lower()
          assert 'SPECIALIZATION_SETS' in html and 'UNIQUE_ITEMS' in html
          assert 'function learnTalent(game,id)' in html
          assert 'function spendEnergy(game,amount)' in html
          assert 'function startFightV9' in html
          print('Packed source decoded:', len(html), 'bytes')
          PY
      - name: Syntax check modular runtime
        run: find frontend/games/cryptoquest/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        shell: bash
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/cq-http.log 2>&1 &
          sleep 2
      - name: Run V32 mobile creation gameplay and navigation QA
        shell: bash
        run: |
          cat > cq-probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const sizes=[{width:360,height:800},{width:390,height:844},{width:412,height:915}];
          let failed=false;
          const snapshot=page=>page.evaluate(()=>({
            title:document.title,
            text:(document.body?.innerText||'').replace(/\s+/g,' ').trim().slice(0,1400),
            buttons:[...document.querySelectorAll('button')].filter(b=>b.offsetParent!==null).map(b=>b.innerText.trim()).filter(Boolean).slice(0,80),
            inputs:[...document.querySelectorAll('input')].filter(i=>i.offsetParent!==null).map(i=>({type:i.type,placeholder:i.placeholder,value:i.value})),
            architecture:window.CQArchitecture?.version||'',
            architectureVersion:window.CQArchitecture?.store?.select?.(s=>s.meta?.architectureVersion)||null,
            serviceKeys:window.CQArchitecture?Object.keys(window.CQArchitecture.services||{}):[],
            machineKeys:window.CQArchitecture?Object.keys(window.CQArchitecture.machines||{}):[],
            overflowX:Math.max(0,document.documentElement.scrollWidth-innerWidth),
            loaderError:document.getElementById('err')?.textContent||''
          }));
          async function clickText(page,re){
            const btns=page.locator('button:visible');const count=await btns.count();
            for(let i=0;i<count;i++){const b=btns.nth(i);const t=(await b.innerText()).replace(/\s+/g,' ').trim();re.lastIndex=0;if(re.test(t)){await b.click();return t;}}
            return null;
          }
          async function findGameSaveKey(page){return page.evaluate(()=>Object.keys(localStorage).find(k=>{try{const v=JSON.parse(localStorage.getItem(k));return v?.player&&v?.energy&&v?.saveVersion;}catch{return false;}})||null);}
          for(const size of sizes){
            const context=await browser.newContext({viewport:size,isMobile:true,hasTouch:true});const page=await context.newPage();const errors=[];page.on('pageerror',e=>errors.push(String(e.stack||e.message||e)));
            const response=await page.goto(`http://127.0.0.1:4173/games/cryptoquest/?qa=v32-${size.width}x${size.height}`,{waitUntil:'load',timeout:30000});
            await page.waitForFunction(()=>window.CQArchitecture?.version==='4.0.0-migration',{timeout:12000}).catch(()=>{});await page.waitForTimeout(1200);
            let state=await snapshot(page);const expectedServices=['navigation','energy','inventory','equipment','economy','skills','quests','talents','worldMap','player'];const architectureOk=state.architecture==='4.0.0-migration'&&state.architectureVersion===4&&expectedServices.every(k=>state.serviceKeys.includes(k))&&state.machineKeys.includes('combat');
            if(response?.status()!==200||errors.length||state.loaderError||!architectureOk||state.overflowX>4){console.error('Startup failed',size,errors,state);failed=true;await context.close();continue;}
            const visibleInput=page.locator('input:visible').first();if(await visibleInput.count()){await visibleInput.fill(`QAHero${size.width}`);if(!await clickText(page,/continuar|siguiente|aceptar/i)){failed=true;await context.close();continue;}await page.waitForTimeout(350);}
            if(!await clickText(page,/guerrero/i)){failed=true;await context.close();continue;}await page.waitForTimeout(220);if(!await clickText(page,/comenzar aventura|crear héroe|entrar al juego/i)){failed=true;await context.close();continue;}await page.waitForTimeout(700);
            const saveKey=await findGameSaveKey(page);if(!saveKey){console.error('Game save key missing');failed=true;await context.close();continue;}
            await page.evaluate(key=>{const g=JSON.parse(localStorage.getItem(key));g.player.level=7;g.player.exp=0;g.player.talentPoints=3;g.player.talents=[];g.player.specialization=null;g.energy.current=60;g.energy.max=60;g.energy.lastUpdate=Date.now();localStorage.setItem(key,JSON.stringify(g));},saveKey);
            await page.reload({waitUntil:'load'});await page.waitForTimeout(1000);
            const homeCheck=await page.evaluate(()=>{const stage=document.querySelector('.home-hero-stage');const art=document.querySelector('.hero-art-slot');return {height:stage?.getBoundingClientRect().height||0,artVisible:Boolean(art&&art.offsetParent!==null),overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth)};});
            if(homeCheck.height>300||homeCheck.height<190||homeCheck.artVisible||homeCheck.overflow>4){console.error('Home V32 regression',size,homeCheck);failed=true;await context.close();continue;}
            if(!await clickText(page,/(^|\s)talentos(\s|$)/i)){console.error('Talents nav missing');failed=true;await context.close();continue;}await page.waitForTimeout(350);
            const talentBefore=await page.evaluate(key=>({enabled:document.querySelectorAll('button[data-talent]:not([disabled])').length,points:JSON.parse(localStorage.getItem(key)).player.talentPoints}),saveKey);
            if(talentBefore.enabled<1||talentBefore.points!==3){console.error('Talent availability failed',talentBefore);failed=true;await context.close();continue;}
            await page.locator('button[data-talent]:not([disabled])').first().click();await page.waitForTimeout(350);
            const talentAfter=await page.evaluate(key=>{const g=JSON.parse(localStorage.getItem(key));return {points:g.player.talentPoints,learned:g.player.talents?.length||0};},saveKey);
            if(talentAfter.points!==2||talentAfter.learned<1){console.error('Talent learning failed',talentAfter);failed=true;await context.close();continue;}
            if(!await clickText(page,/(^|\s)aventura(\s|$)/i)){console.error('Adventure nav missing');failed=true;await context.close();continue;}await page.waitForTimeout(350);
            await page.evaluate(()=>{Math.random=()=>0.99;});
            const energyBefore=await page.evaluate(key=>JSON.parse(localStorage.getItem(key)).energy.current,saveKey);const fight=page.locator('button[data-fight]:not([disabled])').first();if(!await fight.count()){console.error('Fight node missing');failed=true;await context.close();continue;}await fight.click();await page.waitForTimeout(500);
            const energyAfter=await page.evaluate(key=>JSON.parse(localStorage.getItem(key)).energy.current,saveKey);
            if(energyAfter!==energyBefore-1){console.error('Campaign energy did not decrease',energyBefore,energyAfter);failed=true;await context.close();continue;}
            const navState=await snapshot(page);if(errors.length||navState.loaderError||navState.overflowX>4){console.error('Gameplay QA failed',errors,navState);failed=true;}
            await context.close();
          }
          await browser.close();if(failed)process.exit(1);
          JS
          timeout 150s node cq-probe.mjs
