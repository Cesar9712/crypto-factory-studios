name: CryptoQuest Browser Debug

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cryptoquest-browser-debug.yml'
      - 'frontend/games/cryptoquest/**'

permissions:
  contents: read

concurrency:
  group: cryptoquest-browser-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check current monolithic runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('frontend/games/cryptoquest/game.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S)
          Path('/tmp/cryptoquest-inline.mjs').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/cryptoquest-inline.mjs
          node --check frontend/games/cryptoquest/v20-battle-pass.js
          test -s frontend/games/cryptoquest/v21-master.css
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/cq-http.log 2>&1 &
          sleep 2
      - name: Verify local browser runtime on mobile viewports
        shell: bash
        run: |
          cat > cq-browser-probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const sizes=[{width:360,height:800},{width:390,height:844},{width:412,height:915}];
          let failed=false;

          async function clickText(page,re){
            const list=page.locator('button:visible');
            for(let i=0,n=await list.count();i<n;i++){
              const b=list.nth(i);
              const t=(await b.innerText()).replace(/\s+/g,' ').trim();
              re.lastIndex=0;
              if(re.test(t)){await b.click();return true;}
            }
            return false;
          }

          for(const size of sizes){
            const context=await browser.newContext({viewport:size,isMobile:true,hasTouch:true});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.stack||e.message||e)));

            const response=await page.goto(
              `http://127.0.0.1:4173/games/cryptoquest/game.html?browser-v21=${size.width}`,
              {waitUntil:'load',timeout:30000}
            );
            await page.waitForTimeout(700);

            const start=await page.evaluate(()=>({
              title:document.title,
              text:(document.body?.innerText||'').replace(/\s+/g,' ').slice(0,1200),
              overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),
              input:!!document.querySelector('input:not([type="hidden"])')
            }));

            if(response?.status()!==200||errors.length||start.overflow>4||!start.input||!/Elige tu destino/i.test(start.text)){
              console.error('BOOT_FAIL',size,start,errors);
              failed=true;await context.close();continue;
            }

            const input=page.locator('input:visible').first();
            await input.fill(`BrowserHero${size.width}`);
            if(!await clickText(page,/continuar/i)){failed=true;await context.close();continue;}
            await page.waitForTimeout(180);
            if(!await clickText(page,/guerrero/i)){failed=true;await context.close();continue;}
            await page.waitForTimeout(120);
            if(!await clickText(page,/comenzar aventura/i)){failed=true;await context.close();continue;}
            await page.waitForTimeout(650);

            const post=await page.evaluate(()=>({
              overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),
              saveKeys:Object.keys(localStorage).filter(k=>/cryptoquest/i.test(k)),
              nav:[...document.querySelectorAll('.bottom-nav > button')].map(x=>(x.textContent||'').trim()),
              cta:!![...document.querySelectorAll('button')].find(x=>/CONTINUAR AVENTURA/i.test(x.textContent||'')),
              text:(document.body?.innerText||'').replace(/\s+/g,' ').slice(0,1800)
            }));

            if(errors.length||post.overflow>4||post.saveKeys.length<2||post.nav.length!==6||!post.cta||!/INICIO|AVENTURA|HÉROE/i.test(post.text)){
              console.error('POST_CREATE_FAIL',size,post,errors);
              failed=true;
            }

            await page.reload({waitUntil:'load'});
            await page.waitForTimeout(450);
            const persisted=await page.evaluate(()=>({
              text:(document.body?.innerText||'').replace(/\s+/g,' ').slice(0,900),
              overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth)
            }));
            if(/Elige tu destino/i.test(persisted.text)||persisted.overflow>4){
              console.error('PERSIST_FAIL',size,persisted);
              failed=true;
            }
            await context.close();
          }

          await browser.close();
          if(failed)process.exit(1);
          console.log('CRYPTOQUEST_BROWSER_V21_OK');
          JS
          timeout 150s node cq-browser-probe.mjs
