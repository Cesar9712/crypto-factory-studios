name: CryptoQuest Repair Items

on:
  push:
    paths:
      - '.github/workflows/cryptoquest-repair-items.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair premature unique item count
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          for name in ['game.html','index.html']:
              p=Path('frontend/games/cryptoquest')/name
              s=p.read_text()
              old="const ITEM_DEFINITION_COUNT=ITEM_VARIANTS.length+Object.keys(UNIQUE_ITEMS).length+Object.keys(MYTHIC_ITEMS).length;"
              new="const ITEM_DEFINITION_COUNT=ITEM_VARIANTS.length;"
              if old not in s:
                  raise SystemExit(f'premature item count not found in {name}')
              p.write_text(s.replace(old,new,1))
          PY
      - name: Syntax check
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('frontend/games/cryptoquest/index.html').read_text()
          Path('/tmp/cq.js').write_text('\n'.join(re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S)))
          PY
          node --check /tmp/cq.js
      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/games/cryptoquest/game.html frontend/games/cryptoquest/index.html
          git commit -m 'fix: defer CryptoQuest unique item accounting'
          git push
