name: CryptoQuest Inspect Startup

on:
  push:
    paths:
      - '.github/workflows/cryptoquest-inspect-startup.yml'
      - 'frontend/games/cryptoquest/game.html'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build startup inspection report
        shell: bash
        run: |
          set -euo pipefail
          F=frontend/games/cryptoquest/game.html
          {
            echo '=== splash / alpha / boot ==='
            grep -Ein -C 8 'ALPHA 0\.1|DARK FANTASY UI|splash|boot|loader|loading' "$F" || true
            echo
            echo '=== startup functions ==='
            grep -Ein -C 5 'DOMContentLoaded|window\.onload|addEventListener\(.?(load|DOMContentLoaded)|setTimeout|requestAnimationFrame|init\(|initialize|startGame|showScreen|screen-' "$F" || true
            echo
            echo '=== script endings ==='
            tail -n 260 "$F"
          } > frontend/games/cryptoquest/startup-report.txt
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/games/cryptoquest/startup-report.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: capture CryptoQuest startup inspection'
          git push
