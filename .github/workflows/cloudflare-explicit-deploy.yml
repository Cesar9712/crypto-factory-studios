name: Cloudflare Explicit Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - 'worker/**'
      - 'wrangler.toml'
      - '.github/workflows/cloudflare-explicit-deploy.yml'

concurrency:
  group: cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy Worker and static assets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'Cloudflare GitHub credentials are not configured; refusing an unauthenticated deploy.'
            exit 2
          fi
          npx --yes wrangler@4 deploy

      - name: Verify production analytics routing
        shell: bash
        run: |
          set -euo pipefail
          base='https://crypto-factory-studios.cryptofactorystudios.workers.dev'
          for path in / /billing.html /creator.html; do
            body="$(curl --location --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
              -H 'Cache-Control: no-cache' "${base}${path}?deploy_sha=${GITHUB_SHA}")"
            if ! grep -Fq '/analytics.js' <<<"${body}"; then
              echo "Analytics injection missing after deploy: ${path}" >&2
              exit 1
            fi
          done

          analytics="$(curl --location --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' "${base}/analytics.js?deploy_sha=${GITHUB_SHA}")"
          for marker in window.cfsAnalytics game_play_clicked billing_view_clicked billing_plan_selected billing_network_selected billing_order_attempted billing_verification_attempted; do
            if ! grep -Fq "${marker}" <<<"${analytics}"; then
              echo "Analytics runtime marker missing after deploy: ${marker}" >&2
              exit 1
            fi
          done
          echo 'CFS_CLOUDFLARE_PRODUCTION_ANALYTICS_OK'

      - name: Verify Prompt Factory deployment
        shell: bash
        run: |
          set -euo pipefail
          base='https://crypto-factory-studios.cryptofactorystudios.workers.dev'
          pf="$(curl --location --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' "${base}/prompt-factory?deploy_sha=${GITHUB_SHA}")"
          for marker in 'PF://MARKETPLACE' '/prompt-factory.js' '/prompt-factory-advanced.js'; do
            if ! grep -Fq "${marker}" <<<"${pf}"; then
              echo "Prompt Factory marker missing after deploy: ${marker}" >&2
              exit 1
            fi
          done

          admin="$(curl --location --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' "${base}/prompt-factory/admin?deploy_sha=${GITHUB_SHA}")"
          for marker in 'PF://ADMIN' '/prompt-factory-admin.js'; do
            if ! grep -Fq "${marker}" <<<"${admin}"; then
              echo "Prompt Factory admin marker missing after deploy: ${marker}" >&2
              exit 1
            fi
          done

          advanced="$(curl --location --fail --silent --show-error --retry 8 --retry-delay 3 --retry-all-errors \
            -H 'Cache-Control: no-cache' "${base}/prompt-factory-advanced.js?deploy_sha=${GITHUB_SHA}")"
          for marker in 'checkout-advanced' 'reconcile-advanced' 'creator/profile' 'collection-offers'; do
            if ! grep -Fq "${marker}" <<<"${advanced}"; then
              echo "Prompt Factory advanced runtime marker missing: ${marker}" >&2
              exit 1
            fi
          done
          echo 'CFS_CLOUDFLARE_PROMPT_FACTORY_OK'
