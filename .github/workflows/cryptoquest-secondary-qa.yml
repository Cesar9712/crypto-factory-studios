name: CryptoQuest Secondary QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cryptoquest-secondary-qa.yml'
      - 'frontend/games/cryptoquest/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secondary-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start frontend
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/cq-http.log 2>&1 &
          sleep 2
      - name: Run persistence secondary systems and combat QA
        shell: bash
        run: |
          cat > cq-secondary.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(String(e.stack||e.message||e)));

          const snap=()=>page.evaluate(()=>({
            text:(document.body?.innerText||'').replace(/\s+/g,' ').trim().slice(0,2400),
            buttons:[...document.querySelectorAll('button')].filter(b=>b.offsetParent!==null).map(b=>b.innerText.replace(/\s+/g,' ').trim()).filter(Boolean).slice(0,120),
            overflowX:document.documentElement.scrollWidth-innerWidth,
            boot:Boolean(document.querySelector('.boot-state')),
            presentation:document.documentElement.dataset.cqPresentation||'',
            storage:[...Array(localStorage.length)].map((_,i)=>localStorage.key(i))
          }));
          const assertClean=async label=>{const s=await snap();console.log(label,JSON.stringify(s));if(errors.length||s.boot||s.overflowX>4)throw new Error(`${label} failed: ${errors.join(' | ')} overflow=${s.overflowX}`);return s};
          async function click(re,required=true,scope='button:visible'){
            const btns=page.locator(scope);
            const n=await btns.count();
            for(let i=0;i<n;i++){
              const b=btns.nth(i); const t=(await b.innerText()).replace(/\s+/g,' ').trim(); re.lastIndex=0;
              if(re.test(t)){await b.click();await page.waitForTimeout(280);return t;}
            }
            if(required)throw new Error(`Button missing: ${re} scope=${scope}`); return null;
          }
          async function nav(label){
            const hit=await click(new RegExp(`^${label}$`,'i'),false,'.bottom-nav button:visible');
            if(!hit)throw new Error(`Bottom nav label missing: ${label}`);
          }
          async function auditBackTarget(label){
            const back=page.locator('.back-service:visible').first();
            if(!(await back.count()))return;
            await back.click({trial:true});
            const result=await back.evaluate(b=>{
              const r=b.getBoundingClientRect();
              const st=getComputedStyle(b);
              return {rect:{left:r.left,top:r.top,right:r.right,bottom:r.bottom,width:r.width,height:r.height},zIndex:st.zIndex,pointerEvents:st.pointerEvents};
            });
            console.log(`BACK_TARGET_${label}`,JSON.stringify(result));
            if(result.rect.width<44||result.rect.height<30||result.pointerEvents==='none')
              throw new Error(`Back button hit target invalid on ${label}: ${JSON.stringify(result)}`);
          }

          async function applyProductionVisual(){
            await page.evaluate(()=>{document.documentElement.dataset.cqVisual='v20';});
            await page.addStyleTag({url:'http://127.0.0.1:4173/games/cryptoquest/v20-premium.css'});
            await page.addStyleTag({url:'http://127.0.0.1:4173/games/cryptoquest/v21-master.css'});
          }

          await page.goto('http://127.0.0.1:4173/games/cryptoquest/game.html?secondary=v21',{waitUntil:'load',timeout:30000});
          await applyProductionVisual();
          await page.waitForTimeout(700);
          let s=await assertClean('CREATE_START');
          const input=page.locator('input:visible').first();
          if(await input.count()){
            await input.fill('PersistenceHero');
            await click(/continuar/i);
            await click(/guerrero/i);
            await click(/comenzar aventura/i);
            await page.waitForTimeout(600);
          }
          s=await assertClean('HOME_CREATED');
          if(!/PersistenceHer/i.test(s.text))throw new Error('Created hero not visible after expected name limit');
          if(!s.storage.includes('cryptoquest-rpg-save-v1')||!s.storage.includes('cryptoquest-rpg-save-v1-backup'))throw new Error('Primary/backup save keys missing');

          await page.reload({waitUntil:'load'});
          await applyProductionVisual();
          await page.waitForTimeout(700);
          s=await assertClean('AFTER_RELOAD');
          if(!/PersistenceHer/i.test(s.text)||/elige tu destino/i.test(s.text))throw new Error('Persistence failed after reload');

          const secondary=['BASTIÓN','MISIONES','EXPEDICIONES','MAZMORRAS','LOGROS'];
          for(const name of secondary){
            await nav('MÁS');
            await click(new RegExp(name,'i'));
            await assertClean(`SECONDARY_${name}`);
            await auditBackTarget(name);
          }

          await nav('HÉROE');
          for(const tab of ['HABILIDADES','EQUIPO']){
            const hit=await click(new RegExp(tab,'i'),false);
            if(hit)await assertClean(`HERO_${tab}`);
          }

          await nav('AVENTURA');
          await assertClean('ADVENTURE');
          const goblin=await click(/goblin/i,false);
          if(goblin){
            s=await assertClean('GOBLIN_OPEN');
            const start=await click(/combatir|iniciar|entrar|atacar|batalla/i,false);
            if(start){
              s=await assertClean('COMBAT_OPEN');
              const basic=await click(/ataque básico|atacar|golpear|básico/i,false);
              if(basic)await assertClean('COMBAT_ONE_ACTION');
            }
          } else {
            console.log('No Goblin button exposed; adventure page still clean.');
          }

          console.log('SECONDARY_QA_OK');
          await browser.close();
          JS
          timeout 100s node cq-secondary.mjs
