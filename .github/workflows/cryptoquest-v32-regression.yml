name: CryptoQuest V21 Visual Regression

on:
  push:
    branches: [main]
    paths:
      - 'frontend/games/cryptoquest/**'
      - '.github/workflows/cryptoquest-v32-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cryptoquest-v21-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v21-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start frontend
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/cq-http.log 2>&1 &
          sleep 2
      - name: Test V21 visual system and mobile interaction
        shell: bash
        run: |
          mkdir -p v21-shots
          cat > v21-probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const sizes=[{width:360,height:800},{width:390,height:844},{width:412,height:915},{width:430,height:932}];
          let failed=false;

          async function clickText(page,re,scope='button:visible'){
            const list=page.locator(scope);
            for(let i=0,n=await list.count();i<n;i++){
              const b=list.nth(i);
              const t=(await b.innerText()).replace(/\s+/g,' ').trim();
              re.lastIndex=0;
              if(re.test(t)){await b.click();return true;}
            }
            return false;
          }

          for(const size of sizes){
            const context=await browser.newContext({viewport:size,isMobile:true,hasTouch:true});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(String(e.message||e)));

            await page.goto(`http://127.0.0.1:4173/games/cryptoquest/game.html?v21qa=${size.width}`,{waitUntil:'load'});
            await page.evaluate(()=>{document.documentElement.dataset.cqVisual='v20';});
            await page.addStyleTag({url:'http://127.0.0.1:4173/games/cryptoquest/v20-premium.css'});
            await page.addStyleTag({url:'http://127.0.0.1:4173/games/cryptoquest/v21-master.css'});
            await page.waitForTimeout(250);

            const input=page.locator('input:visible').first();
            await input.fill(`V21Hero${size.width}`);
            if(!await clickText(page,/continuar/i)){failed=true;await context.close();continue;}
            await page.waitForTimeout(120);
            if(!await clickText(page,/guerrero/i)){failed=true;await context.close();continue;}
            await page.waitForTimeout(100);
            if(!await clickText(page,/comenzar aventura/i)){failed=true;await context.close();continue;}
            await page.waitForTimeout(450);

            const visual=await page.evaluate(()=>{
              const stage=document.querySelector('.home-hero-stage');
              const sr=stage?.getBoundingClientRect();
              const cta=[...document.querySelectorAll('button')].find(b=>/CONTINUAR AVENTURA/i.test(b.textContent||''));
              const cr=cta?.getBoundingClientRect();
              const cs=cta?getComputedStyle(cta):null;
              const nav=document.querySelector('.bottom-nav');
              return {
                overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),
                nav:nav?.querySelectorAll(':scope > button').length||0,
                stage:sr?{w:sr.width,h:sr.height,r:getComputedStyle(stage).borderRadius}:null,
                cta:cr?{w:cr.width,h:cr.height,writingMode:cs.writingMode}:null,
                quest:!!document.querySelector('.main-quest'),
                quick:!!document.querySelector('.home-quick'),
                colors:{
                  body:getComputedStyle(document.body).color,
                  nav:getComputedStyle(nav).backgroundImage
                }
              };
            });

            console.log('V21_VISUAL',size,visual,errors);
            if(errors.length||visual.overflow>4||visual.nav!==6||!visual.quest||!visual.quick||!visual.stage||visual.stage.h<220||!visual.cta||visual.cta.w<Math.min(300,size.width-40)||visual.cta.h<44||visual.cta.writingMode!=='horizontal-tb'){
              failed=true;await context.close();continue;
            }

            await clickText(page,/^MÁS$/i,'.bottom-nav button:visible');
            await page.waitForTimeout(160);
            if(await clickText(page,/BASTIÓN/i)){
              await page.waitForTimeout(160);
              const back=page.locator('.back-service:visible').first();
              if(await back.count())await back.click({trial:true});
            }

            await page.screenshot({path:`v21-shots/home-${size.width}.png`,fullPage:true});
            await context.close();
          }

          await browser.close();
          if(failed)process.exit(1);
          console.log('CRYPTOQUEST_V21_VISUAL_REGRESSION_OK');
          JS
          set +e
          node v21-probe.mjs 2>&1 | tee v21-regression.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload V21 visual diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v21-master-visual-qa
          path: |
            v21-regression.log
            v21-shots/
          retention-days: 3
