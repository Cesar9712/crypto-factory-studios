name: CryptoQuest Repair Runtime

on:
  push:
    paths:
      - '.github/workflows/cryptoquest-repair-runtime.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Repair initialization order and publish direct runtime
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/games/cryptoquest/game.html')
          s=p.read_text()
          old="  ...SPECIALIZATION_SETS\n};"
          if old not in s:
              raise SystemExit('premature SPECIALIZATION_SETS spread not found')
          s=s.replace(old,"};",1)
          declaration="const SPECIALIZATION_SETS=Object.fromEntries(Object.values(SPECIALIZATIONS_V4).flat().map(s=>[`${s.id}Set`,{id:`${s.id}Set`,name:s.setName,specialization:s.id,bonuses:SET_EFFECTS[s.id]}]));"
          if declaration not in s:
              raise SystemExit('SPECIALIZATION_SETS declaration not found')
          s=s.replace(declaration,declaration+"\nObject.assign(SETS,SPECIALIZATION_SETS);",1)
          p.write_text(s)
          Path('frontend/games/cryptoquest/index.html').write_text(s)
          PY
          cmp frontend/games/cryptoquest/game.html frontend/games/cryptoquest/index.html
          grep -q 'Object.assign(SETS,SPECIALIZATION_SETS)' frontend/games/cryptoquest/game.html
      - name: Syntax check repaired runtime
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path('frontend/games/cryptoquest/game.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S)
          Path('/tmp/cq.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/cq.js
      - name: Commit repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/games/cryptoquest/game.html frontend/games/cryptoquest/index.html
          git commit -m 'fix: boot CryptoQuest runtime directly'
          git push
