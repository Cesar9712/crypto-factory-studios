name: CryptoQuest Core Production

on:
  push:
    paths:
      - 'frontend/games/cryptoquest/**'
      - 'frontend/index.html'
      - 'frontend/billing.html'
      - 'frontend/billing.js'
      - 'frontend/creator.html'
      - 'frontend/profile.html'
      - 'frontend/game.html'
      - 'frontend/analytics.js'
      - 'worker/index.js'
      - 'wrangler.toml'
      - '.github/workflows/cryptoquest-v19-production.yml'
  workflow_run:
    workflows: ['Cloudflare Explicit Deploy']
    types: [completed]
  workflow_dispatch:

jobs:
  verify-core:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify current production boot and player creation
        run: |
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='https://crypto-factory-studios.cryptofactorystudios.workers.dev';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:412,height:915},isMobile:true,hasTouch:true});

          // Guard portal and monetization pages -> Worker -> first-party analytics.
          // No synthetic conversions are sent; this only verifies delivery and
          // presence of the funnel instrumentation used by real interactions.
          for(const path of ['/', '/billing.html', '/creator.html']){
            const response=await context.request.get(base+path+'?qa=analytics-'+Date.now(),{headers:{'cache-control':'no-cache'}});
            const html=await response.text();
            if(response.status()!==200||!html.includes('/analytics.js')) throw new Error(`Analytics injection missing in production: ${path}`);
          }
          const analyticsResponse=await context.request.get(base+'/analytics.js?qa='+Date.now(),{headers:{'cache-control':'no-cache'}});
          const analyticsJs=await analyticsResponse.text();
          const requiredEvents=['game_play_clicked','billing_view_clicked','billing_plan_selected','billing_network_selected','billing_order_attempted','billing_verification_attempted'];
          if(analyticsResponse.status()!==200||!analyticsJs.includes('window.cfsAnalytics')||!analyticsJs.includes('us.i.posthog.com/i/v0/e/')) throw new Error('First-party analytics runtime missing or invalid');
          for(const event of requiredEvents){if(!analyticsJs.includes(event))throw new Error(`Analytics funnel event missing: ${event}`)}
          console.log('CFS_ANALYTICS_EDGE_OK',JSON.stringify({asset:analyticsResponse.status(),events:requiredEvents.length}));

          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          const response=await page.goto(base+'/games/cryptoquest/?qa=core-'+Date.now(),{waitUntil:'load',timeout:30000});
          await page.waitForTimeout(1000);
          const boot=await page.evaluate(()=>({title:document.title,text:(document.body.innerText||'').slice(0,1600),scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth}));
          console.log('BOOT',boot);
          if(response?.status()!==200||!boot.title.includes('CryptoQuest RPG')||!boot.text.includes('Elige tu destino')) throw new Error('Current CryptoQuest production boot failed');
          if(boot.scroll>boot.client+2) throw new Error('Horizontal overflow on entry screen');
          const input=page.locator('input:not([type="hidden"])').first();
          if(!(await input.count())) throw new Error('Hero name input missing');
          await input.fill('QACORE');
          const cont=page.locator('button').filter({hasText:/CONTINUAR/i}).last();
          if(!(await cont.count())) throw new Error('Continue button missing');
          await cont.click();
          await page.waitForTimeout(300);
          let text=(await page.locator('body').innerText()).slice(0,9000);
          if(text.includes('Selecciona una clase')){
            const warrior=page.getByText('GUERRERO',{exact:true}).first();
            if(!(await warrior.count())) throw new Error('Warrior class option missing');
            await warrior.click();
            const start=page.getByRole('button',{name:/COMENZAR AVENTURA/i}).last();
            if(!(await start.count())) throw new Error('Start adventure button missing');
            await start.click();
            await page.waitForTimeout(700);
          }
          text=(await page.locator('body').innerText()).slice(0,9000);
          if(text.includes('Elige tu destino')||text.includes('Selecciona una clase')) throw new Error('Character creation did not enter the game');
          const layout=await page.evaluate(()=>({scroll:document.documentElement.scrollWidth,client:document.documentElement.clientWidth,buttons:[...document.querySelectorAll('button')].filter(x=>{const r=x.getBoundingClientRect();return r.width>0&&r.height>0}).length}));
          if(layout.scroll>layout.client+2||layout.buttons<1) throw new Error('In-game mobile layout invalid '+JSON.stringify(layout));
          if(errors.length) throw new Error('Browser page errors: '+errors.join(' | '));
          console.log('CRYPTOQUEST_CORE_PRODUCTION_OK',JSON.stringify(layout));
          await browser.close();
          JS
          node verify.mjs
