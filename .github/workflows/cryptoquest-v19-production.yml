name: CryptoQuest V19 Production

on:
  push:
    paths:
      - 'frontend/games/cryptoquest/v19-release.json'
      - 'frontend/games/cryptoquest/game.html'
      - '.github/workflows/cryptoquest-v19-production.yml'
  workflow_run:
    workflows: ['Cloudflare Explicit Deploy']
    types: [completed]
  workflow_dispatch:

jobs:
  verify-v19:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright Chromium
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify V19 mobile UI and energy on production
        shell: bash
        run: |
          cat > verify-v19.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='https://crypto-factory-studios.cryptofactorystudios.workers.dev';
          const url=base+'/games/cryptoquest/';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:412,height:915},isMobile:true,hasTouch:true});
          const page=await context.newPage();
          const pageErrors=[];
          page.on('pageerror',e=>pageErrors.push(e.stack||e.message));

          let ready=false,last={};
          for(let attempt=1;attempt<=30;attempt++){
            try{
              const r=await page.goto(url+'?v19='+Date.now(),{waitUntil:'load',timeout:30000});
              await page.waitForTimeout(1000);
              last=await page.evaluate(()=>({
                status:document.readyState,
                title:document.title,
                href:location.href,
                boot:Boolean(document.querySelector('.boot-state')),
                recoverable:Boolean(document.querySelector('.recoverable-error')),
                v19:Boolean(document.querySelector('#cq-v19-reference-ui')),
                text:(document.body.innerText||'').slice(0,1200)
              }));
              console.log('boot attempt',attempt,'http',r?.status(),JSON.stringify(last));
              if(r?.status()===200 && last.v19 && last.title.includes('V19 Energy') && !last.boot && !last.recoverable && last.text.includes('Elige tu destino')){ready=true;break;}
            }catch(e){console.log('boot attempt',attempt,'error',e.message)}
            await new Promise(r=>setTimeout(r,5000));
          }
          if(!ready)throw new Error('V19 did not become playable in production: '+JSON.stringify(last));

          // Verify the production runtime actually contains the intended V19 energy mechanics.
          const sourceResponse=await context.request.get(base+'/games/cryptoquest/game.html?qa='+Date.now());
          if(sourceResponse.status()!==200)throw new Error('game.html source unavailable: '+sourceResponse.status());
          const source=await sourceResponse.text();
          const sourceChecks={
            regen:/regenMs\s*:\s*300000/.test(source),
            campaign:/campaignEnergyCost/.test(source),
            expedition:/expeditionEnergyCost/.test(source),
            spend:/spendEnergy/.test(source),
            refund:/refundEnergy\(game\s*,\s*cost\)/.test(source),
            capacity:/energyCapacityFor/.test(source),
            bastion:/Bast[ií]on|safeZone|inSafeZone/i.test(source),
            ui:/id=["']cq-v19-reference-ui["']/.test(source)
          };
          console.log('SOURCE_CHECKS',sourceChecks);
          if(Object.values(sourceChecks).some(v=>!v))throw new Error('V19 energy source checks failed: '+JSON.stringify(sourceChecks));

          // Create a hero through the same touch UI a player uses.
          const nameInput=page.locator('input:not([type="hidden"])').first();
          if(await nameInput.count()) await nameInput.fill('QAENERGY');

          async function tryContinue(){
            const candidates=[
              page.getByRole('button',{name:/continuar/i}).last(),
              page.locator('button').filter({hasText:/CONTINUAR/i}).last(),
              page.locator('[data-action*="continue" i]').last()
            ];
            for(const c of candidates){
              try{if(await c.count() && await c.isVisible()){await c.click();return true;}}catch{}
            }
            return false;
          }

          await tryContinue();
          await page.waitForTimeout(800);
          let body=(await page.locator('body').innerText()).slice(0,5000);
          if(body.includes('Elige tu destino')){
            const selectors=['[data-class]','[data-archetype]','.class-card','.class-option','.hero-class','button:not(:has-text("CONTINUAR"))'];
            for(const sel of selectors){
              const options=page.locator(sel);
              const n=Math.min(await options.count(),8);
              let advanced=false;
              for(let i=0;i<n;i++){
                const option=options.nth(i);
                try{
                  if(!(await option.isVisible()))continue;
                  const txt=((await option.innerText().catch(()=>''))||'').trim();
                  if(txt==='›'||txt==='‹'||/continuar/i.test(txt))continue;
                  await option.click();
                  await tryContinue();
                  await page.waitForTimeout(500);
                  body=(await page.locator('body').innerText()).slice(0,5000);
                  if(!body.includes('Elige tu destino')){advanced=true;break;}
                }catch{}
              }
              if(advanced)break;
            }
          }

          body=(await page.locator('body').innerText()).slice(0,8000);
          console.log('POST_CREATE_TEXT',body.slice(0,1800));
          if(body.includes('Elige tu destino'))throw new Error('Could not enter the game through the player UI');
          if(!/60\s*\/\s*60/.test(body))throw new Error('Initial 60/60 energy is not visible after character creation');

          // Confirm the saved game also persisted the energy model, without reaching into private JS functions.
          const persisted=await page.evaluate(()=>{
            const rows=[];
            for(let i=0;i<localStorage.length;i++){
              const key=localStorage.key(i),raw=localStorage.getItem(key);
              let parsed=null;try{parsed=JSON.parse(raw)}catch{}
              rows.push({key,raw,parsed});
            }
            function findEnergy(value,path=''){
              if(!value||typeof value!=='object')return null;
              if(value.energy&&typeof value.energy==='object'&&Number.isFinite(value.energy.current)&&Number.isFinite(value.energy.max))return {path:path+'.energy',...value.energy};
              for(const [k,v] of Object.entries(value)){const hit=findEnergy(v,path+'.'+k);if(hit)return hit;}
              return null;
            }
            for(const row of rows){const hit=findEnergy(row.parsed,row.key);if(hit)return {key:row.key,energy:hit};}
            return {keys:rows.map(r=>r.key),energy:null};
          });
          console.log('PERSISTED_ENERGY',JSON.stringify(persisted));
          if(!persisted.energy || persisted.energy.current!==60 || persisted.energy.max<60)throw new Error('Persisted initial energy model invalid: '+JSON.stringify(persisted));

          // Navigate to Adventure from the real bottom navigation and verify activity costs are visible.
          const adventureLinks=page.locator('button,a,[role="button"]').filter({hasText:/Aventura/i});
          let openedAdventure=false;
          for(let i=(await adventureLinks.count())-1;i>=0;i--){
            try{const el=adventureLinks.nth(i);if(await el.isVisible()){await el.click();openedAdventure=true;break;}}catch{}
          }
          if(!openedAdventure)throw new Error('Adventure navigation control not found');
          await page.waitForTimeout(600);
          const adventureText=(await page.locator('body').innerText()).slice(0,10000);
          console.log('ADVENTURE_TEXT',adventureText.slice(0,2200));
          if(!/⚡\s*3|3\s*⚡/.test(adventureText))throw new Error('Normal encounter energy cost (3) is not visible in Adventure');

          // If an accessible 3-energy encounter button is present, start it and confirm persisted energy drops.
          const costButtons=page.locator('button').filter({hasText:/⚡\s*3|3\s*⚡/});
          if(await costButtons.count()){
            const first=costButtons.first();
            if(await first.isVisible()){
              await first.click();
              await page.waitForTimeout(600);
              const after=await page.evaluate(()=>{
                function scan(value){
                  if(!value||typeof value!=='object')return null;
                  if(value.energy&&typeof value.energy==='object'&&Number.isFinite(value.energy.current))return value.energy.current;
                  for(const v of Object.values(value)){const h=scan(v);if(h!==null)return h;}
                  return null;
                }
                for(let i=0;i<localStorage.length;i++){try{const h=scan(JSON.parse(localStorage.getItem(localStorage.key(i))));if(h!==null)return h}catch{}}
                return null;
              });
              console.log('ENERGY_AFTER_REAL_ENCOUNTER_CLICK',after);
              if(after!==null && after>57)throw new Error('Starting a 3-energy encounter did not charge energy as expected: '+after);
            }
          }

          if(pageErrors.length)throw new Error('page errors: '+pageErrors.join('\n'));
          console.log('CRYPTOQUEST_V19_PRODUCTION_OK');
          await browser.close();
          JS
          node verify-v19.mjs
