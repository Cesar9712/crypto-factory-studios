name: CryptoQuest V19 Production

on:
  push:
    paths:
      - 'frontend/games/cryptoquest/v19-release.json'
      - 'frontend/games/cryptoquest/game.html'
      - '.github/workflows/cryptoquest-v19-production.yml'
  workflow_run:
    workflows: ['Cloudflare Explicit Deploy']
    types: [completed]
  workflow_dispatch:

jobs:
  verify-v19:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify production boot, player flow and real energy charge
        run: |
          cat > verify.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='https://crypto-factory-studios.cryptofactorystudios.workers.dev';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:412,height:915},isMobile:true,hasTouch:true});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));

          async function persistedEnergy(){
            return page.evaluate(()=>{
              function find(v){
                if(!v||typeof v!=='object')return null;
                if(v.energy&&Number.isFinite(v.energy.current)&&Number.isFinite(v.energy.max))return {current:v.energy.current,max:v.energy.max,regenMs:v.energy.regenMs};
                for(const x of Object.values(v)){const h=find(x);if(h)return h;}
                return null;
              }
              for(let i=0;i<localStorage.length;i++){
                try{const h=find(JSON.parse(localStorage.getItem(localStorage.key(i))));if(h)return h;}catch{}
              }
              return null;
            });
          }

          const response=await page.goto(base+'/games/cryptoquest/?qa='+Date.now(),{waitUntil:'load',timeout:30000});
          await page.waitForTimeout(1200);
          const boot=await page.evaluate(()=>({title:document.title,href:location.href,v19:!!document.querySelector('#cq-v19-reference-ui'),splash:!!document.querySelector('.boot-state'),recoverable:!!document.querySelector('.recoverable-error'),text:(document.body.innerText||'').slice(0,1500)}));
          console.log('BOOT',JSON.stringify(boot));
          if(response?.status()!==200||!boot.title.includes('V19 Energy')||!boot.v19||boot.splash||boot.recoverable||!boot.text.includes('Elige tu destino')) throw new Error('V19 mobile boot failed');

          const srcResp=await context.request.get(base+'/games/cryptoquest/game.html?source='+Date.now());
          const source=await srcResp.text();
          const mechanics={regen:/regenMs|ENERGY_REGEN|300000|300_000|5\s*\*\s*60\s*\*\s*1000/i.test(source),campaign:/campaignEnergyCost/.test(source),expedition:/expeditionEnergyCost/.test(source),spending:/spendEnergy/.test(source),refund:/refundEnergy\(game\s*,\s*cost\)/.test(source),capacity:/energyCapacityFor/.test(source),bastion:/Bast[ií]on|inSafeZone|safeZone/i.test(source)};
          console.log('MECHANICS',mechanics);
          if(srcResp.status()!==200||Object.values(mechanics).some(v=>!v)) throw new Error('Energy mechanics missing from production runtime');

          const input=page.locator('input:not([type="hidden"])').first();
          if(await input.count()) await input.fill('QAENERGY');
          const continueButton=page.locator('button').filter({hasText:/CONTINUAR/i}).last();
          if(!(await continueButton.count())) throw new Error('Continue button missing');
          await continueButton.click();
          await page.waitForTimeout(700);
          let text=(await page.locator('body').innerText()).slice(0,9000);
          if(text.includes('Selecciona una clase')){
            const warrior=page.getByText('GUERRERO',{exact:true}).first();
            if(!(await warrior.count())) throw new Error('Warrior class option missing');
            await warrior.click();
            await page.waitForTimeout(250);
            const start=page.getByRole('button',{name:/COMENZAR AVENTURA/i}).last();
            if(!(await start.count())) throw new Error('Start adventure button missing');
            await start.click();
            await page.waitForTimeout(900);
          }

          text=(await page.locator('body').innerText()).slice(0,9000);
          console.log('HOME',text.slice(0,2200));
          if(text.includes('Elige tu destino')||text.includes('Selecciona una clase')) throw new Error('Character creation did not enter the game');
          if(!/60\s*\/\s*60/.test(text)) throw new Error('60/60 energy is not visible on a fresh hero');
          const initial=await persistedEnergy();
          console.log('SAVED_ENERGY',JSON.stringify(initial));
          if(!initial||initial.current!==60||initial.max<60||initial.regenMs!==300000) throw new Error('Fresh hero energy was not persisted correctly');

          const adventure=page.locator('button,a,[role="button"]').filter({hasText:/Aventura/i});
          let opened=false;
          for(let i=(await adventure.count())-1;i>=0;i--){try{const el=adventure.nth(i);if(await el.isVisible()){await el.click();opened=true;break;}}catch{}}
          if(!opened) throw new Error('Adventure navigation missing');
          await page.waitForTimeout(500);
          console.log('ADVENTURE',(await page.locator('body').innerText()).slice(0,3000));

          const enterZone=page.getByRole('button',{name:/ENTRAR EN BOSQUE SOMBRÍO/i}).last();
          if(!(await enterZone.count())) throw new Error('Bosque Sombrío entry button missing');
          await enterZone.click();
          await page.waitForTimeout(500);

          // Dynamic world events are legitimate gameplay overlays. Dismiss them before
          // selecting the deterministic normal encounter used by this production probe.
          const eventOverlay=page.locator('.event-decision');
          if(await eventOverlay.count() && await eventOverlay.isVisible()){
            const ignore=page.getByRole('button',{name:/IGNORAR/i}).last();
            if(!(await ignore.count())) throw new Error('Dynamic event overlay appeared without an Ignore action');
            await ignore.click();
            await page.waitForTimeout(450);
          }

          let after=await persistedEnergy();
          let stageText=(await page.locator('body').innerText()).slice(0,7000);
          console.log('AFTER_ZONE',JSON.stringify(after),stageText.slice(0,2600));

          if(!after||after.current===60){
            const goblin=page.locator('button[data-fight="0:0"]').first();
            if(!(await goblin.count())) throw new Error('Normal Goblin encounter button missing');
            await goblin.click({force:true});
            await page.waitForTimeout(900);
            after=await persistedEnergy();
            stageText=(await page.locator('body').innerText()).slice(0,7000);
            console.log('AFTER_ENCOUNTER',JSON.stringify(after),stageText.slice(0,2600));
          }

          if(!after) throw new Error('Energy disappeared from persisted game state');
          if(after.current!==57) throw new Error('Normal encounter must charge exactly 3 energy; got '+after.current+' from 60');
          if(!/HP|Goblin|TURNO|COMBATE/i.test(stageText)) throw new Error('Normal encounter did not reach a battle/encounter state');
          if(errors.length) throw new Error('Browser page errors: '+errors.join(' | '));
          console.log('CRYPTOQUEST_V19_PRODUCTION_OK',JSON.stringify({initial:initial.current,after:after.current,cost:initial.current-after.current}));
          await browser.close();
          JS
          node verify.mjs
