name: CFS QA

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run Python test suite
        run: pytest -q
      - name: Validate production E2E script
        run: python -m py_compile scripts/production_e2e.py
      - name: Validate frontend JavaScript
        run: |
          node --check frontend/app.js
          node --check frontend/creator.js
          node --check frontend/billing.js
          node --check frontend/game.js
          node --check frontend/profile.js
          node --check worker/index.js
      - name: Validate Wrangler configuration
        run: npx --yes wrangler@4 deploy --dry-run

  postgres-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cfs
          POSTGRES_PASSWORD: cfs_test_password
          POSTGRES_DB: cfs_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cfs -d cfs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cfs:cfs_test_password@127.0.0.1:5432/cfs_test
      CFS_ENV: test
      CFS_STORAGE_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: pip install -r backend/requirements.txt
      - name: Run complete suite against PostgreSQL
        run: pytest -q

  production-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, postgres-test]
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install production verification dependency
        run: pip install 'httpx>=0.28,<1'

      - name: Wait for exact Render production commit and verify backend
        shell: bash
        run: |
          set -euo pipefail
          base='https://crypto-factory-studios.onrender.com'
          for attempt in $(seq 1 48); do
            health_code=$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 "$base/health" || true)
            ready_code=$(curl -sS -o /tmp/ready.json -w '%{http_code}' --max-time 20 "$base/ready" || true)
            deployed_commit=''
            if [ "$health_code" = '200' ]; then
              deployed_commit=$(python - <<'PY'
          import json
          try:
              print(json.load(open('/tmp/health.json')).get('git_commit', ''))
          except Exception:
              print('')
          PY
              )
            fi
            echo "attempt=$attempt health=$health_code ready=$ready_code deployed_commit=${deployed_commit:-unknown} expected_commit=$GITHUB_SHA"
            if [ "$health_code" = '200' ] && [ "$ready_code" = '200' ] && [ "$deployed_commit" = "$GITHUB_SHA" ]; then
              python - <<'PY'
          import json, os
          health=json.load(open('/tmp/health.json'))
          ready=json.load(open('/tmp/ready.json'))
          assert health.get('ok') is True, health
          assert health.get('git_commit') == os.environ['GITHUB_SHA'], health
          assert ready.get('ready') is True, ready
          assert ready.get('database_backend') == 'postgres', ready
          assert ready.get('database_persistent') is True, ready
          assert ready.get('storage_backend') == 's3', ready
          print('exact Render production commit health/readiness verified')
          PY
              exit 0
            fi
            sleep 10
          done
          echo 'Expected Render production commit did not become healthy and ready in time'
          cat /tmp/health.json 2>/dev/null || true
          cat /tmp/ready.json 2>/dev/null || true
          exit 1

      - name: Verify live production payment readiness
        shell: bash
        run: |
          set -euo pipefail
          base='https://crypto-factory-studios.onrender.com'
          curl --fail --silent --show-error --max-time 30 "$base/api/v1/payments/status" -o /tmp/payment-status.json
          curl --fail --silent --show-error --max-time 30 "$base/api/v1/payments/methods" -o /tmp/payment-methods.json
          curl --fail --silent --show-error --max-time 30 "$base/api/v1/products" -o /tmp/products.json
          python - <<'PY'
          import json

          status=json.load(open('/tmp/payment-status.json'))
          methods=json.load(open('/tmp/payment-methods.json'))
          products=json.load(open('/tmp/products.json'))

          assert status.get('mode') == 'PRODUCTION', status
          assert status.get('production_enabled') is True, status
          assert status.get('payments_ready') is True, status
          providers=status.get('providers') or {}
          expected={'usdt_tron','usdt_bsc','sol'}
          assert expected.issubset(providers), providers
          assert all(providers.get(method_id) is True for method_id in expected), providers

          assert methods.get('mode') == 'PRODUCTION', methods
          live_methods={row.get('method_id'): row for row in methods.get('methods', [])}
          assert expected.issubset(live_methods), live_methods
          assert all(live_methods[mid].get('production_allowed') is True for mid in expected), live_methods

          product_rows=products.get('products') or []
          assert product_rows, products
          assert all(row.get('product_id') and row.get('price_usd') for row in product_rows), product_rows
          print('live production payment providers, methods, and product catalog verified')
          PY

      - name: Verify Cloudflare edge health and upstream readiness
        shell: bash
        run: |
          set -euo pipefail
          edge='https://crypto-factory-studios.cesargp9712.workers.dev'
          curl --fail --silent --show-error --max-time 30 "$edge/health" -o /tmp/edge-health.json
          curl --fail --silent --show-error --max-time 30 "$edge/ready" -o /tmp/edge-ready.json
          python - <<'PY'
          import json
          health=json.load(open('/tmp/edge-health.json'))
          ready=json.load(open('/tmp/edge-ready.json'))
          assert health.get('ok') is True, health
          assert health.get('api_configured') is True, health
          assert ready.get('ok') is True, ready
          assert ready.get('api_configured') is True, ready
          assert ready.get('upstream_status') == 200, ready
          print('Cloudflare edge and Render upstream verified')
          PY

      - name: Run disposable production end-to-end verification
        env:
          CFS_E2E_BASE_URL: https://crypto-factory-studios.cesargp9712.workers.dev
        run: python scripts/production_e2e.py
