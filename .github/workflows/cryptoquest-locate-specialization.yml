name: CryptoQuest Locate Specialization

on:
  push:
    paths:
      - '.github/workflows/cryptoquest-locate-specialization.yml'

permissions:
  contents: write

jobs:
  locate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate specialization definitions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/games/cryptoquest/game.html')
          lines=p.read_text().splitlines()
          out=[]
          for i,line in enumerate(lines):
              if 'SPECIALIZATION_SETS' in line:
                  a=max(0,i-12); b=min(len(lines),i+45)
                  out.append(f'=== OCCURRENCE LINE {i+1} ===')
                  out.extend(f'{j+1}: {lines[j]}' for j in range(a,b))
          Path('frontend/games/cryptoquest/specialization-locations.txt').write_text('\n'.join(out))
          PY
      - name: Commit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/games/cryptoquest/specialization-locations.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: locate CryptoQuest specialization initialization'
          git push
