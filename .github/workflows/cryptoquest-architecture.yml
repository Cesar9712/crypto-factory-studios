name: CryptoQuest Architecture

on:
  push:
    branches: [main]
    paths:
      - 'frontend/games/cryptoquest/core/**'
      - 'frontend/games/cryptoquest/systems/**'
      - 'frontend/games/cryptoquest/player/**'
      - 'frontend/games/cryptoquest/world/**'
      - 'frontend/games/cryptoquest/ui/**'
      - 'frontend/games/cryptoquest/scripts/**'
      - 'frontend/games/cryptoquest/config/**'
      - 'frontend/games/cryptoquest/levels/**'
      - 'frontend/games/cryptoquest/src/**'
      - 'frontend/games/cryptoquest/index.html'
      - '.github/workflows/cryptoquest-architecture.yml'
  workflow_dispatch:

jobs:
  architecture-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical modules
        run: |
          test -f frontend/games/cryptoquest/core/bootstrap.js
          test -f frontend/games/cryptoquest/core/EventBus.js
          test -f frontend/games/cryptoquest/core/StateStore.js
          test -f frontend/games/cryptoquest/core/StateMachine.js
          test -f frontend/games/cryptoquest/core/PersistenceAdapter.js
          test -f frontend/games/cryptoquest/core/ApiClient.js
          test -f frontend/games/cryptoquest/core/Scheduler.js
          test -f frontend/games/cryptoquest/systems/combat/createCombatMachine.js
          test -f frontend/games/cryptoquest/systems/energy/EnergyService.js
          test -f frontend/games/cryptoquest/systems/inventory/InventoryService.js
          test -f frontend/games/cryptoquest/systems/equipment/EquipmentService.js
          test -f frontend/games/cryptoquest/systems/economy/EconomyService.js
          test -f frontend/games/cryptoquest/systems/quests/QuestService.js
          test -f frontend/games/cryptoquest/player/PlayerProgressService.js
          test -f frontend/games/cryptoquest/player/SkillService.js
          test -f frontend/games/cryptoquest/player/TalentTreeService.js
          test -f frontend/games/cryptoquest/world/MapGraphService.js
          test -f frontend/games/cryptoquest/ui/navigation/NavigationController.js
          test -f frontend/games/cryptoquest/ui/RenderCoordinator.js
          test -f frontend/games/cryptoquest/scripts/compatibility/LegacyRuntimeAdapter.js
      - name: Verify legacy src paths are adapters only
        run: |
          ! grep -R "export class\|export function" frontend/games/cryptoquest/src/core frontend/games/cryptoquest/src/domain frontend/games/cryptoquest/src/ui frontend/games/cryptoquest/src/infrastructure
          grep -R "^export .* from\|^import .*core/bootstrap" frontend/games/cryptoquest/src >/dev/null
      - name: Syntax check canonical and adapters
        run: |
          find frontend/games/cryptoquest/core frontend/games/cryptoquest/systems frontend/games/cryptoquest/player frontend/games/cryptoquest/world frontend/games/cryptoquest/ui frontend/games/cryptoquest/scripts frontend/games/cryptoquest/src -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Verify canonical V5 boot link
        run: |
          grep -F 'core/bootstrap.js?v=5.0.0' frontend/games/cryptoquest/index.html
          grep -F 'cryptoquest-architecture" content="V5-CANONICAL' frontend/games/cryptoquest/index.html
          grep -F "version:'5.0.0-canonical'" frontend/games/cryptoquest/core/bootstrap.js
