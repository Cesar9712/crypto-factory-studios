name: CryptoQuest Runtime Retirement Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cryptoquest-unpack.yml'
      - 'frontend/games/cryptoquest/core/loader.js'
      - 'frontend/games/cryptoquest/runtime.html'
      - 'frontend/games/cryptoquest/build/runtime-manifest.json'
      - 'frontend/games/cryptoquest/data/**'

permissions:
  contents: read

jobs:
  runtime-retirement-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical runtime is self-contained
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/games/cryptoquest/runtime.html
          test -s frontend/games/cryptoquest/build/runtime-manifest.json
          grep -F 'V5-CANONICAL' frontend/games/cryptoquest/runtime.html
          grep -F 'core/bootstrap.js?v=5.0.0' frontend/games/cryptoquest/runtime.html
          grep -F '"legacyPackedSourceRetired": true' frontend/games/cryptoquest/build/runtime-manifest.json
          grep -F '"fallbackEnabled": false' frontend/games/cryptoquest/build/runtime-manifest.json
          ! grep -F 'DecompressionStream' frontend/games/cryptoquest/core/loader.js
          ! grep -F 'data/p00.txt' frontend/games/cryptoquest/core/loader.js
          if find frontend/games/cryptoquest/data -maxdepth 1 -type f -name 'p*.txt' 2>/dev/null | grep -q .; then
            echo 'Packed legacy chunks are still present.' >&2
            exit 1
          fi
          node --check frontend/games/cryptoquest/core/loader.js
          find frontend/games/cryptoquest/scripts/runtime -type f -name '*.js' -print0 | xargs -0 -r -n1 node --check
