name: CryptoQuest Unpack

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/cryptoquest-unpack.yml'
      - 'frontend/games/cryptoquest/data/**'

permissions:
  contents: write

# Canonical architecture migration: expose the packed legacy source for controlled extraction.
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack compressed CryptoQuest HTML
        shell: bash
        run: |
          set -euo pipefail
          cat frontend/games/cryptoquest/data/p*.txt | base64 -d | gzip -d > frontend/games/cryptoquest/game.html
          test -s frontend/games/cryptoquest/game.html
          grep -qi 'cryptoquest' frontend/games/cryptoquest/game.html
      - name: Commit unpacked source when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/games/cryptoquest/game.html && git ls-files --error-unmatch frontend/games/cryptoquest/game.html >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/games/cryptoquest/game.html
          git commit -m 'build: expose CryptoQuest runtime HTML'
          git push
