name: CryptoQuest Current Runtime Gate

on:
  push:
    branches: [main]
    paths:
      - 'frontend/games/cryptoquest/**'
      - '.github/workflows/cryptoquest-final-runtime.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  final-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Structural current-runtime gate
        shell: bash
        run: |
          set -euo pipefail
          test -s frontend/games/cryptoquest/game.html
          test -s frontend/games/cryptoquest/v20-premium.css
          test -s frontend/games/cryptoquest/v20-battle-pass.js
          test -s frontend/games/cryptoquest/v21-master.css
          test -s frontend/games/cryptoquest/v21-release.json

          grep -F "const SAVE_KEY='cryptoquest-rpg-save-v1'" frontend/games/cryptoquest/game.html
          grep -F 'const SAVE_VERSION=15' frontend/games/cryptoquest/game.html
          grep -F "['more','more','MÁS']" frontend/games/cryptoquest/game.html
          grep -F 'CONTINUAR AVENTURA' frontend/games/cryptoquest/game.html
          grep -F 'function renderHome' frontend/games/cryptoquest/game.html
          grep -F 'function renderCombat' frontend/games/cryptoquest/game.html
          grep -F 'function saveGame' frontend/games/cryptoquest/game.html
          grep -F 'function loadGame' frontend/games/cryptoquest/game.html

          grep -F 'CryptoQuest RPG V20' frontend/games/cryptoquest/v20-premium.css
          grep -F "const VERSION='20.0.0'" frontend/games/cryptoquest/v20-battle-pass.js
          grep -F 'CryptoQuest RPG V21 Master Visual Layer' frontend/games/cryptoquest/v21-master.css
          grep -F '"release": "V21 Master Production"' frontend/games/cryptoquest/v21-release.json

          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('frontend/games/cryptoquest/game.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',html,flags=re.I|re.S)
          Path('/tmp/cq-runtime.mjs').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/cq-runtime.mjs
          node --check frontend/games/cryptoquest/v20-battle-pass.js
          echo 'CRYPTOQUEST_CURRENT_RUNTIME_STRUCTURE_OK'
      - name: Install Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Start frontend
        run: |
          python3 -m http.server 4173 --directory frontend >/tmp/cq-http.log 2>&1 &
          sleep 2
      - name: Verify creation and persistence
        shell: bash
        run: |
          cat > final-probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          const context=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true});
          const page=await context.newPage();
          const errors=[];
          page.on('pageerror',e=>errors.push(e.message));
          await page.goto('http://127.0.0.1:4173/games/cryptoquest/game.html?final=v21',{waitUntil:'load'});
          await page.waitForTimeout(500);
          await page.locator('input:visible').first().fill('FinalHero');
          await page.getByRole('button',{name:/CONTINUAR/i}).click();
          await page.getByText('GUERRERO',{exact:true}).first().click();
          await page.getByRole('button',{name:/COMENZAR AVENTURA/i}).click();
          await page.waitForTimeout(600);
          const before=await page.evaluate(()=>({
            nav:document.querySelectorAll('.bottom-nav > button').length,
            save:!!localStorage.getItem('cryptoquest-rpg-save-v1'),
            backup:!!localStorage.getItem('cryptoquest-rpg-save-v1-backup'),
            overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth)
          }));
          if(before.nav!==6||!before.save||!before.backup||before.overflow>4||errors.length)throw new Error('Runtime gate failed '+JSON.stringify({before,errors}));
          await page.reload({waitUntil:'load'});
          await page.waitForTimeout(450);
          const after=await page.evaluate(()=>({text:(document.body.innerText||'').slice(0,1500),overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth)}));
          if(/Elige tu destino/i.test(after.text)||!after.text.includes('FinalHero')||after.overflow>4)throw new Error('Persistence gate failed '+JSON.stringify(after));
          console.log('CRYPTOQUEST_CURRENT_RUNTIME_OK');
          await browser.close();
          JS
          timeout 90s node final-probe.mjs
