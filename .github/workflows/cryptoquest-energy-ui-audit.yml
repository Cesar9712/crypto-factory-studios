name: CryptoQuest Energy UI Audit

on:
  push:
    paths:
      - '.github/workflows/cryptoquest-energy-ui-audit.yml'
      - 'frontend/games/cryptoquest/game.html'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect game systems
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('frontend/games/cryptoquest/game.html')
          s=p.read_text(encoding='utf-8')
          lines=s.splitlines()
          out=[f'lines={len(lines)} chars={len(s)}']
          terms=['energy','energia','stamina','bastion','expedition','dungeon','regen','rest','resting']
          for term in terms:
            out.append(f'\n## {term}')
            for i,l in enumerate(lines):
              if term.lower() in l.lower():
                compact=' '.join(l.strip().split())
                out.append(f'{i+1}: {compact[:360]}')
          out.append('\n## energy-like identifiers')
          ids=sorted(set(re.findall(r'\b[A-Za-z_$][\w$]*(?:Energy|energy|Stamina|stamina|Regen|regen)[A-Za-z_$\w]*\b',s)))
          out.extend(ids)
          out.append('\n## functions touching energy/stamina')
          for m in re.finditer(r'function\s+(\w+)\s*\([^)]*\)\s*\{',s):
            start=m.start(); end=s.find('\nfunction ',start+1)
            if end<0:end=min(len(s),start+6000)
            body=s[start:end]
            if re.search(r'energy|stamina|regen|bastion|expedition|dungeon',body,re.I): out.append(m.group(1))
          Path('frontend/games/cryptoquest/audit-energy-ui.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
      - name: Commit report
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/games/cryptoquest/audit-energy-ui.txt
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh CryptoQuest energy UI audit'
          git push
