name: Web3 Game CI

on:
  push:
    branches:
      - web3-game-render
      - web3-game-development
      - web3-game-staging
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm install
      - run: npm test
      - run: npm run lint
      - run: npm run build
