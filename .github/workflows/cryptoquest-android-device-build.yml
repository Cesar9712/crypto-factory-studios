name: CryptoQuest Android Device Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'games/CryptoQuest-RPG/**'
      - '.github/workflows/cryptoquest-android-device-build.yml'

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CryptoQuest module
        run: python games/CryptoQuest-RPG/ci/validate_module.py

  android-build:
    if: ${{ vars.CRYPTOQUEST_UNITY_BUILD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: static-validation
    steps:
      - uses: actions/checkout@v4
      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: games/CryptoQuest-RPG
          unityVersion: 2022.3.62f3
          targetPlatform: Android
          androidExportType: androidPackage
          buildName: CryptoQuest-RPG
      - name: Upload device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoQuest-RPG-Android
          path: build/Android
          if-no-files-found: error
