name: CryptoQuest Android Device Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'games/CryptoQuest-RPG/**'
      - '.github/workflows/cryptoquest-android-device-build.yml'

permissions:
  contents: read

env:
  THIRDWEB_UNITY_VERSION: v6.1.3
  THIRDWEB_UNITY_SHA256: 615fd8246a9eee6000004c9d306dbe387b0c094a600fca58fe252c88d4dccc90

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CryptoQuest module
        run: python games/CryptoQuest-RPG/ci/validate_module.py

  android-build:
    if: ${{ vars.CRYPTOQUEST_UNITY_BUILD_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    needs: static-validation
    env:
      CRYPTOQUEST_THIRDWEB_CLIENT_ID: ${{ vars.CRYPTOQUEST_THIRDWEB_CLIENT_ID }}
      CRYPTOQUEST_ERC1155_ADDRESS: ${{ vars.CRYPTOQUEST_ERC1155_ADDRESS }}
      CRYPTOQUEST_MARKETPLACE_ADDRESS: ${{ vars.CRYPTOQUEST_MARKETPLACE_ADDRESS }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify runtime configuration inputs
        shell: bash
        run: |
          test -n "$CRYPTOQUEST_THIRDWEB_CLIENT_ID" || { echo "Missing CRYPTOQUEST_THIRDWEB_CLIENT_ID repository variable"; exit 1; }
          [[ "$CRYPTOQUEST_ERC1155_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "Invalid CRYPTOQUEST_ERC1155_ADDRESS"; exit 1; }
          [[ "$CRYPTOQUEST_MARKETPLACE_ADDRESS" =~ ^0x[0-9a-fA-F]{40}$ ]] || { echo "Invalid CRYPTOQUEST_MARKETPLACE_ADDRESS"; exit 1; }

      - name: Download pinned Thirdweb Unity SDK
        shell: bash
        working-directory: games/CryptoQuest-RPG
        run: |
          curl --fail --location --retry 3 \
            --output thirdweb-unity-sdk-v6.1.3.unitypackage \
            https://github.com/thirdweb-dev/unity/releases/download/v6.1.3/thirdweb-unity-sdk-v6.1.3.unitypackage
          echo "$THIRDWEB_UNITY_SHA256  thirdweb-unity-sdk-v6.1.3.unitypackage" | sha256sum --check --strict

      - name: Build Android APK with Thirdweb package import
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: games/CryptoQuest-RPG
          unityVersion: 2022.3.62f3
          targetPlatform: Android
          buildMethod: CryptoQuest.Editor.AndroidBuild.BuildAndroidApk
          customParameters: '-importPackage thirdweb-unity-sdk-v6.1.3.unitypackage'

      - name: Upload device-test APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoQuest-RPG-Android
          path: games/CryptoQuest-RPG/Builds/Android/CryptoQuest-RPG.apk
          if-no-files-found: error
