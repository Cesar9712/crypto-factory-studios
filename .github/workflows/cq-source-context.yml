name: CryptoQuest Source Context
on:
  push:
    paths: ['.github/workflows/cq-source-context.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Extract context
        run: |
          python3 - <<'PY'
          import base64,gzip,pathlib,re
          d=pathlib.Path('frontend/games/cryptoquest/data')
          raw=''.join((d/f'p{i:02}.txt').read_text().strip() for i in range(12))
          html=gzip.decompress(base64.b64decode(raw)).decode('utf-8')
          lines=html.splitlines()
          terms=['function startFightV9','function startDungeonFightV9','function startActivityFight','function startExpeditionFight','function regenerateOffline','function energyTimer','game.energy','energy.current','learnTalent(game','function renderTalents','root.addEventListener(\'click\'','data-action="continue"','button.dataset.action']
          out=[]
          for term in terms:
            out.append(f'===== {term} =====')
            hits=0
            for i,line in enumerate(lines):
              if term.lower() in line.lower():
                a=max(0,i-35); b=min(len(lines),i+70)
                out.append(f'--- occurrence line {i+1} ---')
                out.extend(f'{n+1:04}: {lines[n]}' for n in range(a,b))
                hits+=1
                if hits>=12: break
          pathlib.Path('cq-source-context.txt').write_text('\n'.join(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: cq-source-context
          path: cq-source-context.txt
          retention-days: 1
