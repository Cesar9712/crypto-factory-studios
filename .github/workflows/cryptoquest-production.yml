name: CryptoQuest Production

on:
  push:
    branches: [main]
    paths:
      - 'frontend/games/cryptoquest/**'
      - 'worker/index.js'
      - '.github/workflows/cryptoquest-production.yml'
  workflow_dispatch:

concurrency:
  group: cryptoquest-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-cryptoquest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        shell: bash
        run: |
          set -euo pipefail
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Wait for direct runtime and verify mobile boot
        shell: bash
        run: |
          set -euo pipefail
          cat > cq-production-probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const url='https://crypto-factory-studios.cryptofactorystudios.workers.dev/games/cryptoquest/?verify='+process.env.GITHUB_SHA;
          let last='';
          for(let attempt=1;attempt<=36;attempt++){
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:412,height:915},isMobile:true,hasTouch:true});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(e.message));
            try{
              const response=await page.goto(url,{waitUntil:'load',timeout:30000});
              await page.waitForFunction(()=>window.CQArchitecture?.version==='5.0.0-canonical',{timeout:12000}).catch(()=>{});
              await page.waitForTimeout(1200);
              const state=await page.evaluate(()=>({
                boot:Boolean(document.querySelector('.boot-state')),
                recoverable:Boolean(document.querySelector('.recoverable-error')),
                text:(document.querySelector('#game')?.innerText||'').slice(0,1000),
                title:document.title,
                architecture:window.CQArchitecture?.version||'',
                architectureVersion:window.CQArchitecture?.store?.select?.(s=>s.meta?.architectureVersion)||null,
                overflowX:Math.max(0,document.documentElement.scrollWidth-innerWidth)
              }));
              const cache=response?.headers()?.['cache-control']||'';
              last=JSON.stringify({attempt,status:response?.status(),cache,state,pageErrors},null,2);
              console.log(last);
              if(response?.status()===200 && !state.boot && !state.recoverable && pageErrors.length===0 && state.text.includes('Elige tu destino') && state.architecture==='5.0.0-canonical' && state.architectureVersion===5 && state.overflowX<=4 && cache.includes('no-store')){
                await browser.close();
                process.exit(0);
              }
            }catch(e){last=String(e);console.log(last)}
            await browser.close();
            await new Promise(r=>setTimeout(r,10000));
          }
          console.error('CryptoQuest production did not become playable:',last);
          process.exit(1);
          JS
          node cq-production-probe.mjs
