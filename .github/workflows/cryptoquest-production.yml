name: CryptoQuest Production

# Temporarily frozen while CryptoQuest is preserved/hidden in CFS.
# Re-enable automatic triggers using docs/HOW_TO_REENABLE_GAMES.md.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cryptoquest-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-cryptoquest:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium >/dev/null
      - name: Wait for deploy and verify current production stack
        shell: bash
        run: |
          cat > cq-production-probe.mjs <<'JS'
          import { chromium } from 'playwright';
          const base='https://crypto-factory-studios.cryptofactorystudios.workers.dev';
          let last='';

          for(let attempt=1;attempt<=30;attempt++){
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:412,height:915},isMobile:true,hasTouch:true});
            const page=await context.newPage();
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            try{
              const response=await page.goto(
                base+'/games/cryptoquest/game.html?verify='+process.env.GITHUB_SHA+'-'+attempt,
                {waitUntil:'load',timeout:30000}
              );
              await page.waitForTimeout(1200);
              const state=await page.evaluate(()=>({
                title:document.title,
                text:(document.body.innerText||'').slice(0,1800),
                input:!!document.querySelector('input:not([type="hidden"])'),
                overflow:Math.max(0,document.documentElement.scrollWidth-innerWidth),
                visual:document.documentElement.dataset.cqVisual||null,
                battlePass:window.CryptoQuestBattlePass?.version||null,
                v20:!!document.querySelector('link[href*="v20-premium.css"]'),
                v21:!!document.querySelector('link[href*="v21-master.css"]'),
                bp:!!document.querySelector('script[src*="v20-battle-pass.js"]')
              }));
              const cache=response?.headers()?.['cache-control']||'';
              const visualHeader=response?.headers()?.['x-cryptoquest-visual']||'';
              last=JSON.stringify({attempt,status:response?.status(),cache,visualHeader,state,errors},null,2);
              console.log(last);

              if(
                response?.status()===200 &&
                errors.length===0 &&
                state.title.includes('CryptoQuest RPG') &&
                state.text.includes('Elige tu destino') &&
                state.input &&
                state.overflow<=4 &&
                state.visual==='v20' &&
                state.battlePass==='20.0.0' &&
                state.v20 && state.v21 && state.bp &&
                cache.includes('no-store') &&
                visualHeader.includes('V21-MASTER')
              ){
                await context.close();
                await browser.close();
                process.exit(0);
              }
            }catch(e){
              last=String(e);
              console.log(last);
            }
            await context.close();
            await browser.close();
            await new Promise(r=>setTimeout(r,10000));
          }

          console.error('CryptoQuest production did not become current:',last);
          process.exit(1);
          JS
          node cq-production-probe.mjs
