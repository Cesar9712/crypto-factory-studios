name: CryptoQuest V19 Energy Safety

on:
  push:
    paths:
      - '.github/workflows/cryptoquest-v19-energy-safety.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make expedition charging transactional
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('frontend/games/cryptoquest/game.html')
          s=p.read_text(encoding='utf-8')
          old="if(button.dataset.startExpedition){const tier=Number(button.dataset.startExpedition),cost=expeditionEnergyCost(tier);if(!game.expeditions.active&&!spendEnergy(game,cost)){toast(`Energía insuficiente · necesitas ${cost} ⚡`);return;}const run=startExpedition(game,tier);toast(run?`Expedición iniciada · ${cost} ⚡`:'Tier no disponible',run?'success':'');render();return;}"
          new="if(button.dataset.startExpedition){const tier=Number(button.dataset.startExpedition),cost=expeditionEnergyCost(tier),charged=!game.expeditions.active;if(charged&&!spendEnergy(game,cost)){toast(`Energía insuficiente · necesitas ${cost} ⚡`);return;}const run=startExpedition(game,tier);if(!run&&charged)refundEnergy(game,cost);toast(run?`Expedición iniciada · ${cost} ⚡`:'Tier no disponible · energía conservada',run?'success':'');render();return;}"
          if old not in s: raise SystemExit('target handler not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          scripts=re.findall(r'<script[^>]*>([\s\S]*?)</script>',s)
          Path('/tmp/cq.js').write_text('\n'.join(scripts),encoding='utf-8')
          PY
          node --check /tmp/cq.js
      - name: Commit safety fix
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/games/cryptoquest/game.html
          git commit -m 'fix: preserve energy when expedition cannot start'
          git push
