<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Control Center · CFS</title><link rel="stylesheet" href="/styles.css"><style>.admin-shell{max-width:1350px;margin:auto;padding:36px 5vw 90px}.admin-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.admin-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.admin-card{background:#0a151c;border:1px solid #17343e;border-radius:14px;padding:17px}.admin-card strong{display:block;font-size:28px;color:#2ae9ff}.admin-card span{color:#688792;font-size:10px}.admin-columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}.admin-panel{background:#081319;border:1px solid #17343e;border-radius:17px;padding:18px;overflow:auto}.admin-panel pre{font-size:10px;color:#86a6b0;white-space:pre-wrap}.payment-admin-row{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:10px;padding:11px 0;border-bottom:1px solid #142a33;font-size:11px}.payment-admin-row small{display:block;color:#66838e}.pill{display:inline-block;padding:4px 7px;border:1px solid #28505c;border-radius:999px;color:#66e8f7;font-size:9px}@media(max-width:950px){.admin-grid{grid-template-columns:repeat(3,1fr)}.admin-columns{grid-template-columns:1fr}}@media(max-width:520px){.admin-grid{grid-template-columns:1fr 1fr}.admin-head{align-items:start;flex-direction:column;gap:12px}}</style></head><body><header class="top"><a class="brand" href="/"><span class="brandmark">CF</span><span>PLATFORM <b>CONTROL</b></span></a><div class="top-actions"><a class="ghost" href="/creator.html">Creator Studio</a></div></header><main class="admin-shell"><div class="admin-head"><div><span class="eyebrow">PLATFORM OWNER</span><h1>Control Center</h1><p class="muted">Moderación, salud y ledger de pagos sin acceso a claves privadas.</p></div><span class="mode-badge mock">SECURE VIEW</span></div><div id="grid" class="admin-grid"></div><div class="admin-columns"><section class="admin-panel"><span class="eyebrow">PAYMENTS</span><h2>Orders</h2><div id="payments">Loading...</div></section><section class="admin-panel"><span class="eyebrow">MODERATION</span><h2>Queue</h2><pre id="moderation">Loading...</pre></section></div></main><script>async function j(path){const r=await fetch(path,{credentials:'same-origin'});if(!r.ok)throw new Error('Admin access required');return r.json()}async function run(){try{const d=await j('/api/v1/admin/overview');grid.innerHTML=Object.entries(d).map(([k,v])=>`<div class=admin-card><strong>${v}</strong><span>${k}</span></div>`).join('');const m=await j('/api/v1/admin/moderation');moderation.textContent=JSON.stringify(m,null,2);const p=await j('/api/v1/admin/payments');payments.innerHTML=p.orders.length?p.orders.map(o=>`<div class=payment-admin-row><div><b>${o.product_label}</b><small>${o.display_name} · ${o.order_id.slice(0,18)}…</small></div><div>${o.expected_amount} ${o.asset}<small>${o.network}</small></div><div><span class=pill>${o.status}</span><small>${o.transaction_hash?o.transaction_hash.slice(0,16)+'…':'No TX'}</small></div></div>`).join(''):'<p class=muted>No orders yet.</p>'}catch(e){grid.innerHTML='<div class=admin-card>Admin access required</div>';payments.textContent='—';moderation.textContent='—'}}run()</script></body></html>
