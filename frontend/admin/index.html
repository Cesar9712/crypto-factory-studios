<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control Center · CFS</title><link rel="stylesheet" href="/styles.css"><style>.admin-shell{max-width:1350px;margin:auto;padding:36px 5vw 90px}.admin-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:26px}.admin-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.admin-card{background:#0a151c;border:1px solid #17343e;border-radius:14px;padding:17px}.admin-card strong{display:block;font-size:28px;color:#2ae9ff}.admin-card span{color:#688792;font-size:10px}.admin-columns{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:30px}.admin-panel{background:#081319;border:1px solid #17343e;border-radius:17px;padding:18px;overflow:auto}.payment-admin-row{display:grid;grid-template-columns:1.2fr .8fr .8fr;gap:10px;padding:11px 0;border-bottom:1px solid #142a33;font-size:11px}.payment-admin-row small{display:block;color:#66838e}.pill{display:inline-block;padding:4px 7px;border:1px solid #28505c;border-radius:999px;color:#66e8f7;font-size:9px}.report-row{border-bottom:1px solid #142a33;padding:12px 0}.report-row p{font-size:12px;color:#9ab4bd;white-space:pre-wrap}.report-row small{color:#66838e}.report-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}@media(max-width:950px){.admin-grid{grid-template-columns:repeat(3,1fr)}.admin-columns{grid-template-columns:1fr}}@media(max-width:520px){.admin-grid{grid-template-columns:1fr 1fr}.admin-head{align-items:start;flex-direction:column;gap:12px}.payment-admin-row{grid-template-columns:1fr}}</style></head><body><header class="top"><a class="brand" href="/"><span class="brandmark">CF</span><span>PLATFORM <b>CONTROL</b></span></a><div class="top-actions"><a class="ghost" href="/creator.html">Creator Studio</a><a class="ghost" href="/profile.html">Mi cuenta</a></div></header><main class="admin-shell"><div class="admin-head"><div><span class="eyebrow">PLATFORM OWNER</span><h1>Control Center</h1><p class="muted">Moderación, salud y ledger de pagos sin acceso a claves privadas.</p></div><span class="mode-badge mock">SECURE VIEW</span></div><div id="grid" class="admin-grid"></div><div class="admin-columns"><section class="admin-panel"><span class="eyebrow">PAYMENTS</span><h2>Orders</h2><div id="payments">Loading...</div></section><section class="admin-panel"><span class="eyebrow">MODERATION</span><h2>Queue</h2><div id="moderation">Loading...</div></section></div></main><div id="toast" class="toast"></div><script>function csrf(){return document.cookie.split('; ').find(x=>x.startsWith('cfs_csrf='))?.split('=')[1]||''}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}async function j(path,opt={}){opt.credentials='same-origin';opt.headers={...(opt.headers||{})};if((opt.method||'GET').toUpperCase()!=='GET')opt.headers['X-CSRF-Token']=csrf();const r=await fetch(path,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.detail?.message||'Admin access required');return d}function renderReports(rows){moderation.innerHTML=rows.length?rows.map(r=>`<div class="report-row"><b>${esc(r.category)}</b><small> · ${esc(r.report_id)}</small><p>${esc(r.details)}</p><small>${r.game_id?'Game: '+esc(r.game_id):''}${r.creator_id?' Creator: '+esc(r.creator_id):''}</small><div class="report-actions"><button class="ghost small" data-report="${esc(r.report_id)}" data-status="RESOLVED">Resolver</button><button class="ghost small" data-report="${esc(r.report_id)}" data-status="DISMISSED">Descartar</button></div></div>`).join(''):'<p class="muted">No hay reportes abiertos.</p>';moderation.querySelectorAll('[data-report]').forEach(b=>b.onclick=()=>moderate(b.dataset.report,b.dataset.status))}async function moderate(id,status){try{await j(`/api/v1/admin/reports/${encodeURIComponent(id)}/status`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});toast('Reporte actualizado');await run()}catch(e){toast(e.message)}}async function run(){try{const d=await j('/api/v1/admin/overview');grid.innerHTML=Object.entries(d).map(([k,v])=>`<div class=admin-card><strong>${esc(v)}</strong><span>${esc(k)}</span></div>`).join('');const m=await j('/api/v1/admin/moderation');renderReports(m.reports);const p=await j('/api/v1/admin/payments');payments.innerHTML=p.orders.length?p.orders.map(o=>`<div class=payment-admin-row><div><b>${esc(o.product_label)}</b><small>${esc(o.display_name)} · ${esc(o.order_id.slice(0,18))}…</small></div><div>${esc(o.expected_amount)} ${esc(o.asset)}<small>${esc(o.network)}</small></div><div><span class=pill>${esc(o.status)}</span><small>${o.transaction_hash?esc(o.transaction_hash.slice(0,16))+'…':'No TX'}</small></div></div>`).join(''):'<p class=muted>No orders yet.</p>'}catch(e){grid.innerHTML='<div class=admin-card>Admin access required</div>';payments.textContent='—';moderation.textContent='—'}}run()</script></body></html>
