<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070705">
<meta name="robots" content="noindex,nofollow">
<title>CryptoQuest RPG · V18.2.4 LayoutFix TEST</title>
<style>
html,body{margin:0;height:100%;background:#050608;color:#e7d39a;font-family:system-ui}
body{display:grid;place-items:center}
.boot{display:grid;gap:12px;text-align:center;padding:24px}
.sigil{width:70px;height:70px;margin:auto;border:1px solid #8d7138;border-radius:50%;display:grid;place-items:center;font-weight:900;box-shadow:0 0 24px #d0a94a33}
.err{max-width:330px;color:#ffb3b3;line-height:1.4}
</style>
</head>
<body><!-- CQ-V18.2.4-LAYOUTFIX-TEST -->
<div class="boot"><div class="sigil">CQ</div><b>CRYPTOQUEST RPG</b><small>Cargando V18.2.4 LayoutFix…</small><div id="err" class="err"></div></div>
<script>
(async()=>{
  try{
    const names=Array.from({length:12},(_,i)=>`/games/cryptoquest/data/p${String(i).padStart(2,'0')}.txt`);
    const parts=await Promise.all(names.map(async n=>{
      const r=await fetch(n,{cache:'no-store'});
      if(!r.ok)throw new Error(`${n}: ${r.status}`);
      return r.text();
    }));
    const b64=parts.join('');
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    const ds=new DecompressionStream('gzip');
    let html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
    const css='<link rel="stylesheet" href="/games/cryptoquest-v1824/v1824-hotfix.css?v=18.2.4">';
    const js='<script src="/games/cryptoquest-v1824/v1824-hotfix.js?v=18.2.4" defer><\\/script>';
    html=html.replace(/<\\/head>/i,css+'</head>').replace(/<\\/body>/i,js+'</body>');
    document.open();document.write(html);document.close();
  }catch(e){
    document.getElementById('err').textContent='No se pudo cargar CryptoQuest V18.2.4: '+(e?.message||e);
  }
})();
</script>
</body></html>
