<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070705">
  <meta name="robots" content="noindex,follow">
  <title>CryptoQuest RPG · V31 Visual</title>
  <style>
    html,body{margin:0;height:100%;background:#050608;color:#e7d39a;font-family:system-ui}
    body{display:grid;place-items:center}
    .boot{display:grid;gap:12px;text-align:center}
    .sigil{width:70px;height:70px;margin:auto;border:1px solid #8d7138;border-radius:50%;display:grid;place-items:center;font-weight:900;box-shadow:0 0 24px #d0a94a33}
    .err{max-width:320px;color:#ffb3b3}
  </style>
</head>
<body>
  <!-- CQ-MAINLINE-V18.2 + V31.1-GOD-MODE -->
  <div class="boot">
    <div class="sigil">CQ</div>
    <b>CRYPTOQUEST RPG</b>
    <small>Cargando presentación V31…</small>
    <div id="err" class="err"></div>
  </div>
  <script>
    (async()=>{
      try{
        const names=Array.from({length:12},(_,i)=>`data/p${String(i).padStart(2,'0')}.txt`);
        const parts=await Promise.all(names.map(async name=>{
          const response=await fetch(name,{cache:'no-store'});
          if(!response.ok)throw new Error(`${name}: ${response.status}`);
          return response.text();
        }));
        const packed=Uint8Array.from(atob(parts.join('')),char=>char.charCodeAt(0));
        const stream=new DecompressionStream('gzip');
        let html=await new Response(new Blob([packed]).stream().pipeThrough(stream)).text();
        const visualHead='<link rel="stylesheet" href="/games/cryptoquest/v31-god-mode.css?v=31.1.0"><meta name="cryptoquest-presentation" content="V31.1-GOD-MODE">';
        const visualRuntime='<script src="/games/cryptoquest/v31-god-mode-runtime.js?v=31.1.0" defer><\/script>';
        html=html.includes('</head>')?html.replace('</head>',visualHead+'</head>'):visualHead+html;
        html=html.includes('</body>')?html.replace('</body>',visualRuntime+'</body>'):html+visualRuntime;
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.getElementById('err').textContent='No se pudo cargar CryptoQuest: '+error.message;
      }
    })();
  </script>
</body>
</html>
