<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070705"><meta name="robots" content="noindex,follow"><title>CryptoQuest RPG · V18.2.1 LayoutFix</title><style>html,body{margin:0;height:100%;background:#050608;color:#e7d39a;font-family:system-ui}body{display:grid;place-items:center}.boot{display:grid;gap:12px;text-align:center}.sigil{width:70px;height:70px;margin:auto;border:1px solid #8d7138;border-radius:50%;display:grid;place-items:center;font-weight:900;box-shadow:0 0 24px #d0a94a33}.err{max-width:320px;color:#ffb3b3}</style></head><body><!-- CQ-V18.2.1-LAYOUTFIX --><div class="boot"><div class="sigil">CQ</div><b>CRYPTOQUEST RPG</b><small>Cargando V18.2.1 LayoutFix…</small><div id="err" class="err"></div></div><script>(async()=>{try{const names=Array.from({length:12},(_,i)=>`data/p${String(i).padStart(2,'0')}.txt`);const parts=await Promise.all(names.map(async n=>{const r=await fetch(n,{cache:'no-store'});if(!r.ok)throw new Error(`${n}: ${r.status}`);return r.text()}));const b64=parts.join('');const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('err').textContent='No se pudo cargar CryptoQuest: '+e.message}})();</script></body></html>
