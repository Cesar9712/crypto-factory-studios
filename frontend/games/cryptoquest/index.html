function availableCombatSkills(){return game.player.selectedSkills.filter(id=>{const sk=SKILLS[id]||SPEC_SKILLS[id];return sk&&(!sk.specialization||sk.specialization===game.player.specialization);});}

function confirmModal(title,text,action,label){return `<div class="modal-backdrop"><div class="game-modal confirm"><h2>${title}</h2><p>${text}</p><button class="danger" data-action="${action}">${label}</button><button data-action="close-modal">CANCELAR</button></div></div>`;}

function campaignNodeAvailable(mi,ni){const map=MAPS[mi];return Number.isInteger(mi)&&Number.isInteger(ni)&&Boolean(map?.nodes?.[ni])&&mi<=game.progress.unlockedMap&&(mi<game.progress.unlockedMap||ni<=game.progress.unlockedNode);}
function startFight(mi,ni){if(!campaignNodeAvailable(mi,ni)){toast('Zona o encuentro bloqueado');return;}const map=MAPS[mi],base=ENEMIES[map.nodes[ni]];if(game.mapEvent?.expiresAt<=Date.now())game.mapEvent=null;if(!game.mapEvent&&Math.random()<.12){const event=MAP_EVENTS[Math.floor(Math.random()*MAP_EVENTS.length)];game.mapEvent={id:event.id,zoneId:map.id,expiresAt:Date.now()+30*60*1000};toast(`${event.icon} ${event.name}`,'success');}const activeEvent=game.mapEvent?.zoneId===map.id?game.mapEvent:null,enemy=createEncounter(base.id,{difficulty:game.difficulty,forceElite:activeEvent?.id==='legendaryBeast'});if(activeEvent&&['goblinInvasion','demonPortal','arcaneStorm'].includes(activeEvent.id)){enemy.hp=Math.round(enemy.hp*1.16);enemy.attack=Math.round(enemy.attack*1.1);enemy.xp=Math.round(enemy.xp*1.25);enemy.gold=Math.round(enemy.gold*1.3);}combat=new CombatSession(game,enemy,`${mi}-${ni}`,{activity:{type:'campaign',mapEvent:activeEvent?.id||null}});combat.mapIndex=mi;combat.nodeIndex=ni;combatReward=null;saveGame(game);render();}
function startFightV9(mi,ni,{skipEvent=false,forceElite=false,forceRare=false,eventChoice=null}={}){if(!campaignNodeAvailable(mi,ni)){toast('Zona o encuentro bloqueado');return;}const map=MAPS[mi],base=ENEMIES[map.nodes[ni]];if(!skipEvent&&!base.boss&&Math.random()<.18){const event=ZONE_EVENTS[Math.floor(Math.random()*ZONE_EVENTS.length)];game.mapEvent={v9:true,eventId:event.id,zoneId:map.id,pending:true,pendingFight:{mi,ni},expiresAt:Date.now()+30*60*1000};saveGame(game);render();return;}let enemy=createEncounter(base.id,{difficulty:game.difficulty,forceElite});const nemesis=game.nemesis;if(nemesis&&nemesis.zone===map.id&&!base.boss&&Math.random()<.14){enemy=createEncounter(nemesis.baseId,{difficulty:game.difficulty,forceElite:true});enemy.name=nemesis.name;enemy.level=Math.max(enemy.level,nemesis.level);enemy.nemesis=true;enemy.eliteAffixes=[...nemesis.affixes];enemy.hp=Math.round(enemy.hp*(1+nemesis.victories*.12));enemy.attack=Math.round(enemy.attack*(1+nemesis.victories*.08));enemy.maxHp=enemy.hp;}else if(!base.boss&&(forceRare||Math.random()<.045)){const title=RARE_TITLES[Math.floor(Math.random()*RARE_TITLES.length)];enemy=createEncounter(base.id,{difficulty:game.difficulty,forceElite:true});enemy.name=`${base.name} ${title}`;enemy.rare=true;enemy.elite=true;enemy.hp=Math.round(enemy.hp*1.18);enemy.gold=Math.round(enemy.gold*2);enemy.xp=Math.round(enemy.xp*1.7);enemy.maxHp=enemy.hp;game.rareCodex[`${base.id}:${title}`]={name:enemy.name,family:enemy.family,zone:enemy.zone,affixes:[...(enemy.eliteAffixes||[])],seenAt:Date.now()};game.notifications.push({type:'rare',text:`ENCUENTRO RARO · ${enemy.name}`,at:Date.now()});}if(eventChoice){enemy.xp=Math.round(enemy.xp*1.2);enemy.gold=Math.round(enemy.gold*1.3);}combat=new CombatSession(game,enemy,`${mi}-${ni}`,{activity:{type:'campaign',mapEvent:eventChoice||null}});combat.mapIndex=mi;combat.nodeIndex=ni;combatReward=null;saveGame(game);render();}

function startDungeonFightV9(){const run=game.activities.dungeon,d=DUNGEONS.find(x=>x.id===run?.id);if(!d||!Number.isInteger(run.room)||run.room<0||run.room>=d.rooms.length){game.activities.dungeon=null;saveGame(game);toast('La expedición de mazmorra dañada se cerró con seguridad');render();return;}const level=Math.max(0,Math.min(10,Number(run.keyLevel)||0)),rotation=localAffixRotation(),affixCount=level>=10?3:level>=7?2:level>=4?1:0,keyAffixes=rotation.slice(0,affixCount).map(a=>a.id),enemy=createEncounter(d.rooms[run.room],{difficulty:level>=7?'nightmare':level>=3?'veteran':game.difficulty,forceElite:run.room===2||level>=5});const scale=1+level*.13;enemy.hp=Math.round(enemy.hp*scale);enemy.attack=Math.round(enemy.attack*(1+level*.075));enemy.maxHp=enemy.hp;if(keyAffixes.includes('fortified')&&(enemy.elite||enemy.boss))enemy.defense=Math.round(enemy.defense*1.35);if(keyAffixes.includes('arcaneStorm'))enemy.skills.push({name:'Tormenta de la Llave',chance:.4,multiplier:1.4,statusEffect:'curse',duration:2,interruptible:true});combat=new CombatSession(game,enemy,`dungeon-${run.runId}-${run.room}`,{activity:{type:'dungeon',id:d.id,modifier:Object.values(DUNGEON_MODIFIERS)[new Date().getUTCDate()%Object.keys(DUNGEON_MODIFIERS).length].id,keyLevel:level,keyAffixes}});combatReward=null;render();}

function startExpeditionFight(node){const run=game.expeditions.active,map=MAPS[Math.min(game.progress.unlockedMap,MAPS.length-1)],boss=node.type==='boss',elite=node.type==='elite',base=ENEMIES[boss?map.boss:map.nodes[Math.min(map.nodes.length-2,(run.seed+run.stage)%Math.max(1,map.nodes.length-1))]],enemy=createEncounter(base.id,{difficulty:run.tier>=4?'nightmare':run.tier>=2?'veteran':'normal',forceElite:elite});const scale=1+(run.tier-1)*.16+(node.risk==='danger'?.12:0);enemy.hp=Math.round(enemy.hp*scale);enemy.attack=Math.round(enemy.attack*(1+(run.tier-1)*.1));enemy.maxHp=enemy.hp;if(boss)enemy.boss=true;combat=new CombatSession(game,enemy,`${run.id}:${run.stage}`,{activity:{type:'expedition',tier:run.tier,nodeType:node.type}});combatReward=null;render();}
function startActivityFight(type){if(!['dungeon','worldBoss','bossRush','tower','arena'].includes(type))return;if(['worldBoss','bossRush'].includes(type)&&game.player.level<MAX_LEVEL){toast('Contenido bloqueado hasta nivel 50');return;}let enemy,activity;if(type==='dungeon'){const run=game.activities.dungeon,d=DUNGEONS.find(x=>x.id===run?.id);if(!d||!Number.isInteger(run.room)||!d.rooms[run.room])return;enemy=createEncounter(d.rooms[run.room],{difficulty:game.difficulty,forceElite:run.room===2});const modifier=Object.values(DUNGEON_MODIFIERS)[new Date().getUTCDate()%Object.keys(DUNGEON_MODIFIERS).length];if(modifier.id==='fortified'&&enemy.elite){enemy.hp=Math.round(enemy.hp*1.3);enemy.defense=Math.round(enemy.defense*1.3);}if(modifier.id==='volcanic')enemy.skills.push({name:'Erupción Volcánica',chance:.22,multiplier:1.15,statusEffect:'burn',duration:2});activity={type,id:d.id,modifier:modifier.id};}else if(type==='worldBoss'){const world=currentWorldBoss(),base=ENEMIES[world.enemyId];enemy=createEncounter(base.id,{difficulty:'abyssal'});enemy.name=world.name;enemy.boss=true;enemy.hp=Math.round(enemy.hp*2.4);enemy.attack=Math.round(enemy.attack*1.35);enemy.maxHp=enemy.hp;activity={type,id:world.id};}else if(type==='bossRush'){const rush=game.endgame.bossRush,difficulty=DIFFICULTIES[rush.difficulty]||DIFFICULTIES.normal;if(game.player.level<difficulty.requirement||(difficulty.prestige||0)>(game.player.prestige?.level||0)){rush.difficulty='normal';toast('Dificultad no desbloqueada; se usará Normal');}const bosses=MAPS.map(m=>ENEMIES[m.boss]),base=bosses[rush.current%bosses.length];enemy=createEncounter(base.id,{difficulty:rush.difficulty||'normal'});enemy.hp=Math.round(enemy.hp*(1+rush.current*.12));enemy.attack=Math.round(enemy.attack*(1+rush.current*.08));enemy.maxHp=enemy.hp;activity={type,value:rush.current};}else{const value=type==='tower'?game.activities.tower.currentFloor:game.activities.arena.currentWave,map=MAPS[Math.min(MAPS.length-1,Math.floor(value/5))],id   if(button.dataset.skillMod){const [skillId,level,optionId]=button.dataset.skillMod.split(':'),ok=chooseSkillModifier(game,skillId,Number(level),optionId);toast(ok?'Modificador de habilidad elegido':'Modificador no disponible',ok?'success':'');render();return;}
  if(button.dataset.spec){if(chooseSpecialization(game,button.dataset.spec)){modal=null;toast('ESPECIALIZACIÓN DESBLOQUEADA','success');render();}return;}
  if(button.dataset.changeSpec){const result=changeSpecialization(game,button.dataset.changeSpec);if(result){modal=null;toast(`Especialización cambiada · ${result.cost} oro · ${result.refunded} talentos devueltos`,'success');render();}else toast('No se puede cambiar: revisa el oro');return;}
  if(button.dataset.selectSkill){const ok=toggleSelectedSkill(game,button.dataset.selectSkill);toast(ok?'Barra de habilidades actualizada':'Máximo 5 habilidades o habilidad bloqueada',ok?'success':'');render();return;}
  if(button.dataset.craft){const result=craftRecipe(game,button.dataset.craft);toast(result?`${result.name} creado`:'Faltan recursos',result?'success':'');render();return;}
  if(button.dataset.buy){const ok=buyMerchantItem(game,Number(button.dataset.buy));toast(ok?'Compra realizada':'Oro insuficiente o bolsa llena',ok?'success':'');render();return;}
  if(button.dataset.smith){const result=upgradeEquipment(game,button.dataset.smith);toast(result?`Mejora +${result.level} completada`:'Faltan oro o materiales',result?'success':'');render();return;}
  if(button.dataset.rune&&selectedItem){const ok=applyRune(game,selectedItem.uid||selectedItem.id,button.dataset.rune);toast(ok?'Runa aplicada':'No se puede aplicar',ok?'success':'');render();return;}
  if(button.dataset.removeRune!=null&&selectedItem){const r=removeRune(game,selectedItem.uid||selectedItem.id,Number(button.dataset.removeRune));toast(r?`Runa retirada · ${r.cost} oro`:'Oro insuficiente',r?'success':'');render();return;}if(button.dataset.gem&&selectedItem){const ok=applyGem(game,selectedItem.uid||selectedItem.id,button.dataset.gem);toast(ok?'Gema engarzada':'No se puede engarzar',ok?'success':'');render();return;}
  if(button.dataset.removeGem!=null&&selectedItem){const r=removeGem(game,selectedItem.uid||selectedItem.id,Number(button.dataset.removeGem));toast(r?`Gema retirada · ${r.cost} oro`:'Oro insuficiente',r?'success':'');render();return;}
  if(button.dataset.mechanicRune&&selectedItem){const ok=applyMechanicRune(game,selectedItem.uid||selectedItem.id,button.dataset.mechanicRune);toast(ok?'Runa mecánica aplicada':'No se puede aplicar',ok?'success':'');render();return;}
  if(button.dataset.removeMechanicRune!=null&&selectedItem){const r=removeMechanicRune(game,selectedItem.uid||selectedItem.id,Number(button.dataset.removeMechanicRune));toast(r?`Runa retirada · ${r.cost} oro`:'Oro insuficiente',r?'success':'');render();return;}
  if(button.dataset.reforge){const itemId=modal.item.uid||modal.item.id,r=reforgeAffix(game,itemId,button.dataset.reforge);modal=null;selectedItem=[...game.player.inventory,...Object.values(game.player.equipment).filter(Boolean)].find(i=>i.uid===itemId||i.id===itemId);toast(r?`${statName(r.from)} → ${statName(r.to)} +${r.value}`:'Faltan oro o Piedras de Reforja',r?'success':'');render();return;}
  if(button.dataset.saveLoadout!=null){const ok=saveLoadout(game,Number(button.dataset.saveLoadout),`BUILD ${Number(button.dataset.saveLoadout)+1}`);toast(ok?'Loadout guardado':'Elige primero una especialización',ok?'success':'');render();return;}
  if(button.dataset.applyLoadout!=null){const l=applyLoadout(game,Number(button.dataset.applyLoadout));toast(l?(l.missing.length?`Loadout parcial · faltan ${l.missing.length} elementos`:'Loadout aplicado'):'Loadout no válido',l&&!l.missing.length?'success':'');render();return;}
  if(button.dataset.pet){setActivePet(game,button.dataset.pet);toast('Mascota activa','success');render();return;}
  if(button.dataset.trainPet){const r=trainPet(game,button.dataset.trainPet);toast(r?`Mascota entrenada${r.levels.length?` · nivel ${game.player.pets.owned[button.dataset.trainPet].level}`:''}`:'Faltan Esencias de Compañero',r?'success':'');render();return;}
  if(button.dataset.evolvePet){const r=evolvePet(game,button.dataset.evolvePet);toast(r?`Mascota evolucionada · forma ${r.stage}`:'Requiere nivel y Esencias de Compañero',r?'success':'');render();return;}
  if(button.dataset.mount){setActiveMount(game,button.dataset.mount);toast('Montura activa','success');render();return;}
  if(button.dataset.repReward){const [f,r]=button.dataset.repReward.split(':');const ok=claimReputationReward(game,f,r);toast(ok?'Recompensa de reputación recibida':'Rango insuficiente',ok?'success':'');render();return;}
  if(button.dataset.factionBuy){const [f,id]=button.dataset.factionBuy.split(':');const ok=buyFactionItem(game,f,id);toast(ok?'Compra de facción realizada':'Falta reputación u oro',ok?'success':'');render();return;}
  if(button.dataset.contract){const ok=claimContract(game,button.dataset.contract);toast(ok?'Contrato reclamado':'No disponible',ok?'success':'');render();return;}
  if(button.dataset.transmute){const r=transmute(game,button.dataset.transmute);toast(r?`${r.name} creado`:'Materiales insuficientes',r?'success':'');render();return;}
  if(button.dataset.transmuteGem){const r=transmute(game,'gem',button.dataset.transmuteGem);toast(r?`${r.name} creada`:'Necesitas 3 gemas iguales',r?'success':'');render();return;}
  if(button.dataset.title){game.player.titles.active=button.dataset.title;saveGame(game);toast('Título seleccionado','success');render();return;}
  if(button.dataset.setting){game.settings[button.dataset.setting]=!game.settings[button.dataset.setting];if(button.dataset.setting==='audio')AudioSystem.setEnabled(game.settings.audio);if(button.dataset.setting==='vibration')triggerHaptic('tap');saveGame(game);render();return;}
  if(button.dataset.autoDismantle){const id=button.dataset.autoDismantle;game.settings.autoDismantle[id]=!game.settings.autoDismantle[id];saveGame(game);render();return;}
  if(button.dataset.blessing){game.endgame.arenaBlessings.push(button.dataset.blessing);game.activities.arena.pendingBlessing=false;game.activities.arena.blessingChoices=[];modal=null;saveGame(game);toast('Bendición activa durante esta run','success');render();return;}
  if(button.dataset.rushDifficulty){const difficulty=DIFFICULTIES[button.dataset.rushDifficulty],unlocked=difficulty&&game.player.level>=difficulty.requirement&&(game.player.prestige?.level||0)>=(difficulty.prestige||0);if(!unlocked){toast('Dificultad todavía bloqueada');return;}game.endgame.bossRush.difficulty=difficulty.id;saveGame(game);render();return;}
  if(button.dataset.page){const [kind,value]=button.dataset.page.split(':'),key=`${kind}Page`;game.contentView[key]=Math.max(0,Number(value)||0);saveGame(game);render();return;}
  if(button.dataset.bankStore){const ok=moveBankItem(game,button.dataset.bankStore,true);if(!ok)toast('Banco lleno u objeto no disponible');render();return;}
  if(button.dataset.bankTake){const ok=moveBankItem(game,button.dataset.bankTake,false);if(!ok)toast('Bolsa llena u objeto no disponible');render();return;}
  if(button.dataset.acceptQuest){const ok=acceptQuest(game,button.dataset.acceptQuest);toast(ok?'NUEVA MISIÓN':'Misión todavía bloqueada',ok?'success':'');render();return;}
  if(button.dataset.claimQuest){const ok=claimQuest(game,button.dataset.claimQuest,button.dataset.daily==='true');toast(ok?'Recompensa recibida':'No disponible',ok?'success':'');render();return;}
  if(button.dataset.dungeon){const d=DUNGEONS.find(x=>x.id===button.dataset.dungeon),locked=!d||game.player.level<d.level||(d?.prestige||0)>(game.player.prestige?.level||0);if(locked){toast('Mazmorra todavía bloqueada');return;}if(game.activities.dungeon&&game.activities.dungeon.id!==d.id){toast('Termina la mazmorra en curso');return;}if(!game.activities.dungeon){if(!spendEnergy(game,d.energy)){toast('Energía insuficiente');return;}game.activities.dungeon={id:d.id,room:0,runId:Math.random().toString(36).slice(2),keyLevel:game.challengeKeys.selected[d.id]||0};saveGame(game);tutorialTip('energy','La energía inicia actividades y se regenera según el tiempo transcurrido.');}startDungeonFightV9();return;}
  if(button.dataset.action==='world-boss'){const world=currentWorldBoss();if(game.worldBoss.kills[worldBossDailyKey(world)]){toast('Jefe mundial ya derrotado en esta rotación');return;}startActivityFight('worldBoss');return;}
  if(button.dataset.action==='boss-rush'){const rush=game.endgame.bossRush;if(!rush.active){rush.current=0;rush.turns=0;rush.startedAt=Date.now();rush.active=true;restAtCity(game);}startActivityFight('bossRush');return;}
  if(button.dataset.action==='reset-arena'){game.activities.arena.currentWave=1;game.activities.arena.pendingBlessing=false;game.activities.arena.blessingChoices=[];game.endgame.arenaBlessings=[];saveGame(game);toast('Run de Arena cerrada');render();return;}
  if(button.dataset.action==='retry'){retryCombatV9();return;}
  if(button.dataset.action==='change-build'){combat=null;combatReward=null;game.activeTab='more';game.moreScreen='builds';saveGame(game);render();return;}
  if(button.dataset.action==='abandon-expedition'){game.expeditions.active=null;saveGame(game);toast('Expedición cerrada');render();return;}
  handleAction(button.dataset.action);
});

root.addEventListener('click',e=>{
  const button=e.target.closest('button[data-action="daily"]');if(!button||!game)return;
  const date=new Date().toISOString().slice(0,10);if(game.daily.lastClaim===date)return;
  const day=(game.daily.calendarDay||0)%7+1,reward={gold:day===7?250:40+day*10,materials:day===7?{legendaryShard:1,reforgeStone:2}:day===3?{}:{iron:day},gems:day===3?{topaz1:1}:{}};const result=deliverRewards(game,reward,{transactionId:`daily:${date}`,save:false});if(!result.ok)return;game.daily.lastClaim=date;game.daily.calendarDay=(game.daily.calendarDay||0)+1;
  saveGame(game);toast(`Día ${day} reclamado`,'success');render();
});

function handleAction(action){if(!action)return;if(action==='to-classes'){const input=document.querySelector('#hero-name');creation.name=input?.value.trim()||'';if(!creation.name){toast('Escribe el nombre de tu héroe');input?.focus();return;}creation.step='class';render();}if(action==='back-name'){creation.step='name';render();}if(action==='create'&&creation.classId){game=createGame(createPlayer(creation.name,creation.classId));saveGame(game);render();tutorialTip('created','Tu clase define atributos, recurso y habilidades. Avanza desde Aventura.');}if(action==='continue'){game.activeTab='adventure';saveGame(game);render();tutorialTip('adventure','El nodo abierto continúa la historia; puedes repetir nodos con recompensa reducida.');}if(action==='open-spec'){modal='spec';render();}if(action==='change-spec'){modal='change-spec';render();}if(action==='close-sheet'){selectedItem=null;render();}if(action==='settings'){modal='settings';render();}if(action==='close-modal'){modal=null;render();}if(action==='manual-save'){saveGame(game);modal=null;toast('Partida V15 guardada y validada','success');render();}if(action==='manual-load'){game=loadGame()||game;modal=null;toast('Partida cargada','success');render();}if(action==='new-game'){modal='confirm-new';render();}if(action==='confirm-new'){deleteGame();game=null;modal=null;combat=null;creation={step:'name',name:'',classId:null};render();}if(action==='flee-combat'){if(combat?.outcome==='victory')return;if(combat?.activity?.type==='bossRush'){game.endgame.bossRush.active=false;game.endgame.bossRush.current=0;}combat?.flee();combat=null;modal=null;render();toast('Has abandonado el combate');}if(action==='combat-log'){modal='log';render();}if(action==='combat-details'){modal='details';render();}if(action==='victory-continue'){const wasCampaign=combat?.activity?.type==='campaign',bossRush=combat?.activity?.type==='bossRush';combat=null;combatReward=null;game.activeTab=wasCampaign?'adventure':'more';if(bossRush)game.moreScreen='endgame';saveGame(game);render();}if(action==='leave-combat'){if(combat?.activity?.type==='bossRush'){game.endgame.bossRush.active=false;game.endgame.bossRush.current=0;}combat=null;game.activeTab='more';saveGame(game);render();}if(action==='retry'){const activity=combat.activity,mi=combat.mapIndex,ni=combat.nodeIndex;combat=null;if(activity?.type==='campaign')startFight(mi,ni);else startActivityFight(activity.type);}if(action==='rest'){restAtCity(game);toast('Descansando: HP +5%/min · MP +7%/min','success');render();}if(action==='sell-junk'){const value=sellJunk(game);toast(value?`Basura vendida por ${value} oro`:'No hay basura marcada');render();}if(action==='equip-recommended'){const n=equipRecommended(game);toast(n?`${n} mejoras equipadas`:'No hay mejoras recomendadas',n?'success':'');render();}if(action==='item-bank'&&selectedItem){if(moveBankItem(game,selectedItem.uid||selectedItem.id,true)){selectedItem=null;toast('Objeto guardado en banco');render();}}if(action==='item-upgrade'&&selectedItem){const itemId=selectedItem.uid||selectedItem.id,r=upgradeEquipment(game,itemId);toast(r?`Mejora +${r.level} completada`:'Faltan oro o hierro',r?'success':'');selectedItem=game.player.inventory.find(i=>i.uid===itemId||i.id===itemId)||selectedItem;render();}if(action==='item-reforge'&&selectedItem){modal={type:'reforge',item:selectedItem};render();}if(action==='item-dismantle'&&selectedItem){if(['epic','legendary','mythic'].includes(selectedItem.rarity)){modal={type:'dismantle',item:selectedItem};render();}else confirmDismantle();}if(action==='confirm-dismantle')confirmDismantle();if(action==='use-item'&&selectedItem){useOutsideCombat(selectedItem);}if(action==='reset-talents'){modal='reset-talents';render();}if(action==='confirm-reset'){const cost=resetTalents(game);modal=null;toast(cost>=0?`Talentos reiniciados · ${cost} oro`:'Oro insuficiente',cost>=0?'success':'');render();}if(action==='tower-fight')startActivityFight('tower');if(action==='arena-fight')startActivityFight('arena');if(action==='boss-rush'){const r=game.endgame.bossRush;if(!r.active){r.current=0;r.active=true;restAtCity(game);}startActivityFight('bossRush');}if(action==='accept-bounty'){acceptBounty(game);toast('Cacería aceptada','success');render();}if(action==='claim-bounty'){const ok=claimBounty(game);toast(ok?'Recompensa de cacería recibida':'Cacería incompleta',ok?'success':'');render();}if(action==='claim-mail'){const n=claimMailbox(game);toast(n?`${n} recompensas reclamadas`:'Buzón vacío');render();}}
function confirmDismantle(){const r=dismantleItem(game,selectedItem.uid||selectedItem.id);modal=null;selectedItem=null;toast(r?`+${r.amount} ${MATERIALS[r.material].name}`:'No se puede desmontar',r?'success':'');render();}
function useOutsideCombat(item){const result=consumeInventoryItem(game,item.uid||item.id);if(!result){toast(item.cleanse?'El antídoto se usa durante el combate cuando sufres un estado compatible':'No se puede usar con HP y MP completos');return;}selectedItem=null;const buff=result.effects.find(effect=>effect.type==='buff');toast(buff?`${result.item.name} · efecto activo durante ${buff.combats} combates`:`${result.item.name} usada`,'success');render();}

root.addEventListener('click',e=>{if(e.target.matches('.sheet-backdrop[data-action="close-sheet"]')){selectedItem=null;render();}});

document.querySelector('#ambient').innerHTML=Array.from({length:18},(_,i)=>`<i style="--x:${(i*37)%100}%;--y:${(i*61)%100}%;--d:${5+i%7}s;--delay:-${i*.7}s"></i>`).join('');
try{render();}catch(error){showRecoverableError(error);}

function showRecoverableError(error){console.error('CryptoQuest V15 recuperó un error de interfaz',error);if(document.querySelector('.recoverable-error'))return;const notice=document.createElement('div');notice.className='recoverable-error';notice.setAttribute('role','alert');notice.innerHTML='<b>Se produjo un error recuperable.</b><span>Tu progreso guardado sigue disponible. Recarga para continuar.</span><button>RECARGAR</button>';notice.querySelector('button').addEventListener('click',()=>location.reload());document.body.append(notice);}
window.addEventListener('error',event=>showRecoverableError(event.error||event.message));
window.addEventListener('unhandledrejection',event=>showRecoverableError(event.reason));
window.addEventListener('beforeunload',()=>{if(game)saveGame(game);});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&game)saveGame(game);});
setInterval(()=>{if(!game||combat||modal||document.visibilityState==='hidden')return;const before=game.energy.current;regenerateOffline(game);if(game.energy.current!==before)saveGame(game);render();},60000);

</script>
