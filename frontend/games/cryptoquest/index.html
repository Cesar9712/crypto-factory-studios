<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020202">
  <title>CryptoQuest RPG · V31 Modo Dios</title>
  <style>
    html,body{margin:0;height:100%;background:#020202;color:#f1e9da;font-family:system-ui}
    body{display:grid;place-items:center;background:radial-gradient(circle at 50% 28%,#21170c,#020202 62%)}
    .boot{display:grid;gap:12px;text-align:center}.sigil{width:70px;height:70px;margin:auto;border:1px solid #a5793b;border-radius:50%;display:grid;place-items:center;font-weight:900;box-shadow:inset 0 0 18px #000,0 0 28px #d0a94a33}.boot small{color:#9d8b6b}.err{max-width:320px;color:#ffb3b3}
  </style>
</head>
<body>
  <div class="boot">
    <div class="sigil">CQ</div>
    <b>CRYPTOQUEST RPG</b>
    <small>Cargando presentación V31…</small>
    <div id="err" class="err"></div>
  </div>
  <script>
    (async()=>{
      try{
        const names=Array.from({length:12},(_,i)=>`data/p${String(i).padStart(2,'0')}.txt`);
        const parts=await Promise.all(names.map(async name=>{
          const response=await fetch(name,{cache:'no-store'});
          if(!response.ok)throw new Error(`${name}: ${response.status}`);
          return response.text();
        }));
        const binary=Uint8Array.from(atob(parts.join('')),character=>character.charCodeAt(0));
        const decompressor=new DecompressionStream('gzip');
        let html=await new Response(new Blob([binary]).stream().pipeThrough(decompressor)).text();
        const presentation=[
          '<link rel="stylesheet" href="/games/cryptoquest/v27-mobile-aaa.css?v=27.0.0">',
          '<link rel="stylesheet" href="/games/cryptoquest/v28-ultra-hud.css?v=28.0.0">',
          '<link rel="stylesheet" href="/games/cryptoquest/v29-master-reference.css?v=29.0.0">',
          '<link rel="stylesheet" href="/games/cryptoquest/v30-forged-obsidian.css?v=30.0.0">',
          '<link rel="stylesheet" href="/games/cryptoquest/v31-god-mode.css?v=31.0.0">',
          '<meta name="cryptoquest-presentation" content="V31-GOD-MODE">'
        ].join('');
        const runtime=[
          '<script src="/games/cryptoquest/v28-ultra-runtime.js?v=28.0.0" defer><\/script>',
          '<script src="/games/cryptoquest/v31-god-mode-runtime.js?v=31.0.0" defer><\/script>'
        ].join('');
        html=html.includes('</head>')?html.replace('</head>',presentation+'</head>'):presentation+html;
        html=html.includes('</body>')?html.replace('</body>',runtime+'</body>'):html+runtime;
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.getElementById('err').textContent='No se pudo cargar CryptoQuest: '+error.message;
      }
    })();
  </script>
</body>
</html>
