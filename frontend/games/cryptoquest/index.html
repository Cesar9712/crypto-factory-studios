  <style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Inter:wght@500;600;700;800&display=swap');

:root{--bg:#070914;--panel:#101424;--panel2:#171b30;--line:#2a3048;--gold:#f4c85a;--text:#f5f2e9;--muted:#9299ae;--danger:#ed5c62;--mana:#558cff;--green:#5fe09a;--safe-bottom:env(safe-area-inset-bottom,0px)}
.boot-state{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:9px;background:radial-gradient(circle at 50% 38%,#252034,#070914 58%);color:#d9bd69}.boot-state span{width:64px;height:64px;display:grid;place-items:center;border:1px solid #9b7a38;border-radius:50%;font:900 21px Cinzel,serif;box-shadow:0 0 28px #d0a94a33}.boot-state b{font:800 12px Cinzel,serif;letter-spacing:.12em}.boot-state small{color:#777d8e;font:700 7px Cinzel,serif;letter-spacing:.18em}.recoverable-error{position:fixed;z-index:1000;left:50%;bottom:calc(14px + var(--safe-bottom));width:min(92vw,420px);transform:translateX(-50%);display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:13px 14px;border:1px solid #9d5b4d;border-radius:10px;background:#211417f5;box-shadow:0 12px 35px #000;color:#f4ddd7}.recoverable-error b{font-size:10px}.recoverable-error span{grid-column:1;color:#c2a9a5;font-size:8px}.recoverable-error button{grid-column:2;grid-row:1/3;min-height:38px;padding:0 12px;border:1px solid #b67563;border-radius:7px;background:#351c20;color:#ffd8ce;font:800 7px Cinzel,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050c;color:var(--text);font-family:Inter,system-ui,sans-serif}
body{display:flex;justify-content:center;background:radial-gradient(circle at 50% -10%,#202056 0,#090b18 38%,#03050c 100%)}
button,input{font:inherit}button{color:inherit;cursor:pointer}button:disabled{cursor:not-allowed}
#ambient{position:fixed;inset:0;pointer-events:none;overflow:hidden;max-width:520px;margin:auto}
#ambient i{position:absolute;left:var(--x);top:var(--y);width:2px;height:2px;border-radius:50%;background:#9e94ff;box-shadow:0 0 8px #897cff;animation:drift var(--d) var(--delay) infinite ease-in-out;opacity:.4}
@keyframes drift{50%{transform:translateY(-22px) scale(1.7);opacity:.75}}
.game-shell{position:relative;width:100%;max-width:480px;height:100dvh;overflow:hidden;background:linear-gradient(180deg,rgba(10,12,27,.97),rgba(5,7,15,.98));box-shadow:0 0 60px #000}
.game-shell:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.025;background-image:linear-gradient(45deg,#fff 25%,transparent 25%),linear-gradient(-45deg,#fff 25%,transparent 25%);background-size:22px 22px}
h1,h2,h3,p{margin-top:0}h1,h2,h3,.eyebrow,.primary,.bottom-nav{font-family:Cinzel,serif}
button{border:0;background:none}.primary{min-height:54px;padding:0 20px;border:1px solid #f2cb68;border-radius:10px;background:linear-gradient(180deg,#bc7831,#724018);box-shadow:inset 0 1px #ffe79b,0 5px 20px #0008,0 0 18px #d58d2c33;color:#fff9df;font-weight:800;letter-spacing:.04em;text-shadow:0 1px #542b00;transition:.15s transform,.15s filter}.primary:active{transform:scale(.97);filter:brightness(1.16)}.primary:disabled{opacity:.4;filter:grayscale(1)}.secondary{min-height:46px;border:1px solid var(--line);border-radius:9px;background:#15192a;font-weight:800}.danger{color:#ff8b8f!important;border-color:#682e39!important}

/* Creación */
.creation-shell{overflow-y:auto;background:radial-gradient(circle at 50% 18%,#24275a 0,#0b0d1d 33%,#05060d 78%)}
.creation-screen{position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;padding:12vh 22px 30px;text-align:center;overflow:hidden}
.creation-screen:before{content:"";position:absolute;width:330px;height:330px;top:-70px;border:1px solid #aa9dff1c;border-radius:50%;box-shadow:0 0 0 35px #8a79ff08,0 0 0 75px #8a79ff05;animation:spin 30s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.brand-rune{position:relative;width:112px;height:112px;display:grid;place-items:center;margin-bottom:28px;border:2px solid #c9b66d;border-radius:50%;background:radial-gradient(circle,#3e3962,#16162b 60%,#080a12);box-shadow:0 0 35px #7e6bff55,inset 0 0 25px #000;font-family:Cinzel;font-size:35px;color:#ffe68c}.brand-rune:after{content:"";position:absolute;inset:-10px;border:1px dashed #8f84b8;border-radius:50%}
.eyebrow{position:relative;margin:0 0 10px;color:#d0b96d;font-size:12px;letter-spacing:.22em}.creation-screen h1{position:relative;font-size:29px;margin-bottom:42px}.name-forge{width:100%;position:relative}.name-forge label{display:block;text-align:left;font-size:10px;letter-spacing:.16em;color:var(--muted);margin-bottom:8px}.name-forge input{width:100%;height:58px;border:1px solid #3d435c;border-radius:10px;background:#101322;color:#fff;text-align:center;font-size:18px;outline:0;box-shadow:inset 0 0 18px #0008}.name-forge input:focus{border-color:#c4a85c;box-shadow:0 0 18px #d9ad4d25}.name-forge .primary{width:100%;margin-top:15px;display:flex;justify-content:center;align-items:center;gap:20px}
.class-pick{padding:28px 14px 90px;display:block;overflow-y:auto}.class-pick h1{font-size:24px;margin-bottom:20px}.back-mini{position:absolute;z-index:2;top:22px;left:15px;width:38px;height:38px;border:1px solid var(--line);border-radius:50%;font-size:28px}.class-cards{display:grid;gap:10px;width:100%;text-align:left}.class-card{position:relative;width:100%;min-height:128px;display:grid;grid-template-columns:72px 1fr;gap:12px;padding:14px;border:1px solid #30364d;border-radius:13px;background:linear-gradient(135deg,#15192b,#0d1020);overflow:hidden}.class-card:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--class),transparent 32%);opacity:.06}.class-card.selected{border-color:var(--class);box-shadow:0 0 18px color-mix(in srgb,var(--class),transparent 65%),inset 0 0 20px color-mix(in srgb,var(--class),transparent 90%)}.class-sigil{position:relative;z-index:1;width:66px;height:90px;display:grid;place-items:center;border:1px solid color-mix(in srgb,var(--class),#fff 15%);border-radius:40px 40px 8px 8px;background:radial-gradient(circle,var(--class),#131626 65%);font-size:35px;box-shadow:inset 0 0 25px #0009}.class-card h2{margin:2px 0;color:var(--class);font-size:18px}.class-card b{font-size:11px}.class-card p{font-size:11px;color:var(--muted);margin:6px 0}.mini-stats{display:flex;gap:10px;font-size:10px;color:#d5d8e2}.fixed-create{position:fixed;z-index:4;bottom:15px;left:50%;transform:translateX(-50%);width:calc(min(100%,480px) - 28px)}

/* HUD y navegación */
.player-hud{position:absolute;z-index:20;top:0;left:0;right:0;height:126px;padding:11px 12px 7px;display:grid;grid-template-columns:49px 1fr 68px;grid-template-rows:82px 25px;gap:4px 9px;background:linear-gradient(180deg,#121629 0,#0b0e1beb 88%,transparent);border-bottom:1px solid #343750}
.avatar{width:49px;height:49px;display:grid;place-items:center;margin-top:4px;border:2px solid var(--class);border-radius:10px;background:radial-gradient(circle,var(--class),#131728 70%);box-shadow:0 0 12px color-mix(in srgb,var(--class),transparent 60%);font-size:27px}.hud-main{min-width:0}.identity{height:31px;display:flex;align-items:baseline;justify-content:space-between;gap:5px}.identity strong{max-width:52%;overflow:hidden;text-overflow:ellipsis;font-family:Cinzel;font-size:13px}.identity span{font-size:8px;color:#bac0d2;white-space:nowrap}.hud-currency{display:flex;flex-direction:column;align-items:flex-end;gap:5px;font-size:10px;font-weight:800}.gear{width:24px;height:24px;border:1px solid #30364b;border-radius:7px;margin-bottom:1px;color:#a9aec0}.hud-exp{grid-column:1/4}.stat-bar{margin:1px 0}.bar-caption{display:flex;justify-content:space-between;margin-bottom:2px;color:#c9ccda;font-size:8px}.bar-caption span{font-weight:800}.bar-caption b{font-size:8px}.bar-track{height:7px;padding:1px;border:1px solid #363b50;border-radius:5px;background:#03040a;overflow:hidden}.bar-track i{display:block;height:100%;border-radius:3px;transition:width .45s ease;background:linear-gradient(90deg,#a7273d,#f35c62);box-shadow:0 0 8px #ef4d58}.mana .bar-track i{background:linear-gradient(90deg,#365fd3,#60a2ff);box-shadow:0 0 8px #518dff}.exp .bar-track i{background:linear-gradient(90deg,#b28a27,#ffe27b);box-shadow:0 0 8px #f5cb55}.hud-exp .bar-caption{margin:0}.hud-exp .bar-track{height:6px}
.screen{position:absolute;top:126px;bottom:72px;left:0;right:0;overflow-y:auto;overflow-x:hidden;padding:10px 12px 22px;scrollbar-width:none}.screen::-webkit-scrollbar{display:none}.bottom-nav{position:absolute;z-index:20;bottom:0;left:0;right:0;height:calc(67px + var(--safe-bottom));padding:5px 4px var(--safe-bottom);display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid #2b3046;background:#0a0d19f5;box-shadow:0 -8px 25px #0008}.bottom-nav button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;color:#656c82;font-size:8px;font-weight:800}.bottom-nav i{height:34px;font:normal 25px Inter}.bottom-nav .active{color:#f2cd6d;text-shadow:0 0 10px #ffc95c}.bottom-nav .active:before{content:"";position:absolute;top:-6px;width:36px;height:2px;background:#ffd46c;box-shadow:0 0 12px #ffc95c}

/* CRYPTOQUEST RPG · V9.5 — capa visual no destructiva sobre V9 */
:root {
  --bg: #050608;
  --panel: #0d1016;
  --panel2: #151922;
  --panel3: #1b202b;
  --line: #303541;
  --line-gold: #6c5930;
  --gold: #d8b45f;
  --gold-hi: #f4db91;
  --bronze: #9a6234;
  --text: #f3efe5;
  --muted: #9b9eaa;
  --danger: #db5d62;
  --mana: #5b8fe8;
  --green: #63c98c;
  --violet: #a376dd;
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 17px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}

html, body {
  overscroll-behavior: none;
  background: #020304;
}

body {
  background:
    radial-gradient(circle at 50% -15%, #222632 0, #090b0f 38%, #020304 78%),
    #020304;
}

button, input, select {
  touch-action: manipulation;
}

button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible {
  outline: 2px solid var(--gold-hi);
  outline-offset: 2px;
}

.game-shell {
  isolation: isolate;
  background:
    radial-gradient(circle at 50% 8%, rgba(65, 75, 96, .15), transparent 34%),
    linear-gradient(180deg, rgba(10, 12, 16, .99), rgba(4, 5, 8, .99));
  border-inline: 1px solid rgba(141, 126, 91, .13);
  box-shadow: 0 0 70px #000;
}

.game-shell::before {
  z-index: -1;
  opacity: .17;
  background-image:
    linear-gradient(120deg, transparent 0 47%, rgba(255,255,255,.02) 48%, transparent 49%),
    radial-gradient(circle at 20% 18%, rgba(214, 175, 86, .08) 0 1px, transparent 1.5px);
  background-size: 44px 44px, 28px 28px;
}

#ambient { opacity: .45; }
#ambient i { background: #d39d55; box-shadow: 0 0 6px #ca7d35; animation-duration: calc(var(--d) * 1.8); }
#ambient i:nth-child(n+9) { display: none; }

button {
  transition: transform 140ms ease, border-color 140ms ease, background-color 140ms ease, filter 140ms ease, opacity 140ms ease;
}

button:active:not(:disabled) { transform: scale(.975); filter: brightness(1.12); }
button:disabled { opacity: .42; filter: saturate(.35); }

.primary {
  min-height: 50px;
  border-color: #cda955;
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, #9f652e 0, #694019 50%, #4b2b12 100%);
  box-shadow: inset 0 1px rgba(255,244,187,.45), 0 4px 12px #0009, 0 0 14px rgba(198,134,55,.14);
  color: #fff4cf;
  font-size: 11px;
}

.secondary {
  min-height: 44px;
  border-color: #373c47;
  background: linear-gradient(180deg, #1a1e26, #101319);
}

/* HUD compacto y navegación de seis destinos */
.player-hud {
  top: var(--safe-top);
  height: 110px;
  grid-template-columns: 44px minmax(0, 1fr) 70px;
  grid-template-rows: 72px 22px;
  gap: 3px 8px;
  padding: 8px 10px 6px;
  border-bottom-color: #2f302e;
  background: linear-gradient(180deg, rgba(18,20,25,.99), rgba(8,10,14,.96) 91%, transparent);
  box-shadow: 0 8px 22px rgba(0,0,0,.24);
}

.avatar {
  width: 44px;
  height: 48px;
  margin-top: 2px;
  border-width: 1px;
  border-radius: 22px 22px 8px 8px;
  font-size: 25px;
}

.identity { height: 26px; align-items: center; }
.identity strong { font-size: 12px; letter-spacing: .02em; }
.identity em { display: none; }
.identity span { color: #a9acb5; font-size: 7px; }
.hud-currency { min-width: 0; width: 100%; gap: 3px; overflow: hidden; font-size: 9px; }
.hud-currency span { max-width: 100%; white-space: nowrap; }
.gear { width: 27px; height: 27px; border-color: #3c3b37; color: #c9b574; }
.hud-exp { align-self: end; }
.hud-exp .bar-track { height: 5px; }

.screen {
  top: calc(var(--safe-top) + 110px);
  bottom: calc(64px + var(--safe-bottom));
  padding: 11px 11px 26px;
  overscroll-behavior-y: contain;
  scroll-padding-bottom: 18px;
}

.screen > * { animation: v95ScreenIn 160ms ease-out both; }
@keyframes v95ScreenIn { from { opacity: 0; transform: translateY(4px); } }

.bottom-nav {
  height: calc(64px + var(--safe-bottom));
  grid-template-columns: repeat(6, minmax(0, 1fr));
  gap: 1px;
  padding: 5px 4px var(--safe-bottom);
  border-top-color: #35332d;
  background: linear-gradient(180deg, rgba(17,18,21,.98), rgba(5,6,9,.99));
  box-shadow: 0 -8px 22px #0008;
}

.bottom-nav button {
  min-width: 0;
  min-height: 54px;
  gap: 1px;
  color: #737680;
  font-size: 7px;
  letter-spacing: .01em;
}

.bottom-nav i { height: 31px; font-size: 21px; line-height: 30px; }
.bottom-nav .active { color: var(--gold-hi); text-shadow: 0 0 12px rgba(226,181,80,.45); }
.bottom-nav .active::before { top: -5px; width: 30px; height: 2px; background: var(--gold); }

/* Jerarquía y paneles */
.screen-heading { margin: 1px 1px 13px; }
.screen-heading small { color: #b99a55; font-size: 8px; letter-spacing: .15em; }
.screen-heading h2 { margin: 3px 0 0; font-size: 19px; line-height: 1.1; }
.screen-heading > span { border-color: #403b2e; background: #15140f; color: #e1c979; }
.section-title { margin-top: 17px; padding-bottom: 7px; border-bottom-color: #373229; color: #ccb46e; letter-spacing: .1em; }

.quest-card, .daily-card, .content-card, .pet-card, .faction-card, .loadout-card,
.dungeon-card-v9, .activity-card, .modifier-banner, .build-summary, .mastery-hero,
.attribute-branches section, .spec-identity, .target-row {
  border-color: #30343d;
  border-radius: var(--radius);
  background:
    linear-gradient(135deg, rgba(28,32,41,.96), rgba(11,13,18,.98) 72%),
    #11141a;
  box-shadow: inset 0 1px rgba(255,255,255,.025), 0 5px 14px rgba(0,0,0,.22);
}

.content-card, .pet-card, .dungeon-card-v9, .faction-card { margin-bottom: 9px; }
.content-card h3, .pet-card h3, .dungeon-card-v9 h3 { color: #f1eee6; }
.activity-note, .content-card p, .pet-card p { color: #a4a6ae; line-height: 1.45; }
.empty-state { border: 1px dashed #3b3e46; border-radius: var(--radius); background: rgba(17,19,24,.65); color: #a2a4ac; }

/* Home: foco en héroe, progreso y siguiente actividad */
.hero-stage {
  height: 218px;
  border-color: #464235;
  border-radius: var(--radius-lg);
  background:
    radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--class), transparent 70%), transparent 37%),
    radial-gradient(circle at 50% 0, rgba(214,181,99,.09), transparent 50%),
    linear-gradient(180deg, #171a20, #080a0e);
  box-shadow: inset 0 0 35px #0008, 0 8px 22px #0005;
}

.hero-stage::after {
  content: "";
  position: absolute;
  inset: 8px;
  border: 1px solid rgba(205,175,101,.1);
  border-radius: 12px;
  pointer-events: none;
}

.moon { width: 125px; height: 125px; top: 7px; left: calc(50% - 62px); border-color: rgba(205,186,131,.15); }
.hero-portrait { top: 18px; width: 130px; height: 148px; font-size: 70px; filter: drop-shadow(0 4px 10px #000); }
.stage-stats { height: 52px; backdrop-filter: none; background: rgba(6,7,10,.88); border-top-color: #3e392d; }
.stage-stats b { color: var(--gold-hi); }
.adventure-cta { position: relative; margin: 9px 0; }
.quest-card { border-left: 2px solid #7b6340; }
.quick-row { gap: 7px; }
.quick-row button { min-height: 61px; border-color: #34373e; background: linear-gradient(180deg,#171a20,#0d0f14); }

/* Héroe: cinco tabs reales, stats legibles y equipo */
.sub-tabs {
  top: -11px;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  overflow: visible;
  margin: -11px -11px 12px;
  padding: 7px 5px 0;
  background: rgba(6,8,11,.97);
  box-shadow: 0 5px 12px #0005;
}

.sub-tabs button { min-width: 0; height: 38px; padding: 0 2px; font-size: 7px; border-bottom-color: #292c32; }
.sub-tabs button.active { border-color: var(--gold); color: var(--gold-hi); }
.summary-avatar { width: 98px; height: 112px; margin-top: 5px; border-radius: 49px 49px 13px 13px; }
.summary-card > p { margin-bottom: 7px; }
.power-total { padding: 7px 25px; border-color: var(--line-gold); background: linear-gradient(180deg,#241f14,#14110c); }
.power-total strong { font-size: 26px; }
.stat-grid { gap: 7px; }
.stat-groups { display: grid; gap: 10px; text-align: left; }
.stat-section > h3 { margin: 0 2px 6px; color: #bba66d; font-size: 8px; letter-spacing: .14em; }
.stat-grid > div, .stat-grid > button { position: relative; min-width: 0; height: 50px; display: flex; align-items: center; gap: 10px; padding: 8px; border: 1px solid #2c3038; border-radius: 8px; background: linear-gradient(135deg,#171a20,#0d0f14); text-align: left; }
.stat-grid > button > em { position: absolute; top: 5px; right: 6px; color: #686d77; font-size: 7px; font-style: normal; }
.stat-grid b { font-size: 14px; }
.resist-panel { border-color: #30343c; background: #0c0f14; }
.advanced-stats { margin-top: 11px; border: 1px solid #30343c; border-radius: var(--radius); background: #0b0d11; text-align: left; }
.advanced-stats summary { min-height: 42px; display: flex; align-items: center; padding: 0 12px; color: #c8b574; font: 800 8px Cinzel, serif; cursor: pointer; }
.advanced-stats[open] summary { border-bottom: 1px solid #2b2e35; }
.advanced-stats .resist-panel { margin: 0; border: 0; }
.equipment-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
.equipment-slot { min-width: 0; min-height: 105px; border-radius: var(--radius); box-shadow: inset 0 0 18px #0009; }
.equipment-slot > b { overflow: hidden; text-overflow: ellipsis; }
.set-summary { border-color: #4b432e; background: #17140d; }

/* Skills */
.skill-list { gap: 9px; }
.skill-card { min-height: 100px; grid-template-columns: 50px minmax(0,1fr) 35px; border-color: #323640; border-radius: var(--radius); background: linear-gradient(115deg,#1a1d25,#0c0f14 78%); }
.skill-card.selected-skill { border-color: #857042; box-shadow: inset 3px 0 #cfaa54, 0 0 13px rgba(216,180,95,.1); }
.skill-icon { width: 48px; height: 64px; border-color: #504a3b; background: radial-gradient(circle at 50% 25%,#282a32,#090b0f); }
.skill-card h3 { font-size: 12px; }
.skill-card p { font-size: 9px; line-height: 1.4; }
.skill-facts { gap: 5px; font-size: 7px; }
.skill-facts em { color: #a89cba; font-style: normal; }
.skill-buttons { gap: 5px; }
.skill-buttons button { min-height: 33px; border-color: #655735; }

/* Inventario: información prioritaria en la cuadrícula */
.loot-tools, .inventory-tools { gap: 6px; }
.loot-tools select, .loot-tools label, .inventory-tools input, .inventory-tools select {
  min-height: 36px;
  border-color: #363a42;
  border-radius: var(--radius-sm);
  background: #0d1015;
  color: #d9d8d2;
}

.equip-recommended { min-height: 40px; border-color: #675734; background: linear-gradient(180deg,#211c12,#131009); color: #e6ca77; }
.inventory-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.inventory-slot {
  aspect-ratio: auto;
  min-width: 0;
  min-height: 86px;
  display: grid;
  grid-template-columns: 49px minmax(0, 1fr);
  grid-template-rows: 1fr;
  align-items: center;
  gap: 8px;
  padding: 9px;
  border-radius: var(--radius);
  border-color: color-mix(in srgb, var(--rarity), #282b31 42%);
  background:
    radial-gradient(circle at 13% 50%, color-mix(in srgb,var(--rarity),transparent 76%), transparent 37%),
    linear-gradient(120deg,#171a20,#090b0f 75%);
  box-shadow: inset 3px 0 color-mix(in srgb,var(--rarity),transparent 25%), inset 0 0 16px #0007;
  text-align: left;
  overflow: hidden;
}

.inventory-slot > i { width: 47px; height: 54px; display: grid; place-items: center; border: 1px solid color-mix(in srgb,var(--rarity),transparent 35%); border-radius: 9px; background: #090b0f; font-size: 27px; }
.inventory-slot .item-copy { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.inventory-slot .item-copy strong { overflow: hidden; color: #f1eee4; font: 700 9px Cinzel, serif; text-overflow: ellipsis; white-space: nowrap; }
.inventory-slot .item-copy small { color: var(--rarity); font-size: 7px; font-weight: 800; letter-spacing: .04em; }
.inventory-slot .item-copy em { color: #979aa3; font-size: 7px; font-style: normal; }
.inventory-slot > b { right: 5px; bottom: 4px; padding: 2px 5px; border-radius: 8px; background: #050608; }
.inventory-slot > span { left: 5px; top: 4px; z-index: 2; font-size: 8px; }
.inventory-slot.favorite::after { border-color: var(--gold-hi); border-radius: 10px; }
.inventory-slot.junk { opacity: .65; }
.inventory-slot[style*="#ff"], .inventory-slot.mythic { box-shadow: inset 3px 0 var(--rarity), inset 0 0 18px #0007, 0 0 12px color-mix(in srgb,var(--rarity),transparent 80%); }

.item-sheet {
  max-height: min(88dvh, 760px);
  overflow-y: auto;
  padding: 10px 14px calc(16px + var(--safe-bottom));
  border-radius: 20px 20px 0 0;
  background:
    radial-gradient(circle at 16% 5%, color-mix(in srgb,var(--rarity),transparent 83%), transparent 28%),
    linear-gradient(160deg,#1a1d24,#090b0f 64%);
  box-shadow: 0 -12px 38px #000, inset 0 1px color-mix(in srgb,var(--rarity),transparent 35%);
}

.item-hero h2 { line-height: 1.15; }
.item-stats span { border-color: #354239; background: #101712; color: #78d29a; }
.comparison { border-color: #343841; background: #090b0f; }
.comparison > div { min-height: 28px; }
.unique-effect { border-color: color-mix(in srgb,var(--rarity),#4b3e2e 45%); background: linear-gradient(135deg,#211b12,#111014); }
.set-effect { border-color: #4b4536; background: #10130f; }
.sheet-actions { position: sticky; bottom: calc(-16px - var(--safe-bottom)); padding: 9px 0 calc(10px + var(--safe-bottom)); background: linear-gradient(transparent,#090b0f 14%); }

/* Talentos: ramas apiladas y nodos realmente legibles en móvil */
.talent-forest { grid-template-columns: 1fr; gap: 11px; }
.talent-branch { padding: 10px; border-color: #343842; border-radius: var(--radius); background: linear-gradient(145deg,#151820,#090b0f); }
.talent-branch.foreign { opacity: .55; }
.talent-branch h3 { min-height: auto; margin: 0 0 9px; color: #d8bd73; font-size: 10px; text-align: left; }
.talent-chain { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 8px; }
.talent-node-wrap { min-width: 0; }
.talent-node { min-height: 94px; padding: 8px 6px; border-color: #353945; border-radius: 10px; background: linear-gradient(150deg,#191c24,#0c0e13); }
.talent-node b { font-size: 24px; }
.talent-node span { color: #e8e5dc; font-size: 8px; line-height: 1.2; }
.talent-node small { color: #9a9da6; font-size: 7px; line-height: 1.25; }
.talent-node.available { border-color: #ba9850; box-shadow: inset 0 0 15px rgba(203,167,77,.08); }
.talent-node.learned { border-color: #4c9b70; background: linear-gradient(145deg,#14251c,#0b120e); box-shadow: inset 3px 0 #63c98c; }
.talent-node.capstone { border-color: #9d73c9; background: radial-gradient(circle at 50% 10%,#332144,#111219 65%); }
.connector { left: -5px; top: 50%; width: 9px; height: 2px; background: #625a48; }

/* Mundo, eventos y actividades */
.difficulty-row { gap: 5px; padding-bottom: 4px; overflow-x: auto; scrollbar-width: none; }
.difficulty-row button { flex: 0 0 auto; min-width: 75px; min-height: 42px; border-radius: var(--radius-sm); }
.map-zone { margin-bottom: 15px; }
.map-banner { height: auto; min-height: 76px; border-color: #393a3b; border-radius: var(--radius); background: linear-gradient(105deg,#1b1e24,#0c0e12); box-shadow: 0 6px 15px #0004; }
.map-banner > i { border: 1px solid #464035; background: radial-gradient(circle,#211d14,#08090c); }
.map-banner h3 { font-size: 15px; }
.map-zone.locked { opacity: .55; filter: saturate(.3); }
.path-step button { min-height: 70px; height: auto; border-color: #31353d; border-radius: var(--radius); background: linear-gradient(105deg,#151820,#0b0d12); }
.path-step.boss button { border-color: #715831; background: linear-gradient(105deg,#1b1715,#120d0d); box-shadow: inset 3px 0 #9f7540; }
.mastery-track { background: #080a0d; }
.mastery-track > i { background: linear-gradient(90deg,#7f532c,#dab75f); }
.zone-facts { color: #a7aab1; }
.event-decision > div { border-color: #80683a; background: radial-gradient(circle at 50% 0,#2b2417,#0c0e12 58%); }
.event-decision button, .route-choice button { min-height: 72px; border-radius: var(--radius); }
.tier-grid button { min-height: 82px; border-radius: var(--radius); }

/* Combate móvil premium */
.combat-shell { background: #030406; }
.combat-screen {
  padding-top: var(--safe-top);
  grid-template-rows: 36px minmax(184px, 1fr) auto 56px 92px minmax(174px, auto);
  background:
    radial-gradient(circle at 50% 25%, rgba(61,49,77,.6), transparent 35%),
    linear-gradient(180deg,#11151d 0,#080a0f 58%,#030406 100%);
}

.combat-screen::before { opacity: .6; background: linear-gradient(transparent 56%,#030406), repeating-linear-gradient(90deg,transparent 0 52px,rgba(216,180,95,.025) 53px); }
.combat-top { border-bottom-color: #35342f; background: rgba(5,6,9,.83); }
.combat-top button { min-width: 40px; min-height: 32px; }
.enemy-zone { padding: 7px 15px 0; }
.combat-name span { color: #c8aa64; }
.combat-name h2 { margin-top: 3px; color: #f3efe5; font-size: 20px; text-shadow: 0 2px 8px #000; }
.enemy-zone > .stat-bar { max-width: 330px; }
.enemy-zone .bar-track, .combat-player .bar-track { height: 10px; border-color: #44454a; }
.enemy-intent { border-color: #4a4436; border-radius: 9px; background: rgba(13,15,19,.88); box-shadow: 0 4px 12px #0005; }
.boss-telegraph { border-color: #c0644f; background: linear-gradient(90deg,#351a18,#21100f); color: #ffb097; animation-duration: .9s; }
.break-bar { color: #d8bc70; }
.enemy-figure { filter: drop-shadow(0 12px 12px #000b); }
.battle-log { border-color: #2f3238; background: rgba(8,10,13,.82); }
.combat-player { padding: 5px 11px; border-top: 1px solid #363a42; border-bottom-color: #363a42; background: linear-gradient(90deg,#161920,#090b0f); }
.combat-player > .mini-avatar { width: 50px; height: 58px; border-radius: 25px 25px 8px 8px; }
.combat-actions { padding: 7px 7px calc(7px + var(--safe-bottom)); background: linear-gradient(180deg,#0d1015,#050609); box-shadow: 0 -10px 24px #000b; }
.utility-actions.four { gap: 5px; margin-bottom: 6px; }
.utility-actions.four button { min-width: 0; height: 48px; border-color: #3d414a; border-radius: 9px; background: linear-gradient(180deg,#1c2028,#111319); }
.utility-actions.four b { overflow: hidden; font-size: 7px; text-overflow: ellipsis; }
.skill-actions { grid-template-columns: repeat(5, minmax(0,1fr)); gap: 5px; overflow: visible; max-height: none; }
.skill-actions button { height: 72px; border-color: #4b473f; border-radius: 10px; background: radial-gradient(circle at 50% 22%,#302a38,#11141a 66%); box-shadow: inset 0 1px rgba(255,255,255,.04); }
.skill-actions i { font-size: 26px; }
.skill-actions b { margin-top: 2px; color: #eeeae0; font-size: 7px; }
.skill-actions small { color: #77a5e9; font-size: 6px; }
.skill-actions button:disabled { opacity: .5; filter: grayscale(.85); }
.skill-actions button.cooling { opacity: .68; }
.skill-actions em { background: rgba(3,4,6,.72); color: #fff3c9; font-size: 30px; text-shadow: 0 0 8px #000; }
.float-text { font-size: 22px; text-shadow: 0 2px 4px #000, 0 0 8px currentColor; }
.float-text.critical { color: #ffdb64; font-size: 26px; }
.float-text.heal { color: #6ee19b; }
.float-text.shield { color: #7bb8ff; }
.float-text.block, .float-text.dodge { top: 30%; color: #dce7f6; font-size: 19px; letter-spacing: .09em; }
.float-text.phase { top: 28%; padding: 7px 16px; border-block: 1px solid #c4a052; background: rgba(6,7,9,.84); color: #f3d47c; font-size: 20px; letter-spacing: .08em; }
.boss-intro { inset: 38% 0 auto; padding: 14px; animation-duration: 1s; background: linear-gradient(90deg,transparent,rgba(6,7,9,.96),transparent); }
.boss-intro b { color: var(--gold-hi); font-size: 20px; letter-spacing: .08em; }

.result-overlay { padding: 14px; background: rgba(3,4,6,.94); backdrop-filter: none; animation-duration: 180ms; }
.result-content { max-height: calc(100dvh - 28px - var(--safe-top) - var(--safe-bottom)); overflow-y: auto; border-color: #55482e; border-radius: var(--radius-lg); background: radial-gradient(circle at 50% 0,#251f15,#0c0e12 42%); }
.result-content h1 { letter-spacing: .13em; }
.reward-numbers span { border-color: #54462d; background: #17130d; color: #f0d37e; }
.loot-reveal { border-width: 1px; border-color: var(--rarity); border-radius: var(--radius); background: radial-gradient(circle at 50% 20%,color-mix(in srgb,var(--rarity),transparent 72%),#0c0e12 70%); }
.loot-reveal.important { box-shadow: 0 0 20px color-mix(in srgb,var(--rarity),transparent 67%); }
.level-up { border-color: #74603b; background: #19140d; }

/* Modales y feedback coherentes */
.sheet-backdrop, .modal-backdrop { background: rgba(0,0,0,.78); backdrop-filter: none; }
.modal-backdrop { padding: calc(14px + var(--safe-top)) 14px calc(14px + var(--safe-bottom)); }
.game-modal { max-width: 370px; max-height: 84dvh; padding: 19px; border-color: #484238; border-radius: var(--radius-lg); background: radial-gradient(circle at 50% 0,#222018,#11141a 33%,#090b0f 100%); box-shadow: 0 18px 55px #000; }
.game-modal h2 { color: #eee8d9; letter-spacing: .05em; }
.game-modal > button:not(.sheet-close) { min-height: 48px; height: auto; border-color: #363b44; border-radius: 9px; background: linear-gradient(180deg,#191d24,#0e1116); }
.sheet-close { min-width: 38px; min-height: 38px; }
#toast-layer { top: calc(10px + var(--safe-top)); }
.toast { border-color: #5b5139; border-radius: 10px; background: rgba(19,21,25,.96); box-shadow: 0 8px 22px #000b, inset 3px 0 #c4a252; }
.toast.success { border-color: #426d52; box-shadow: 0 8px 22px #000b, inset 3px 0 #63c98c; }

/* Responsive objetivo */
@media (max-width: 380px) {
  .player-hud { grid-template-columns: 41px minmax(0,1fr) 64px; padding-inline: 8px; }
  .identity strong { max-width: 45%; font-size: 11px; }
  .bottom-nav span { font-size: 5.8px; }
  .bottom-nav i { font-size: 19px; }
  .screen { padding-inline: 9px; }
  .sub-tabs { margin-inline: -9px; }
  .sub-tabs button { font-size: 6.2px; }
  .inventory-grid { gap: 6px; }
  .inventory-slot { min-height: 82px; grid-template-columns: 42px minmax(0,1fr); gap: 6px; padding: 7px; }
  .inventory-slot > i { width: 41px; height: 49px; font-size: 24px; }
  .inventory-slot .item-copy strong { font-size: 8px; }
  .talent-node { min-height: 99px; }
  .combat-screen { grid-template-rows: 34px minmax(154px,1fr) auto 50px 88px minmax(166px,auto); }
  .combat-player { grid-template-columns: 48px 1fr; }
  .skill-actions button { height: 67px; }
  .skill-actions i { font-size: 23px; }
  .utility-actions.four button { height: 44px; grid-template-columns: 18px 1fr; }
}

@media (min-height: 880px) {
  .combat-screen { grid-template-rows: 38px minmax(255px,1fr) auto 62px 98px 190px; }
  .enemy-figure { min-height: 145px; }
}

@media (min-width: 520px) {
  .game-shell { max-width: 500px; }
  .inventory-grid { grid-template-columns: repeat(3, minmax(0,1fr)); }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* CRYPTOQUEST RPG · V10 — MASTER VISUAL IMPLEMENTATION
   Capa visual no destructiva sobre las mecánicas V9.5. */
:root {
  --bg: #050504;
  --panel: #0b0d0f;
  --panel2: #111418;
  --panel3: #171a1e;
  --line: #363128;
  --line-gold: #755623;
  --gold: #c99a3d;
  --gold-hi: #f0cf78;
  --bronze: #8c5227;
  --text: #eee8dc;
  --muted: #8f8b82;
  --danger: #a83d3d;
  --mana: #397bd6;
  --green: #4da171;
  --violet: #8251b5;
  --radius-sm: 2px;
  --radius: 3px;
  --radius-lg: 5px;
}

html, body { background: #020201; }
body {
  background:
    radial-gradient(circle at 50% -8%, #231b10 0, #080808 35%, #020201 76%),
    #020201;
}

.rpg-icon, .nav-icon, .bar-icon {
  width: 1em;
  height: 1em;
  display: inline-block;
  overflow: visible;
  fill: none;
  color: currentColor;
  vertical-align: -.15em;
}

.fallback-icon { font-style: normal; }

.game-shell {
  background:
    linear-gradient(90deg, transparent 0 49.7%, rgba(206,163,71,.025) 50%, transparent 50.3%),
    radial-gradient(circle at 50% 3%, rgba(140,94,43,.14), transparent 27%),
    linear-gradient(180deg, #0d0e0e, #050606 66%, #020303);
  border-inline-color: #342919;
}

.game-shell::before {
  opacity: .28;
  background-image:
    radial-gradient(ellipse at 20% 18%, transparent 0 20%, rgba(185,148,73,.035) 20.5% 21%, transparent 21.5%),
    linear-gradient(115deg, transparent 0 47%, rgba(255,226,160,.018) 48%, transparent 49%);
  background-size: 150px 110px, 48px 48px;
}

#ambient { opacity: .3; }
#ambient i { background: #a46b2f; box-shadow: 0 0 5px #a46b2f; }

h1, h2, h3, .screen-heading, .player-hud, .content-card small, .item-sheet small {
  font-family: Cinzel, Georgia, serif;
}

button { border-radius: 2px; }
button:active:not(:disabled) { transform: translateY(1px) scale(.985); }

.primary,
.content-card > button,
.activity-card > button,
.recipe > button,
.zone-enter {
  position: relative;
  border: 1px solid #d2aa52;
  border-radius: 2px;
  background:
    linear-gradient(180deg, rgba(255,225,143,.18), transparent 22%),
    linear-gradient(180deg, #8c5b22, #5b3515 54%, #3d230f);
  box-shadow: inset 0 0 0 1px #44270e, inset 0 1px #f5d681, 0 4px 13px #000b;
  color: #fff0bd;
  clip-path: polygon(7px 0, calc(100% - 7px) 0, 100% 7px, 100% calc(100% - 7px), calc(100% - 7px) 100%, 7px 100%, 0 calc(100% - 7px), 0 7px);
  text-shadow: 0 1px 1px #241000;
}

.primary::before, .zone-enter::before {
  content: "";
  position: absolute;
  inset: 4px;
  pointer-events: none;
  border: 1px solid rgba(255,225,146,.17);
}

.secondary {
  border: 1px solid #4a453c;
  border-radius: 2px;
  background: linear-gradient(180deg,#242424,#121313 50%,#0c0d0e);
  box-shadow: inset 0 1px rgba(255,255,255,.06), inset 0 0 0 1px #090a0a;
}

.danger { border-color: #7d3430 !important; background: linear-gradient(#541e1e,#250d0e) !important; color: #f4aaa0 !important; }

.rpg-frame, .rpg-panel, .quest-card, .daily-card, .content-card, .activity-card,
.attribute-branches section, .build-summary, .spec-identity, .dungeon-card-v9,
.pet-card, .faction-card, .loadout-card, .game-modal, .item-sheet {
  position: relative;
}

.quest-card::after, .content-card::after, .activity-card::after, .daily-card::after,
.attribute-branches section::after, .build-summary::after, .dungeon-card-v9::after,
.game-modal::after {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1px solid rgba(206,166,82,.07);
  pointer-events: none;
}

/* HUD superior: retrato y tres recursos reales */
.player-hud {
  position: absolute;
  height: 108px;
  top: var(--safe-top);
  grid-template-columns: 45px minmax(0,1fr) 88px;
  grid-template-rows: 72px 21px;
  padding: 7px 9px 5px;
  border-bottom: 1px solid #69502a;
  background:
    linear-gradient(90deg, rgba(133,87,34,.1), transparent 25%, transparent 75%, rgba(133,87,34,.08)),
    linear-gradient(180deg,#171715,#080909 92%,transparent);
  box-shadow: 0 7px 18px #000c, inset 0 -1px #1d170e;
}

.avatar {
  width: 45px;
  height: 52px;
  border-color: color-mix(in srgb,var(--class),#b89045 35%);
  border-radius: 50% 50% 5px 5px;
  background: radial-gradient(circle at 50% 32%,color-mix(in srgb,var(--class),#17140e 45%),#080909 72%);
  box-shadow: 0 0 0 2px #090a09, 0 0 0 3px #614720, 0 5px 14px #000;
}

.identity { height: 25px; }
.identity strong { color: #f0e7d6; font-size: 12px; }
.identity span { color: #b29b6f; font: 700 7px Cinzel,serif; }
.hud-main .stat-bar { margin-top: 2px; }
.bar-caption span { display: flex; align-items: center; gap: 3px; }
.bar-icon { font-size: 9px; }
.hud-currency { display: grid; grid-template-columns: 1fr 1fr; align-content: start; gap: 3px; }
.hud-currency .gear { grid-column: 2; justify-self: end; width: 24px; height: 22px; border: 1px solid #4b402e; border-radius: 2px; }
.hud-currency span {
  min-width: 0;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 3px;
  padding: 0 4px;
  border: 1px solid #2f2c25;
  background: #090a09;
  color: #d1ad5a;
  font-size: 9px;
}
.hud-currency span:nth-of-type(2) { color: #ddd1a2; }
.hud-currency span:nth-of-type(3) { color: #9b70d0; }
.hud-currency b { overflow: hidden; color: #e7dfcc; font-size: 7px; text-overflow: ellipsis; }
.hud-exp { grid-column: 1/4; }

.stat-bar .bar-track {
  height: 7px;
  padding: 1px;
  border: 1px solid #4a4438;
  border-radius: 0;
  background: #020303;
  box-shadow: inset 0 1px 3px #000;
}
.stat-bar .bar-track i { border-radius: 0; }
.hp .bar-track i { background: linear-gradient(90deg,#65131a,#c43d3e 70%,#e56755); }
.mana .bar-track i { background: linear-gradient(90deg,#173b7e,#367acb 70%,#63a4e9); }
.exp .bar-track i { background: linear-gradient(90deg,#725018,#c89e3f 70%,#efd36e); }
.resource .bar-track i { background: linear-gradient(90deg,#4c236d,#9454bd 70%,#c283e7); }

.screen { top: calc(var(--safe-top) + 108px); bottom: calc(65px + var(--safe-bottom)); padding: 11px 10px 28px; }
.bottom-nav {
  position: absolute;
  height: calc(65px + var(--safe-bottom));
  padding: 4px 3px var(--safe-bottom);
  border-top: 1px solid #765927;
  background: linear-gradient(180deg,#181714,#080909 40%,#040505);
  box-shadow: 0 -7px 22px #000d, inset 0 1px #16120b;
}
.bottom-nav button { min-height: 56px; color: #6e6a60; font: 700 6px Cinzel,serif; }
.bottom-nav .nav-icon { width: 23px; height: 23px; margin: 4px auto 2px; }
.bottom-nav .active { color: var(--gold-hi); text-shadow: 0 0 10px rgba(209,159,62,.65); }
.bottom-nav .active::before { top: -4px; width: 37px; height: 2px; background: #d8aa4c; box-shadow: 0 0 8px #d8aa4c; }

/* Home */
.home-resources { display: none; }
.hero-stage {
  height: 252px;
  border: 1px solid #74582b;
  border-radius: 2px;
  background:
    linear-gradient(90deg,transparent 49.5%,rgba(225,190,107,.12) 50%,transparent 50.5%),
    radial-gradient(ellipse at 50% 30%,color-mix(in srgb,var(--class),transparent 58%),transparent 34%),
    linear-gradient(180deg,#191c1d,#090a0a 74%);
  box-shadow: inset 0 0 45px #000b, 0 7px 18px #0008;
  clip-path: polygon(8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px),0 8px);
}
.hero-stage::after { inset: 5px; border-color: rgba(221,182,91,.2); border-radius: 0; }
.hero-stage::before {
  background:
    linear-gradient(transparent 72%,#050606),

/* V15 · Inventory cards: header / artwork / metadata, without overlays. */
.bag-screen .inventory-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 9px;
}

.bag-screen .inventory-slot {
  position: relative;
  min-width: 0;
  min-height: 180px;
  aspect-ratio: auto;
  display: grid;
  grid-template-columns: minmax(0, 1fr);
  grid-template-rows: minmax(35px, auto) minmax(72px, 1fr) minmax(39px, auto);
  align-items: stretch;
  gap: 7px;
  overflow: hidden;
  padding: 10px;
  border: 1px solid color-mix(in srgb, var(--rarity), #39342d 28%);
  border-radius: 8px;
  background:
    radial-gradient(circle at 50% 47%, color-mix(in srgb, var(--rarity), transparent 82%), transparent 38%),
    linear-gradient(155deg, #191a18, #070808 76%);
  box-shadow: inset 0 0 0 2px #080909, inset 0 0 0 3px color-mix(in srgb, var(--rarity), transparent 75%), 0 5px 12px #0009;
  clip-path: none;
  text-align: left;
}

/* Reset old absolute metadata rules from the V9/V10 card. */
.bag-screen .inventory-slot span,
.bag-screen .inventory-slot > span {
  position: static;
  inset: auto;
  z-index: auto;
  color: inherit;
  font-size: inherit;
}

.bag-screen .inventory-slot .item-card-head {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: start;
  gap: 7px;
}

.bag-screen .inventory-slot .item-card-name {
  min-width: 0;
  overflow: hidden;
  display: -webkit-box;
  color: #f0e8d9;
  font: 700 10px/1.25 Cinzel, serif;
  letter-spacing: .01em;
  overflow-wrap: anywhere;
  text-align: left;
  text-overflow: ellipsis;
  -webkit-box-orient: vertical;
  -webkit-line-clamp: 2;
  line-clamp: 2;
}

.bag-screen .inventory-slot .item-card-level {
  flex: 0 0 auto;
  padding-top: 1px;
  color: #aaa49a;
  font: 700 8px/1.25 Inter, sans-serif;
  letter-spacing: .02em;
  white-space: nowrap;
}

.bag-screen .inventory-slot .item-card-icon {
  min-width: 0;
  min-height: 72px;
  width: 100%;
  height: auto;
  display: grid;
  place-items: center;
  border: 0;
  border-block: 1px solid color-mix(in srgb, var(--rarity), transparent 76%);
  border-radius: 0;
  background: radial-gradient(circle, color-mix(in srgb, var(--rarity), transparent 86%), transparent 66%);
  font-size: clamp(39px, 11vw, 47px);
  line-height: 1;
  filter: drop-shadow(0 4px 7px #000c);
}

.bag-screen .inventory-slot .item-card-foot {
  min-width: 0;
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 7px;
}

.bag-screen .inventory-slot .item-card-meta {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 4px;
}

.bag-screen .inventory-slot .item-card-rarity {
  max-width: 100%;
  overflow: hidden;
  padding: 3px 6px;
  border: 1px solid color-mix(in srgb, var(--rarity), transparent 32%);
  border-radius: 999px;
  background: color-mix(in srgb, var(--rarity), transparent 88%);
  color: var(--rarity);
  font: 800 7px/1 Cinzel, serif;
  font-style: normal;
  letter-spacing: .055em;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bag-screen .inventory-slot .item-card-type {
  max-width: 100%;
  overflow: hidden;
  color: #969188;
  font: 600 8px/1.15 Inter, sans-serif;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.bag-screen .inventory-slot .item-card-trailing {
  min-width: 22px;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 3px;
  color: #d8cba9;
}

.bag-screen .inventory-slot .item-card-state,
.bag-screen .inventory-slot .item-card-upgrade {
  display: inline-grid;
  place-items: center;
  min-width: 17px;
  height: 17px;
  color: #e0bc63;
  font: 700 10px/1 Inter, sans-serif;
}

.bag-screen .inventory-slot .item-card-upgrade { color: #69d28f; }

.bag-screen .inventory-slot .item-card-quantity,
.bag-screen .inventory-slot > .item-card-foot .item-card-quantity {
  position: static;
  inset: auto;
  min-width: 24px;
  padding: 3px 5px;
  border: 1px solid #49453d;
  border-radius: 6px;
  background: #050608;
  color: #f2ecdf;
  font: 800 9px/1 Inter, sans-serif;
  text-align: center;
  white-space: nowrap;
}

.bag-screen .inventory-slot.favorite::after { inset: 3px; border-radius: 5px; pointer-events: none; }
.bag-screen .inventory-slot.junk { opacity: .7; }
.bag-screen .inventory-slot:focus-visible { outline: 2px solid var(--rarity); outline-offset: 2px; }

@media (max-width: 380px) {
  .bag-screen .inventory-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; }
  .bag-screen .inventory-slot { min-height: 176px; padding: 9px; gap: 6px; }
  .bag-screen .inventory-slot .item-card-name { font-size: 9.5px; }
  .bag-screen .inventory-slot .item-card-icon { min-height: 68px; font-size: 40px; }
}

@media (min-width: 520px) {
  .bag-screen .inventory-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}

/* V18.1A Bastion recovery */

/* CryptoQuest RPG V18.1A — Dark Fantasy Reference Integration
   Visual-only override. Keeps gameplay/state/combat logic intact. */
:root{
  --bg:#050505;--panel:#0c0d0f;--panel2:#121316;--panel3:#18191c;
  --line:#56431f;--line-soft:#322918;--gold:#d4af37;--gold2:#c89c3e;
  --gold-hi:#ffe89a;--text:#eee7d7;--muted:#aaa08b;--danger:#9f2929;
  --mana:#2e72b8;--green:#5c9e61;--purple:#7a43ad;--obsidian:#08090b;
}
html,body{background:#030303;color:var(--text)}
body{background:radial-gradient(circle at 50% -12%,#1c1812 0,#070707 34%,#020202 100%)}
.game-shell{max-width:480px;background:linear-gradient(180deg,#08090bfa,#050506fc);box-shadow:0 0 0 1px #4c3b1b55,0 0 70px #000}
.game-shell:before{opacity:.11;background-image:linear-gradient(120deg,transparent 0 45%,#d4af3708 48% 52%,transparent 55%),radial-gradient(circle at 50% 15%,#d4af370d,transparent 28%);background-size:120px 120px,100% 100%}

function buildSkillUpgrades(skillData){

function createEncounter(enemyId,{difficulty='normal',eliteChance=.09,forceElite=false}={}){

  const enemy=structuredClone(base);enemy.hp=Math.round(enemy.hp*mult);enemy.attack=Math.round(enemy.attack*mult);enemy.magic=Math.round(enemy.magic*mult);enemy.defense=Math.round(enemy.defense*Math.sqrt(mult));enemy.resistance=Math.round(enemy.resistance*(1+(mult-1)*.25));enemy.speed=Math.round(enemy.speed*(1+(mult-1)*.08));enemy.xp=Math.round(enemy.xp*({normal:1,veteran:1.3,nightmare:1.75,abyssal:2.25}[difficulty]||1));enemy.gold=Math.round(enemy.gold*({normal:1,veteran:1.25,nightmare:1.6,abyssal:2.05}[difficulty]||1));

    const keys=Object.keys(ELITE_AFFIXES),count=difficulty==='abyssal'?3:difficulty==='nightmare'?2:1,ids=[];while(ids.length<count){const id=keys[Math.floor(Math.random()*keys.length)];if(!ids.includes(id))ids.push(id);}enemy.elite=true;enemy.eliteAffixes=ids;enemy.eliteAffix=ids[0];for(const id of ids){const affix=ELITE_AFFIXES[id];enemy.hp=Math.round(enemy.hp*affix.hp);enemy.attack=Math.round(enemy.attack*affix.damage);enemy.defense=Math.round(enemy.defense*(affix.defense||1));}enemy.name=`${ids.map(id=>ELITE_AFFIXES[id].name).join(' · ')} · ${enemy.name}`;enemy.xp=Math.round(enemy.xp*(1.8+(count-1)*.45));enemy.gold=Math.round(enemy.gold*(1.7+(count-1)*.4));
  }

function makeBranch(classId,[branch,specialization,skillId,status],branchIndex){
  const nodes=Array.from({length:20},(_,tier)=>{
    const id=`${classId}-${branchIndex}-${tier}`;
    const extendedEffects=[...EFFECTS,{maxHp:24},{damagePct:.04},{resistance:4},{resourceGainPct:.08},{crit:2},{defense:4},{cooldownReduction:.03},{damagePct:.07}];
    const effect={...(extendedEffects[tier]||{})};
    const labels=['Disciplina I','Dominio','Temple','Disciplina II','Flujo','Catalizador','Maestría','Ascensión','Legado','Resistencia','Impulso','Voluntad','Técnica','Instinto','Fortaleza','Cadencia','Trascendencia','CAPSTONE OFENSIVO','CAPSTONE DEFENSIVO','CAPSTONE DE RECURSO'];
    const data={id,name:`${labels[tier]} · ${branch}`,
      icon:ICONS[tier%ICONS.length],tier,requires:tier?(tier>=17?`${classId}-${branchIndex}-16`:`${classId}-${branchIndex}-${tier-1}`):null,effect,specialization,
      description:Object.entries(effect).map(([k,v])=>`${k} +${v<1?Math.round(v*100)+'%':v}`).join(', ')};
    if(tier===4){data.skillMod={skillId,cooldown:-1};data.description=`${skillId}: reduce su cooldown en 1.`;}
    if(tier===6){data.skillMod={skillId,addStatus:status,stacks:1};data.description=`${skillId} aplica ${status} adicional.`;}
    if(tier===7){data.skillMod={skillId,resourceGain:1};data.description=`${skillId} genera recurso de clase adicional.`;}
    if(tier===12){data.skillMod={skillId,cooldown:-1,resourceGain:1};data.description=`${skillId}: reduce cooldown y genera recurso adicional.`;}
    if(tier===15){data.skillMod={skillId,addStatus:status,stacks:2};data.description=`${skillId} aplica dos cargas adicionales de ${status}.`;}
    if(tier>=17){
      data.capstone=true;data.choiceGroup=`${specialization}-capstone`;
      if(tier===17){data.effect={damagePct:.16,critDamage:14};data.description='Final ofensivo: aumenta daño y potencia golpes críticos.';}
      if(tier===18){data.effect={damageReduction:.1,maxHp:55,shieldPower:8};data.description='Final defensivo: reduce daño y fortalece vida y escudos.';}

    }
    return data;
  });
  return {branch,specialization,nodes};
}

const ASSETS={classes:{},zones:{},enemies:{},items:{},skills:{},pets:{},mounts:{},npcs:{},materials:{}};

const ICON_IDS=new Set(['home','map','hero','bag','talents','more','sword','axe','dagger','staff','bow','helmet','armor','gloves','boots','ring','amulet','relic','hp','mana','exp','energy','gold','gem','attack','defense','critical','speed','fire','ice','lightning','arcane','poison','bleed','summon','heal','shield','quest','boss','loot','crafting','expedition','dungeon','event','shop','lock','check']);

function registerAsset(kind,id,src=null){if(!ASSETS[kind])ASSETS[kind]={};ASSETS[kind][id]=src;return `${kind}.${id}`;}

function assetPath(assetId){if(!assetId)return null;const [kind,...parts]=String(assetId).split('.'),id=parts.join('.');return ASSETS[kind]?.[id]||null;}

function iconMarkup(iconId,fallbackEmoji='✦',className='rpg-icon'){
  return ICON_IDS.has(iconId)?`<svg class="${className}" aria-hidden="true"><use href="#${iconId}"></use></svg>`:`<span class="${className} fallback-icon" aria-hidden="true">${fallbackEmoji}</span>`;
}

function visualMarkup(entity,{className='',alt=''}={}){
  const src=assetPath(entity?.assetId),fallback=entity?.fallbackEmoji||entity?.icon||'✦';
  if(src)return `<img class="${className}" src="${src}" alt="${alt||entity?.name||''}">`;
  if(entity?.iconId)return iconMarkup(entity.iconId,fallback,className||'rpg-icon');
  return `<span class="${className} fallback-icon" aria-hidden="true">${fallback}</span>`;
}

function registerDataAssets(kind,entries){for(const entry of entries)if(entry?.id)registerAsset(kind,entry.id,null);}

function buyMerchantItem(game,index){const safeIndex=whole(index,0,9999,-1),stock=Number(index)===safeIndex?getMerchantStock()[safeIndex]:null,p=game.player,newSlot=stock&&(stock.kind==='equipment'||stock.kind==='consumable'&&!p.inventory.some(i=>i.type==='consumable'&&i.baseId===stock.id)),price=whole(stock?.price,0,Number.MAX_SAFE_INTEGER,0);p.gold=whole(p.gold,0,Number.MAX_SAFE_INTEGER,0);if(!stock||p.gold<price||(newSlot&&p.inventory.length>=p.inventoryCapacity)||(stock.kind==='recipe'&&p.learnedRecipes.includes(stock.id)))return false;p.gold-=price;if(stock.kind==='consumable')addStack(p.inventory,createConsumable(stock.id,1));else if(stock.kind==='material'){const amount=whole(stock.quantity,1,9999,1);p.materials[stock.id]=whole(p.materials[stock.id],0,Number.MAX_SAFE_INTEGER,0)+amount;progressEvent(game,'collect',amount,stock.id);}else if(stock.kind==='gem')p.gems[stock.id]=whole(p.gems[stock.id],0,9999,0)+1;else if(stock.kind==='recipe')p.learnedRecipes.push(stock.id);else{const template=ITEM_TEMPLATES.find(t=>t.baseId===stock.id);if(!template){p.gold+=price;return false;}p.inventory.push(generateItem(Math.max(1,p.level),{template,rarity:'common',classId:p.classId,specialization:p.specialization}));}saveGame(game);return true;}

function obtainPet(game,id,{save=true}={}){const data=PETS[id],owned=game.player.pets.owned;if(!data)return false;if(!owned[id])owned[id]={id,level:1,exp:0,unlocks:[]};game.collections.pets.includes(id)||game.collections.pets.push(id);if(!game.player.pets.active)game.player.pets.active=id;if(save)saveGame(game);return true;}

function gainPetExperience(game,amount=10){const id=game.player.pets.active,pet=game.player.pets.owned[id];if(!pet)return [];pet.exp+=amount;const levels=[];while(pet.level<30&&pet.exp>=80+pet.level*35){pet.exp-=80+pet.level*35;pet.level++;if([5,10,20].includes(pet.level))pet.unlocks.push(`Mejora ${pet.level}`);levels.push(pet.level);}return levels;}

function gainReputation(game,factionId,amount){const rep=game.factions[factionId];if(!rep)return false;rep.value=Math.min(9999,whole(rep.value,0,9999,0)+whole(amount,0,9999,0));return true;}
function claimReputationReward(game,factionId,rank){const rep=game.factions[factionId],needs={friendly:500,honored:1500,revered:3500,exalted:7000};if(!rep||rep.value<(needs[rank]||Infinity)||rep.claimed.includes(rank))return false;const reward=rank==='friendly'?{materials:{reforgeStone:2}}:rank==='honored'?{gems:{sapphire1:1}}:rank==='revered'?{pets:[factionId==='abyss'?'specter':'ironCub']}:rank==='exalted'?{mounts:[factionId==='arcane'?'arcaneTiger':factionId==='abyss'?'spectralHorse':'warWolf']}:null;if(!reward)return false;const result=deliverRewards(game,reward,{transactionId:`reputation:${factionId}:${rank}`,save:false});if(!result.ok&&!result.duplicate)return false;rep.claimed.push(rank);saveGame(game);return true;}
function buyFactionItem(game,factionId,itemId){const stock=FACTION_STOCK[factionId]?.find(item=>item.id===itemId),rep=game.factions[factionId],needs={friendly:500,honored:1500,revered:3500,exalted:7000},p=game.player;if(!stock||!rep||rep.value<(needs[stock.rank]||Infinity)||p.gold<stock.price)return false;const reward=stock.reward;if(reward.pet&&p.pets.owned[reward.pet]||reward.mount&&p.mounts.owned.includes(reward.mount)||reward.recipe&&p.learnedRecipes.includes(reward.recipe))return false;p.gold-=stock.price;for(const [id,n] of Object.entries(reward.materials||{}))p.materials[id]=(p.materials[id]||0)+n;if(reward.gem)p.gems[reward.gem]=(p.gems[reward.gem]||0)+1;if(reward.recipe)p.learnedRecipes.push(reward.recipe);if(reward.pet)obtainPet(game,reward.pet);if(reward.mount){p.mounts.owned.push(reward.mount);game.collections.mounts.includes(reward.mount)||game.collections.mounts.push(reward.mount);}saveGame(game);return true;}

function claimContract(game,id){const c=[...(game.contracts.daily||[]),game.contracts.weekly].find(x=>x?.id===id);if(!c?.complete||c.claimed)return false;const tx=`contract:${game.contracts.dailyDate}:${game.contracts.weeklyDate}:${id}`,result=deliverRewards(game,c.reward,{transactionId:tx,save:false});if(!result.ok)return false;c.claimed=true;saveGame(game);return true;}

const LOCAL_PROMOTIONS={'CQV4-DEV':{gold:50,materials:{iron:2}}};

function equipRecommended(game){const p=game.player,magic=['mage','necromancer'].includes(p.classId),weights=magic?{magic:3,intelligence:2.2,maxMana:.08,crit:1.5,defense:.7,maxHp:.05}:{attack:3,strength:2.2,agility:1.5,crit:1.7,defense:.8,maxHp:.05};if(['guardian','protector'].includes(p.specialization))Object.assign(weights,{defense:2.5,maxHp:.14,armor:2});const score=item=>Object.entries(item?.stats||{}).reduce((n,[k,v])=>n+v*(weights[k]||.3),0)+(item?.unique?12:0);let changed=0;for(const item of [...p.inventory].filter(i=>i.type==='equipment').sort((a,b)=>score(b)-score(a))){let slot=item.slot;if(slot==='ring'){const first=score(p.equipment.ring1),second=score(p.equipment.ring2);slot=first<=second?'ring1':'ring2';}const current=p.equipment[slot];if(score(item)>score(current)*1.05&&!(item.rarity==='mythic'&&Object.entries(p.equipment).some(([s,i])=>s!==slot&&i?.rarity==='mythic'))){const uid=itemUid(item),index=p.inventory.findIndex(i=>itemUid(i)===uid);if(index<0)continue;p.equipment[slot]=item;p.inventory.splice(index,1);if(current)p.inventory.push(current);changed++;}}if(changed)saveGame(game);return changed;}

function removeConsumableStack(player,item){item.quantity=whole(item.quantity,1,9999,1)-1;if(item.quantity<=0)player.inventory.splice(player.inventory.indexOf(item),1);}
function consumePotion(game,kind='hp'){

  const potion=p.inventory.find(i=>i.type==='consumable'&&candidates.includes(i.baseId)&&i.quantity>0);if(!potion)return null;
  const consumed={...potion,cleanse:[...(potion.cleanse||[])]};removeConsumableStack(p,potion);saveGame(game);return consumed;
}
function consumeInventoryItem(game,itemId){
  const p=game.player,item=p.inventory.find(i=>(i.uid===itemId||i.id===itemId)&&i.type==='consumable'&&i.quantity>0);if(!item)return null;
  const stats=calculateStats(p),effects=[];
  if(item.heal&&p.currentHp<stats.maxHp){const amount=Math.min(whole(item.heal,0,999999,0),stats.maxHp-p.currentHp);p.currentHp+=amount;effects.push({type:'heal',amount});}
  if(item.mana&&p.currentMana<stats.maxMana){const amount=Math.min(whole(item.mana,0,999999,0),stats.maxMana-p.currentMana);p.currentMana+=amount;effects.push({type:'mana',amount});}
  if(isObject(item.buff)){
    const buffStats={};for(const [key,value] of Object.entries(item.buff)){const safe=finite(value,0);if(safe)buffStats[key]=safe;}
    if(Object.keys(buffStats).length){game.temporaryBuffs.push({id:`consumable-${item.baseId}-${Date.now()}-${Math.random().toString(16).slice(2,8)}`,name:item.name,stats:buffStats,expiresCombats:3});effects.push({type:'buff',combats:3,stats:buffStats});}
  }
  if(!effects.length)return null;
  const consumed={...item,cleanse:[...(item.cleanse||[])]};removeConsumableStack(p,item);saveGame(game);return {item:consumed,effects};
}
function spendEnergy(game,amount){const numeric=Number(amount);if(!Number.isFinite(numeric)||numeric<=0)return false;const cost=whole(numeric,1,10000,1);regenerateOffline(game);if(game.energy.current<cost)return false;game.energy.current=Math.max(0,game.energy.current-cost);game.energy.lastUpdate=Date.now();saveGame(game);return true;}

const manifest = Object.freeze({
  attack: './sfx/attack.wav',
  click: './sfx/block.wav',
  magic: './sfx/magic.wav',
  potion: './sfx/potion.wav',
  victory: './sfx/victory.wav',
  levelUp: './sfx/level-up.wav'
});

const cache = new Map();
const eventSound={onAttack:'attack',onCrit:'attack',onHeal:'potion',onBossStart:'magic',onLegendaryDrop:'victory',onVictory:'victory'};

const AudioSystem = {
  enabled: false,
  trigger(name) {
    const source = manifest[name];
    if (!this.enabled || !source) return;
    if (!cache.has(name)) cache.set(name, new Audio(source));
    const sound = cache.get(name).cloneNode();
    sound.volume = .55;
    sound.play().catch(() => {});
  },
  emit(name,detail={}) {
    if (typeof window!=='undefined') window.dispatchEvent(new CustomEvent(`cryptoquest:${name}`,{detail}));
    const sound=eventSound[name];if(sound)this.trigger(sound);
  },
  setEnabled(value) { this.enabled = Boolean(value); }
};

function renderAdventure(){const activeEvent=game.mapEvent&&game.mapEvent.expiresAt>Date.now()?MAP_EVENTS.find(event=>event.id===game.mapEvent.id):null;return `<div class="adventure-screen">${screenHead('CAMPAÑA','Mundo de Aether',`${game.progress.completed.length} ⚔`)}${activeEvent?`<div class="modifier-banner map-event"><b>${activeEvent.icon} ${activeEvent.name}</b><span>Evento activo en ${MAPS.find(map=>map.id===game.mapEvent.zoneId)?.name} · botín y reputación extra</span></div>`:''}<div class="difficulty-row">${Object.values(DIFFICULTIES).map(d=>`<button data-difficulty="${d.id}" class="${game.difficulty===d.id?'active':''}" ${game.player.level<d.requirement||(d.prestige||0)>(game.player.prestige?.level||0)?'disabled':''}>${d.name}<small>${d.id==='normal'?'BASE':`LV ${d.requirement}`}</small></button>`).join('')}</div><div class="map-path">${MAPS.map((map,mi)=>{const locked=mi>game.progress.unlockedMap;return `<section class="map-zone ${locked?'locked':''}"><div class="map-banner"><i>${map.icon}</i><div><small>ZONA ${mi+1} · NIVEL ${map.range}</small><h3>${map.name}</h3><em>${map.material}</em></div>${locked?'<b>🔒</b>':''}</div>${map.nodes.map((id,ni)=>{const e=ENEMIES[id],key=`${mi}-${ni}`,done=game.progress.completed.includes(key),open=!locked&&(mi<game.progress.unlockedMap||ni<=game.progress.unlockedNode);return `<div class="path-step ${done?'done':''} ${open?'':'locked'} ${e.boss?'boss':''}"><div class="path-line"></div><button data-fight="${mi}:${ni}" ${open?'':'disabled'}><span class="node-icon">${done?'✓':open?e.icon:'🔒'}</span><span class="node-info"><b>${e.boss?'JEFE · ':e.miniboss?'MINIBOSS · ':''}${e.name}</b><small>LVL ${e.level} · PODER ${Math.round(e.hp*.35+e.attack*3)}</small><em>+${e.xp} EXP · +${e.gold} 🪙</em></span><span class="node-arrow">›</span></button></div>`;}).join('')}</section>`;}).join('')}</div></div>`;}

function zoneState(mi,mastery){if(mi>game.progress.unlockedMap)return 'BLOQUEADA';if(mastery>=100)return 'DOMINADA';const map=MAPS[mi],done=map.nodes.every((_,ni)=>game.progress.completed.includes(`${mi}-${ni}`));if(done)return 'COMPLETADA';if(mi===game.progress.unlockedMap||mastery>0)return 'EN PROGRESO';return 'DISPONIBLE';}
function renderAdventureV9(){const active=game.mapEvent?.v9?ZONE_EVENTS.find(event=>event.id===game.mapEvent.eventId):game.mapEvent&&game.mapEvent.expiresAt>Date.now()?MAP_EVENTS.find(event=>event.id===game.mapEvent.id):null;return `<div class="adventure-screen">${screenHead('CAMPAÑA V9','Mundo de Aether',`${game.progress.completed.length} ⚔`)}${game.nemesis?`<div class="nemesis-banner"><b>☠ NÉMESIS · ${game.nemesis.name}</b><span>${game.nemesis.victories} victoria${game.nemesis.victories!==1?'s':''} contra ti · puede reaparecer en ${MAPS.find(m=>m.id===game.nemesis.zone)?.name||'su zona'}</span></div>`:''}${active?`<div class="modifier-banner map-event"><b>${active.icon} ${active.name}</b><span>${active.text||'Evento activo'}${game.mapEvent?.pending?' · DECISIÓN PENDIENTE':''}</span></div>`:''}<div class="difficulty-row">${Object.values(DIFFICULTIES).map(d=>`<button data-difficulty="${d.id}" class="${game.difficulty===d.id?'active':''}" ${game.player.level<d.requirement||(d.prestige||0)>(game.player.prestige?.level||0)?'disabled':''}>${d.name}<small>${d.id==='normal'?'BASE':`LV ${d.requirement}`}</small></button>`).join('')}</div><div class="map-path">${MAPS.map((map,mi)=>{const locked=mi>game.progress.unlockedMap,mastery=game.zoneMastery[map.id]||0,discovered=map.nodes.filter(id=>game.codex.seen.includes(id)).length,missionCount=Object.values(QUESTS).filter(q=>q.objective?.id===map.boss||q.chapter===Math.floor(mi/2)+1).length,state=zoneState(mi,mastery);return `<section class="map-zone v9-zone ${locked?'locked':''}"><div class="map-banner"><i>${map.icon}</i><div><small>ZONA ${mi+1} · NIVEL ${map.range} · ${state}</small><h3>${map.name}</h3><em>${map.material} · ${discovered}/${map.nodes.length} enemigos · ${missionCount} misiones</em></div>${locked?'<b>🔒</b>':`<strong>${mastery}%</strong>`}</div><div class="mastery-track"><i style="width:${mastery}%"></i>${Object.keys(ZONE_MILESTONES).map(v=>`<span style="left:${v}%" class="${mastery>=Number(v)?'claimed':''}">${v}</span>`).join('')}</div><div class="zone-facts"><span>JEFE · ${ENEMIES[map.boss].name}</span><span>RECOMPENSA · ${map.recipeId}</span></div>${map.nodes.map((id,ni)=>{const e=ENEMIES[id],key=`${mi}-${ni}`,done=game.progress.completed.includes(key),open=!locked&&(mi<game.progress.unlockedMap||ni<=game.progress.unlockedNode);return `<div class="path-step ${done?'done':''} ${open?'':'locked'} ${e.boss?'boss':''}"><div class="path-line"></div><button data-fight="${mi}:${ni}" ${open?'':'disabled'}><span class="node-icon">${done?'✓':open?e.icon:'🔒'}</span><span class="node-info"><b>${e.boss?'JEFE · ':e.miniboss?'MINIBOSS · ':''}${e.name}</b><small>${ENEMY_ARCHETYPES[e.archetype]?.name||'BOSS'} · LVL ${e.level}</small><em>+${e.xp} EXP · +${e.gold} 🪙</em></span><span class="node-arrow">›</span></button></div>`;}).join('')}</section>`;}).join('')}</div></div>`;}
function renderAdventureV10(){
  const active=game.mapEvent?.v9?ZONE_EVENTS.find(event=>event.id===game.mapEvent.eventId):game.mapEvent&&game.mapEvent.expiresAt>Date.now()?MAP_EVENTS.find(event=>event.id===game.mapEvent.id):null;

function renderTransmutation(){const gems=Object.values(GEMS).filter(g=>g.tier<3);return `${screenHead('ALQUIMIA DE AETHER','Transmutación')}<article class="content-card"><div><small>MATERIAL</small><h3>CRISTALES SUPERIORES</h3><p>5 Cristales → 1 Fragmento Rúnico</p></div><button data-transmute="crystal">CREAR</button></article><article class="content-card"><div><small>MATERIAL LEGENDARIO</small><h3>NÚCLEO DE JEFE</h3><p>4 Fragmentos Legendarios → 1 Núcleo de Jefe</p></div><button data-transmute="legendary">CREAR</button></article><article class="content-card"><div><small>MASCOTAS</small><h3>PIEDRA DE REFORJA</h3><p>5 Esencias de Compañero → 1 Piedra de Reforja</p></div><button data-transmute="pet">CREAR</button></article>${gems.map(g=>`<article class="content-card"><div><small>GEMA · NIVEL ${g.tier}</small><h3>${g.name}</h3><p>3 iguales → siguiente nivel · tienes ${game.player.gems[g.id]||0}</p></div><button data-transmute-gem="${g.id}">FUSIONAR</button></article>`).join('')}`;}
function renderEndgame(){const e=game.endgame,p=game.player,world=currentWorldBoss(),pity=game.pity.worldBoss[world.pityKey]||0;if(p.level<50)return `${screenHead('NIVEL 50','Endgame')}<div class="empty-state">🔒<b>Alcanza nivel 50 para desbloquear Prestigio, Heroicas, Jefe Mundial y Boss Rush.</b></div>`;return `${screenHead('ENDGAME DESBLOQUEADO','Mapa de desafíos',`PRESTIGIO ${p.prestige.level}`)}${bar('exp',p.prestige.exp,prestigeXp(p.prestige.level),'EXP DE PRESTIGIO')}<div class="endgame-grid"><button data-open="dungeons"><b>HEROICAS</b><span>${game.statistics.dungeonsCompleted} completadas</span></button><button data-open="tower"><b>TORRE</b><span>${game.activities.tower.bestFloor}/200</span></button><button data-open="arena"><b>ARENA</b><span>Oleada ${game.activities.arena.maxWave}</span></button><button data-open="factions"><b>REPUTACIÓN</b><span>Caches tras Exaltado</span></button><button data-open="collections"><b>SETS</b><span>${game.collections.sets.length}/${Object.keys(SETS).length}</span></button></div><article class="activity-card world-boss"><i>${world.icon}</i><div><small>ROTACIÓN LOCAL · PITY ${pity}/5</small><h3>${world.name}</h3><p>Jefe mundial con fases, escudos y recompensa especial.</p></div><button data-action="world-boss">DESAFIAR</button></article><article class="activity-card"><i>👑</i><div><small>MEJOR RACHA ${e.bossRush.best} · ${e.bossRush.bestTurns||'—'} TURNOS</small><h3>DESAFÍO DE JEFES</h3><p>HP y maná persisten entre encuentros.</p><div class="mini-difficulty">${['normal','veteran','nightmare'].map(id=>{const difficulty=DIFFICULTIES[id],locked=p.level<difficulty.requirement||(difficulty.prestige||0)>(p.prestige?.level||0);return `<button data-rush-difficulty="${id}" class="${e.bossRush.difficulty===id?'active':''}" ${locked?'disabled':''}>${difficulty.name}</button>`;}).join('')}</div></div><button data-action="boss-rush">${e.bossRush.active?`JEFE ${e.bossRush.current+1}`:'INICIAR'}</button></article><p class="activity-note">Prestigio otorga caches, materiales y puntos ocasionales; el poder principal procede de builds, sets, maestría y dificultad.</p>`;}
function renderDungeons(){const active=game.activities.dungeon,modifier=Object.values(DUNGEON_MODIFIERS)[new Date().getUTCDate()%Object.keys(DUNGEON_MODIFIERS).length];return `${screenHead('10 MAZMORRAS','Mazmorras',`⚡ ${game.energy.current} · ${energyTimer()}`)}<div class="modifier-banner"><b>${modifier.name}</b><span>${modifier.description}</span></div>${DUNGEONS.map(d=>{const locked=game.player.level<d.level||(d.prestige||0)>(game.player.prestige?.level||0),run=active?.id===d.id;return `<article class="activity-card"><i>${d.icon}</i><div><small>NIVEL ${d.level}${d.prestige?` · PRESTIGIO ${d.prestige}`:""} · PODER ${d.recommendedPower}</small><h3>${d.name}</h3><p>${d.rooms.length} salas · ${DIFFICULTIES[game.difficulty].name} · ${DIFFICULTIES[game.difficulty].affixes} afijos${d.lootSet?` · SET ${SETS[d.lootSet]?.name||d.lootSet}`:''}</p><em>⚡ ${d.energy} · ${d.reward.xp} EXP · ${d.reward.gold} ORO</em></div><button data-dungeon="${d.id}" ${locked?'disabled':''}>${run?`SALA ${active.room+1}`:'ENTRAR'}</button></article>`;}).join('')}`;}
function renderDungeonsV9(){const active=game.activities.dungeon,rotation=localAffixRotation(),family=id=>FAMILY_TRAITS[ENEMIES[id]?.family]?.name||'Mixta';return `${screenHead('LLAVES DE DESAFÍO','Mazmorras V15',`⚡ ${game.energy.current}`)}<div class="modifier-banner"><b>${rotation.map(a=>a.name).join(' · ')}</b><span>Rotación local semanal · niveles 4/7/10 añaden afijos</span></div>${DUNGEONS.map(d=>{const locked=game.player.level<d.level||(d.prestige||0)>(game.player.prestige?.level||0),run=active?.id===d.id,otherRun=Boolean(active&&!run),max=game.challengeKeys.levels[d.id]||0,selected=Math.min(max,game.challengeKeys.selected[d.id]??max),boss=ENEMIES[d.rooms.at(-1)],wish=game.wishlist.some(id=>UNIQUE_ITEMS[id]?.setId===d.lootSet||id===d.lootSet);return `<article class="dungeon-card-v9 ${wish?'wish-source':''}"><div class="dungeon-main"><i>${d.icon}</i><div><small>${family(d.rooms[0])} · ${d.rooms.length} ENCUENTROS · JEFE ${boss?.name}</small><h3>${d.name}${selected?` +${selected}`:''}</h3><p>Mecánica: ${d.id.includes('fire')||d.id.includes('blood')?'controlar Quemaduras y ataques cargados':d.id.includes('mine')||d.id.includes('titan')?'romper estabilidad de constructos':'gestionar estados y élites'}.</p><em>${d.lootSet?`BOTÍN · ${SETS[d.lootSet]?.name||d.lootSet}`:'BOTÍN ESPECÍFICO · materiales y recetas'}${wish?' · ★ CONTIENE UN OBJETIVO':''}</em></div></div><div class="key-row"><button data-key="${d.id}:${Math.max(0,selected-1)}" ${selected<=0||otherRun?'disabled':''}>−</button><span>${otherRun?'OTRA MAZMORRA EN CURSO':`LLAVE ${selected?`+${selected}`:'BASE'} · MÁX ${max||'—'}`}</span><button data-key="${d.id}:${Math.min(max,selected+1)}" ${selected>=max||otherRun?'disabled':''}>+</button><button data-dungeon="${d.id}" ${locked||otherRun?'disabled':''}>${run?`SALA ${active.room+1}`:otherRun?'EN CURSO':'ENTRAR'}</button></div></article>`;}).join('')}`;}

function renderExpeditions(){const state=game.expeditions,run=state.active;if(!run)return `${screenHead('RUTAS ROGUELITE','Expediciones',`${state.completed} COMPLETADAS`)}<p class="activity-note">Cadena de 6 nodos. Elige seguridad o riesgo; las reliquias duran solo durante la expedición.</p><div class="tier-grid">${[1,2,3,4,5].map(t=>`<button data-start-expedition="${t}" ${t>state.bestTier?'disabled':''}><b>T${t}</b><span>${t===1?'Mecánicas base':t<4?'Más afijos y élites':'Botín y patrones avanzados'}</span></button>`).join('')}</div>`;const modifier=EXPEDITION_MODIFIERS[run.modifier],stage=EXPEDITION_STAGES[run.stage]||[];return `${screenHead(`TIER ${run.tier}`,'Expedición activa',`NODO ${Math.min(6,run.stage+1)}/6`)}<div class="modifier-banner"><b>${modifier.name}</b><span>${modifier.description}</span></div><div class="expedition-path">${EXPEDITION_STAGES.map((_,i)=>`<i class="${i<run.stage?'done':i===run.stage?'active':''}">${i<run.stage?'✓':i+1}</i>`).join('')}</div>${run.status==='failed'?'<div class="empty-state">La expedición ha fracasado. Las reliquias se perderán.</div><button class="primary full" data-action="abandon-expedition">SALIR</button>':`<div class="route-choice">${stage.map((node,i)=>`<button data-expedition-node="${i}" class="${node.risk==='danger'?'danger-route':''}"><small>${node.risk==='safe'?'RUTA SEGURA':node.risk==='boss'?'FINAL':'RUTA PELIGROSA'}</small><b>${node.name}</b><span>${({combat:'Combate',elite:'Élite · reliquia',event:'Evento con decisión',treasure:'Tesoro · mejor recompensa',rest:'Descanso',merchant:'Mercader errante',boss:'Boss · recompensa final'})[node.type]}</span></button>`).join('')}</div>`}<h3 class="section-title">RELIQUIAS TEMPORALES</h3><div class="relic-strip">${run.relics.map(id=>{const r=EXPEDITION_RELICS[id];return `<span>${r.icon}<b>${r.name}</b><small>${r.description}</small></span>`;}).join('')||'<small>Aún no has obtenido reliquias.</small>'}</div>`;}

function renderCollectionsV9(){const p=game.player,uniques=Object.values(UNIQUE_ITEMS).filter(item=>item.classId===p.classId);return `${renderCollections()}<h3 class="section-title">LOOT TARGETING · OBJETIVOS</h3>${uniques.slice(0,18).map((item,index)=>{const source=DUNGEONS[index%DUNGEONS.length],wanted=game.wishlist.includes(item.id);return `<div class="target-row"><span><b>${item.name}</b><small>FUENTE · ${source.name} · ${ENEMIES[source.rooms.at(-1)]?.name}</small></span><button data-wishlist="${item.id}" class="${wanted?'active':''}">${wanted?'★ OBJETIVO':'☆ MARCAR'}</button></div>`;}).join('')}`;}
function renderTower(){const t=game.activities.tower,f=Math.min(200,t.currentFloor),isBoss=f%10===0,isElite=f%5===0,complete=t.bestFloor>=200;return `${screenHead('TORRE DEL ABISMO','200 pisos',`RÉCORD ${t.bestFloor}/200`)}<div class="tower-visual"><span>${isBoss?'👑':isElite?'💀':'🗼'}</span><b>PISO ${f}</b><small>${isBoss?'BOSS':isElite?'ÉLITE':'ENCUENTRO'} · MODIFICADOR ${1+Math.floor(f/25)}</small></div><button class="primary full" data-action="tower-fight" ${complete?'disabled':''}>${complete?'TORRE COMPLETADA':`DESAFIAR PISO ${f}`}</button><div class="milestones"><b>CHECKPOINTS</b><span>10 · 25 · 50 · 75 · 100 · 125 · 150 · 175 · 200</span></div>`;}
function renderArena(){const a=game.activities.arena,w=a.currentWave;return `${screenHead('ARENA ROGUELITE','Oleadas de Aether',`RÉCORD ${a.maxWave}`)}<div class="tower-visual arena"><span>🏟️</span><b>OLEADA ${w}</b><small>DIFICULTAD +${Math.round((Math.pow(1.09,w)-1)*100)}%</small></div>${game.endgame.arenaBlessings.length?`<div class="blessing-strip">${game.endgame.arenaBlessings.map(id=>`<span>${ARENA_BLESSINGS[id].name} · ${ARENA_BLESSINGS[id].description}</span>`).join('')}</div>`:''}<button class="primary full" data-action="arena-fight">INICIAR OLEADA ${w}</button>${w>1?'<button class="secondary full" data-action="reset-arena">CERRAR RUN · COBRAR Y REINICIAR</button>':''}<p class="activity-note">Cada 5 victorias eliges 1 de 3 bendiciones. Se pierden al cerrar la run; las recompensas permanecen.</p>`;}
function renderBestiary(){const view=game.contentView,families=[...new Set(Object.values(ENEMIES).map(enemy=>enemy.family))],filtered=Object.values(ENEMIES).filter(enemy=>(view.bestiaryFamily==='all'||enemy.family===view.bestiaryFamily)&&(!view.bestiaryQuery||enemy.name.toLowerCase().includes(view.bestiaryQuery.toLowerCase()))),page=Math.min(Math.max(0,view.bestiaryPage||0),Math.max(0,Math.ceil(filtered.length/25)-1)),shown=filtered.slice(page*25,page*25+25);return `${screenHead('CODEX',`Bestiario ${game.codex.seen.length}/${Object.keys(ENEMIES).length}`)}<div class="content-tools"><input data-content-query="bestiaryQuery" placeholder="Buscar enemigo" value="${esc(view.bestiaryQuery)}"><select data-content-filter="bestiaryFamily"><option value="all">Todas las familias</option>${families.map(id=>`<option value="${id}" ${view.bestiaryFamily===id?'selected':''}>${FAMILY_TRAITS[id]?.name||id}</option>`).join('')}</select></div>${shown.map(enemy=>{const kills=game.codex.kills[enemy.id]||0,seen=kills>0;return `<article class="bestiary-card ${seen?'':'locked'}"><i>${seen?enemy.icon:'?'}</i><div><small>${seen?`${FAMILY_TRAITS[enemy.family]?.name||enemy.family} · ${ENEMY_ARCHETYPES[enemy.archetype]?.name||'BOSS'} · ${MAPS.find(map=>map.id===enemy.zone)?.name}`:'NO DESCUBIERTO'}</small><h3>${seen?enemy.name:'???'}</h3>${kills>=5?`<p>LV ${enemy.level} · Débil: ${FAMILY_TRAITS[enemy.family]?.weakness} · Resiste: ${FAMILY_TRAITS[enemy.family]?.resistance}</p>`:'<p>5 derrotas revelan resistencias.</p>'}<em>Derrotado ${kills} · ${kills>=25?`Drops raros: ${game.codex.drops[enemy.id]?.join(', ')||'sin registrar'}`:kills>=10?`Drops comunes: ${game.codex.drops[enemy.id]?.join(', ')||'por descubrir'}`:'10 derrotas revelan drops'}</em></div></article>`;}).join('')}${renderPager('bestiary',page,filtered.length,25)}`;}
function renderAchievements(){const category=game.contentView.achievementCategory||'all',categories=[...new Set(Object.values(ACHIEVEMENTS).map(item=>item.category))],shown=Object.values(ACHIEVEMENTS).filter(item=>category==='all'||item.category===category).slice(0,35);return `${screenHead('75+ DESAFÍOS','Logros',`${game.achievements.unlocked.length}/${Object.keys(ACHIEVEMENTS).length}`)}<select class="content-filter" data-content-filter="achievementCategory"><option value="all">Todas las categorías</option>${categories.map(id=>`<option value="${id}" ${category===id?'selected':''}>${id}</option>`).join('')}</select>${shown.map(a=>{const value=Math.min(a.target,game.statistics[a.metric]||0),done=game.achievements.unlocked.includes(a.id);return `<article class="content-card achievement ${done?'done':''}"><div><small>${a.category}</small><h3>${done?'🏆 ':''}${a.name}</h3><p>${a.description}</p><div class="quest-progress"><i style="width:${pct(value,a.target)}%"></i></div><em>${value}/${a.target} · ${a.reward} ORO</em></div></article>`;}).join('')}`;}
function renderMailbox(){const pending=game.player.mailbox.filter(mail=>!mail.claimed);return `${screenHead('RECOMPENSAS LOCALES','Buzón',`${pending.length} PENDIENTES`)}${game.player.mailbox.map(mail=>`<article class="content-card ${mail.claimed?'claimed':''}"><div><small>${new Date(mail.at||Date.now()).toLocaleDateString('es')}</small><h3>${mail.subject}</h3><p>${Object.entries(mail.reward?.materials||{}).map(([id,n])=>`${MATERIALS[id]?.name||id} x${n}`).join(' · ')||`${mail.reward?.gold||0} oro`}</p></div><b>${mail.claimed?'✓':'PENDIENTE'}</b></article>`).join('')||'<div class="empty-state">✉️<b>No hay recompensas pendientes.</b></div>'}${pending.length?'<button class="primary full" data-action="claim-mail">RECLAMAR TODO</button>':''}`;}
function renderMerchant(){const stock=getMerchantStock();return `${screenHead('OFERTAS DEL DÍA','Mercader',`${game.player.gold} 🪙`)}<button class="sell-junk" data-action="sell-junk">VENDER BASURA MARCADA</button>${stock.map((x,i)=>{const data=x.kind==='consumable'?CONSUMABLES[x.id]:x.kind==='material'?MATERIALS[x.id]:x.kind==='gem'?GEMS[x.id]:x.kind==='recipe'?RECIPES.find(r=>r.id===x.id):ITEM_TEMPLATES.find(t=>t.baseId===x.id),owned=x.kind==='recipe'&&game.player.learnedRecipes.includes(x.id);return `<article class="shop-row"><i>${data?.icon||'📜'}</i><span><b>${data?.name||x.id}${x.quantity?` x${x.quantity}`:''}</b><small>${x.kind.toUpperCase()}${i>=5?' · ROTACIÓN DIARIA':''}</small></span><strong>${x.price} 🪙</strong><button data-buy="${i}" ${owned?'disabled':''}>${owned?'APRENDIDA':'COMPRAR'}</button></article>`;}).join('')}`;}
function renderSmith(){const items=[...game.player.inventory,...Object.values(game.player.equipment).filter(Boolean)].filter(i=>i.type==='equipment');return `${screenHead('HERRERÍA','Forja de Aether',`${game.player.materials.iron||0} HIERRO`)}${items.map(i=>{const cost=Math.round(30*Math.pow(1.42,(i.upgrade||0)+1)+(i.level||1)*8);return `<article class="shop-row"><i>${i.icon}</i><span><b>${i.name} +${i.upgrade||0}</b><small>${rarityLabel(i.rarity)} · ${i.itemPower} PODER</small></span><strong>${i.upgrade>=10?'MÁX':`${cost} 🪙`}</strong><button data-smith="${i.uid||i.id}" ${i.upgrade>=10?'disabled':''}>MEJORAR</button></article>`;}).join('')||'<div class="empty-state">No tienes equipo para mejorar.</div>'}`;}
function renderBank(embedded=false){const p=game.player,bank=p.bank.tabs[0],bankFull=bank.length>=p.bank.capacity,bagFull=p.inventory.length>=p.inventoryCapacity;return `${embedded?'':screenHead('ALMACENAMIENTO','Banco',`${bank.length}/${p.bank.capacity}`)}<div class="bank-columns"><section><h3>MOCHILA</h3>${p.inventory.map(i=>`<button data-bank-store="${i.uid||i.id}" ${bankFull?'disabled':''}>${i.icon}<span>${i.name}</span><b>${bankFull?'BANCO LLENO':'GUARDAR ›'}</b></button>`).join('')||'<small>Vacía</small>'}</section><section><h3>BANCO · PESTAÑA 1</h3>${bank.map(i=>`<button data-bank-take="${i.uid||i.id}" ${bagFull?'disabled':''}>${i.icon}<span>${i.name}</span><b>${bagFull?'BOLSA LLENA':'‹ RETIRAR'}</b></button>`).join('')||'<small>Vacío</small>'}</section></div>`;}
